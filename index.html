<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시장모니터링 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css">
<style>
  :root{
    --bg-side:#1b1e21;
    --bg-side-2:#232629;
    --line:rgba(255,255,255,.09);
    --text-main:#eeeeee;
    --text-dim:#8a9096;
    --accent:#c9a24a;
    --accent-ink:#1b1e21;
    --card:#202327;
    --card-hover:#2a2d31;
    --grid-line:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:.1px;line-height:1.5;}
  body{background:#141618;color:var(--text-main);}
  #app{display:flex;flex-direction:column;height:100vh;}

  .blueprint-grid{
    background-color:var(--bg-side);
  }

  /* top bar */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brand{font-weight:600;font-size:20px;letter-spacing:1px;margin-right:6px;white-space:nowrap;text-transform:uppercase;color:var(--text-main);text-decoration:underline;text-underline-offset:4px;}
  .sync-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--text-dim);background:var(--bg-side-2);}
  .sync-status.ok{color:#7fbf7f;border-color:rgba(127,191,127,.4);}
  .sync-status.offline{color:#f0b429;border-color:rgba(240,180,41,.4);}
  .sync-status.loading{color:var(--text-dim);}
  .search-box{flex:0 1 320px;min-width:160px;display:flex;align-items:center;background:var(--bg-side-2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;}
  .search-box input{background:transparent;border:none;outline:none;color:var(--text-main);font-size:11px;width:100%;}
  .search-box input::placeholder{color:var(--text-dim);}
  .manager-filter{flex:0 0 auto;max-width:132px;background:var(--bg-side-2);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--text-main);font-size:11px;outline:none;cursor:pointer;}
  .btn{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s;letter-spacing:.2px;}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .btn-primary:hover{background:#ffc933;}
  .btn-ghost{background:var(--bg-side-2);color:var(--text-main);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--card-hover);border-color:var(--accent);}
  .file-label{display:inline-flex;}

  /* stage tabs */
  .tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{flex:none;padding:6px 14px;border-radius:999px;background:var(--bg-side-2);color:var(--text-dim);font-size:12px;cursor:pointer;border:1px solid var(--line);white-space:nowrap;display:flex;gap:6px;align-items:center;}
  .tab.active{background:var(--accent);color:var(--accent-ink);border-style:solid;font-weight:600;}
  .tab .count{opacity:.8;font-size:12px;}
  #officeTabs{background:var(--bg-side-2);}
  #officeTabs .tab{font-weight:650;}

  /* main layout */
  .main{flex:1;display:flex;min-height:0;}
  .sidebar{width:340px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .sidebar-head{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);margin-bottom:4px;}
  .sidebar::before{content:none;}
  .sidebar-head h2{font-size:12px;margin:0;letter-spacing:normal;color:var(--text-dim);}
  .sidebar-head span{color:var(--accent);font-size:12px;font-weight:600;}
  .list{flex:1;overflow-y:auto;padding:6px 10px 20px;display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;align-content:start;}
  .list .card{margin-bottom:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;position:relative;}
  .card.card-stale-warn{border-left:3px solid #f0c33c;}
  .card.card-stale-danger{border-left:3px solid #ff5c5c;}
  .card-compact{padding:9px 26px 9px 10px;margin-bottom:0;border-radius:12px;}
  .card-compact[draggable="true"]{cursor:grab;}
  .card-compact .card-name{font-weight:650;font-size:13.5px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.28;padding-right:18px;word-break:keep-all;}
  .card-compact .card-type-line{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .card-compact .card-date{margin-top:5px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-compact .card-actions{position:absolute;top:6px;right:6px;flex-direction:row;gap:3px;}
  .card-compact .card-actions button{flex:none;padding:1px 5px;font-size:10px;}
  @media (max-width:480px){ .list{grid-template-columns:1fr;} }

  .card:hover{background:var(--card-hover);border-color:var(--accent);}
  .card.selected{border-color:var(--accent);}
  .card-top{display:flex;justify-content:flex-start;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .card-name{font-weight:650;font-size:15px;letter-spacing:.1px;word-break:keep-all;}
  .badge{font-size:10px;font-weight:600;padding:3px 10px 3px 8px;border-radius:20px;color:var(--text-main);white-space:nowrap;letter-spacing:.2px;background:var(--bg-side-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .stage-inline{font-size:10px;font-weight:600;color:var(--accent);white-space:nowrap;}
  .card-sub{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .card-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .tag-pill{font-size:12px;padding:2px 7px;border-radius:10px;background:transparent;color:var(--text-dim);border:1px dashed var(--line);}
  .card-date{margin-top:8px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .card-row{display:flex;flex-direction:column;gap:6px;}
  .card-main{flex:1;min-width:0;}
  .card-actions{display:flex;flex-direction:row;gap:6px;margin-top:0;flex:none;}
  .card-actions button{flex:1;font-size:10px;padding:2px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;}
  .card-actions button:hover{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);}
  .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 16px;}

  .map-wrap{flex:1;position:relative;}
  #map{width:100%;height:100%;background:#b3b3b3;}
  .leaflet-tile-pane{filter:grayscale(1) brightness(.95) contrast(1);}
  
  .district-pill{background:rgba(15,15,18,.92);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:3px 8px;font-size:10px;font-weight:600;white-space:nowrap;display:flex;gap:4px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .district-pill .n{color:var(--accent);}
  .site-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.25);cursor:pointer;}
  .site-label{color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);border:none;}
  .site-label:hover{background:var(--accent);color:var(--accent-ink);}
  .leaflet-tooltip{background:#fff;color:#111;border:none;border-radius:4px;padding:4px 9px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .leaflet-tooltip-top:before{border-top-color:#fff;}
  .clear-filter{position:absolute;top:56px;left:12px;z-index:500;}
  .office-switcher{position:absolute;bottom:12px;right:12px;z-index:500;display:flex;gap:6px;}
  .office-btn{background:var(--bg-side-2);color:var(--text-main);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .office-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .print-confirm-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:900;display:none;gap:8px;align-items:center;background:rgba(15,15,18,.85);padding:8px 10px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  body.print-mode .print-confirm-bar{display:flex;}
  @media print{ .print-confirm-bar{display:none !important;} }

  .region-panel{position:absolute;top:90px;right:12px;z-index:500;background:var(--bg-side);border:1px solid var(--line);border-radius:12px;padding:0 10px 10px;width:200px;max-height:60vh;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .region-drag-handle{position:sticky;top:0;background:var(--bg-side);margin:0 -10px 8px;padding:8px 10px 6px;cursor:grab;font-size:11px;color:var(--text-dim);border-bottom:1px dashed var(--line);user-select:none;}
  .region-drag-handle:active{cursor:grabbing;}
  .region-crumb{font-size:11px;color:var(--text-dim);margin-bottom:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .region-crumb .crumb-link{cursor:pointer;color:var(--accent);}
  .region-crumb .crumb-link:hover{text-decoration:underline;}
  .region-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .region-item{background:var(--bg-side-2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:11.5px;text-align:center;cursor:pointer;color:var(--text-main);}
  .region-item:hover{background:var(--card-hover);}
  .region-item.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(3,12,22,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--bg-side);border:1px solid var(--accent);border-radius:10px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:18px;box-shadow:0 0 0 1px rgba(255,183,3,.15), 0 20px 60px rgba(0,0,0,.5);}
  .modal h3{margin:0 0 14px;font-size:14px;letter-spacing:normal;color:var(--accent);}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;letter-spacing:normal;}
  .field input,.field select,.field textarea{width:100%;background:var(--bg-side-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text-main);font-size:13px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:50px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.5;}

  /* detail view */
  .detail{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;min-height:0;}
  .back-btn{background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;padding:0;margin-bottom:12px;text-align:left;letter-spacing:normal;}
  .back-btn:hover{color:var(--accent);}
  .badge-row{display:flex;gap:6px;margin-bottom:8px;}
  .detail-name{margin:0 0 2px;font-size:20px;font-weight:650;letter-spacing:.1px;}
  .detail-sub{color:var(--text-dim);font-size:12px;margin-bottom:16px;}

  .stepper{display:flex;align-items:flex-start;margin-bottom:14px;}
  .step{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer;}
  .step .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--bg-side-2);margin-bottom:6px;}
  .step.done .dot{background:var(--text-dim);border-color:var(--text-dim);}
  .step.active .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,183,3,.25);}
  .step-label{font-size:12px;color:var(--text-dim);text-align:center;line-height:1.3;}
  .step.active .step-label{color:var(--accent);font-weight:600;}
  .step-line{flex:0 0 12px;height:1px;background:var(--line);margin-top:6px;border-top:1px dashed var(--line);}



  .detail-tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .dtab{font-size:12px;color:var(--text-dim);padding:0 0 9px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:normal;}
  .dtab.active{color:var(--accent);border-color:var(--accent);font-weight:600;}
  .dtab-count{background:var(--accent);color:var(--accent-ink);font-size:12px;border-radius:8px;padding:1px 6px;margin-left:2px;font-weight:600;}

  .detail-body{flex:1;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
  .spec-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .spec-line{font-size:13px;line-height:1.9;font-family:inherit;position:relative;padding-left:16px;}
  .spec-line::before{content:'';position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:2px;background:var(--accent);}
  .spec-divider{border-top:1px dashed var(--line);margin:10px 0;}
  .spec-heading{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent);}
  .spec-stage-detail{font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--text-main);}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;}
  .info-label{font-size:12px;color:var(--text-dim);margin-bottom:2px;letter-spacing:normal;}
  .info-value{font-size:12px;font-weight:600;}
  .visit-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);padding:8px 2px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin-bottom:14px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .section-head span{font-size:12px;font-weight:600;letter-spacing:normal;color:var(--text-dim);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .kv{margin-bottom:14px;}
  .kv .k{font-size:12px;color:var(--text-dim);margin-bottom:4px;letter-spacing:normal;}
  .kv .v{font-size:13px;}
  .kv .v.pre{white-space:pre-wrap;line-height:1.6;}
  .edit-field{margin-bottom:12px;}
  .edit-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;letter-spacing:normal;}
  .edit-field textarea, .edit-field input{width:100%;background:var(--bg-side-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text-main);font-size:13px;font-family:inherit;}
  .edit-field textarea{min-height:70px;resize:vertical;}

  .log-add{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .log-date-wrap{position:relative;flex:1 1 130px;min-width:120px;}
  .log-date-wrap input[type=date]{width:100%;box-sizing:border-box;background:var(--bg-side-2);border:1px solid var(--line);border-radius:10px;padding:7px 26px 7px 8px;color:var(--text-main);font-size:12px;}
  /* 브라우저가 그리는 원래 달력 아이콘은 검은색이라 안 보여서 완전히 투명하게 숨기고,
     같은 자리에 우리가 직접 흰색 SVG 달력 아이콘을 그려서 겹쳐 놓음(클릭은 그대로 원래 인풋이 받음) */
  .log-date-wrap input[type=date]::-webkit-calendar-picker-indicator{
    opacity: 0;
    position: absolute;
    right: 0; top: 0;
    width: 26px; height: 100%;
    cursor: pointer;
    margin: 0;
  }
  .log-date-wrap::after{
    content:'';
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; pointer-events:none;
    background-color:#fff;
    -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 7H5v11h14V9z"/></svg>') center/contain no-repeat;
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 7H5v11h14V9z"/></svg>') center/contain no-repeat;
  }
  .log-add input[type=text]{flex:2 1 160px;min-width:0;background:var(--bg-side-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--text-main);font-size:12px;}
  .log-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;}
  .log-date{font-size:12px;color:var(--accent);font-weight:600;flex:none;white-space:nowrap;padding-top:1px;}
  .log-text{flex:1;font-size:12px;line-height:1.5;}
  .log-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;flex:none;}
  .log-del:hover{color:#f87171;}

  .map-tooltip{border-radius:10px;padding:5px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.5);}

  @media (max-width:820px){
    .main{flex-direction:column;}
    .sidebar{width:100%;height:44vh;border-right:none;border-bottom:1px solid var(--line);}
    .map-wrap{height:56vh;}
  }

  @media print{
    @page{ size: landscape; margin: 8mm; }
    *{ -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  }
  /* 아래 레이아웃 규칙은 @media print와 body.print-mode 두 군데 모두에 적용됩니다.
     인쇄 버튼을 누르면 이 print-mode 클래스를 먼저 붙여서 카카오맵이 새 크기에 맞춰
     폴리곤(구역 표시)을 다시 그릴 시간을 준 다음에 실제 인쇄 대화상자를 띄웁니다. */
  @media print, screen{
    body.print-mode html, body.print-mode body{height:100% !important;}
    body.print-mode #app{height:100% !important;}
    body.print-mode .topbar, body.print-mode .tabs, body.print-mode .clear-filter,
    body.print-mode .region-panel, body.print-mode .card-actions, body.print-mode .no-print,
    body.print-mode #editToggle, body.print-mode .site-label{display:none !important;}
    body.print-mode .main{flex-direction:row !important; height:auto !important; flex:1 1 auto !important; min-height:0 !important;}
    body.print-mode .sidebar{width:520px !important; flex:0 0 520px !important; height:auto !important; border-right:1px solid var(--line) !important; border-left:none !important; border-bottom:none !important; order:1 !important;}
    body.print-mode .map-wrap{height:100% !important; flex:1 1 auto !important; order:2 !important;}
    body.print-mode #detailBody{display:flex !important; flex-wrap:wrap !important; gap:0 20px !important;}
    body.print-mode #detailBody .visit-row, body.print-mode #detailBody .section-head{flex:1 1 100% !important;}
    body.print-mode .spec-box{flex:1 1 220px !important;}
    body.print-mode .detail-notes-inline{display:block !important; flex:1 1 220px !important; border-left:1px dashed var(--line); padding-left:16px;}
    body.print-mode .detail-notes-inline .spec-divider{display:none;}
  }
  @media print{
    html, body{height:100% !important;}
    #app{height:100% !important;}
    .topbar, .tabs, .clear-filter, .region-panel,
    .card-actions, .no-print, #editToggle, .site-label{display:none !important;}
    .main{flex-direction:row !important; height:auto !important; flex:1 1 auto !important; min-height:0 !important;}
    .sidebar{width:520px !important; flex:0 0 520px !important; height:auto !important; border-right:1px solid var(--line) !important; border-left:none !important; border-bottom:none !important; order:1 !important;}
    .map-wrap{height:100% !important; flex:1 1 auto !important; order:2 !important;}
    #detailBody{display:flex !important; flex-wrap:wrap !important; gap:0 20px !important;}
    #detailBody .visit-row, #detailBody .section-head{flex:1 1 100% !important;}
    .spec-box{flex:1 1 220px !important;}
    .detail-notes-inline{display:block !important; flex:1 1 220px !important; border-left:1px dashed var(--line); padding-left:16px;}
    .detail-notes-inline .spec-divider{display:none;}
  }
</style>
</head>

<script>
// ============================================================
// 카카오맵 호환 어댑터: 기존 코드가 쓰던 Leaflet 스타일 API(L.map, L.polygon, L.marker...)를
// 그대로 쓸 수 있도록 카카오맵 위에 얇게 감싼 레이어. 아래쪽 실제 화면 로직은 전혀 손대지 않아도 됨.
// ============================================================
const L = (function(){
  function toLatLng(p){ return new kakao.maps.LatLng(p[0], p[1]); }
  function toPath(points){ return points.map(toLatLng); }
  // Leaflet 줌레벨(높을수록 확대)을 카카오 레벨(낮을수록 확대)로 대략 환산
  function zoomToLevel(zoom){ return Math.max(1, Math.min(14, Math.round(20 - zoom))); }
  function realMap(target){ return target && target.kmap; }
  function toBoundsObj(bounds){
    if(bounds && bounds._kbounds) return bounds._kbounds;
    const kb = new kakao.maps.LatLngBounds();
    (bounds||[]).forEach(p=> kb.extend(toLatLng(p)));
    return kb;
  }

  class Group{
    constructor(){ this.items=[]; this._mapWrap=null; }
    addTo(mapWrap){ this._mapWrap = mapWrap; return this; }
    addLayer(item){ this.items.push(item); return this; }
    clearLayers(){ this.items.forEach(it=>it._setMapNull && it._setMapNull()); this.items=[]; }
    get kmap(){ return this._mapWrap && this._mapWrap.kmap; }
  }

  class MapWrap{
    constructor(el, opts){
      opts = opts||{};
      this.kmap = new kakao.maps.Map(el, {center: new kakao.maps.LatLng(37.5665,126.9780), level: 8});
      if(opts.zoomControl){
        this.kmap.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.TOPRIGHT);
      }
    }
    invalidateSize(){ this.kmap.relayout(); return this; }
    setView(pos, zoom){
      this.kmap.setCenter(toLatLng(pos));
      if(zoom!=null) this.kmap.setLevel(zoomToLevel(zoom));
      return this;
    }
    fitBounds(bounds, opts){
      opts = opts||{};
      const pad = opts.padding||[20,20];
      const kb = toBoundsObj(bounds);
      this.kmap.setBounds(kb, pad[1], pad[0], pad[1], pad[0]);
      return this;
    }
    on(evt, cb){
      const mapped = ({'zoomend':'zoom_changed'})[evt] || evt;
      kakao.maps.event.addListener(this.kmap, mapped, cb);
      return this;
    }
  }

  function latLngBounds(points){ return { _kbounds: toBoundsObj(points) }; }

  function centroidOf(points){
    const lat = points.reduce((sum,p)=>sum+p[0],0)/points.length;
    const lng = points.reduce((sum,p)=>sum+p[1],0)/points.length;
    return [lat, lng];
  }

  // bindTooltip이 실제로 지도 위에 이름표(구역명)를 보여주도록 구현하는 헬퍼.
  // 기존엔 이 함수가 빈 껍데기(no-op)였어서, 상세보기에서 구역을 클릭해도 이름이 안 나왔음.
  function makeTooltipOverlay(kmap, latlngArr, html, opts){
    opts = opts||{};
    const wrapEl = document.createElement('div');
    wrapEl.innerHTML = String(html||'').trim();
    const content = wrapEl.firstElementChild || wrapEl;
    if(opts.direction==='top') content.style.marginBottom = '10px';
    const overlay = new kakao.maps.CustomOverlay({
      position: toLatLng(latlngArr),
      content: content,
      xAnchor: 0.5,
      yAnchor: opts.direction==='top' ? 1 : 0.5,
      zIndex: 3
    });
    overlay.setMap(kmap);
    return overlay;
  }

  function polygon(points, options){
    options = options||{};
    const kobj = new kakao.maps.Polygon({
      path: toPath(points),
      strokeWeight: options.weight!=null?options.weight:2,
      strokeColor: options.color||'#333',
      strokeOpacity: options.opacity!=null?options.opacity:0.8,
      fillColor: options.fillColor||options.color||'#333',
      fillOpacity: options.fillOpacity!=null?options.fillOpacity:0.3
    });
    let tooltipOverlay = null;
    let boundMap = null;
    return {
      _kobj: kobj,
      addTo(target){ boundMap = realMap(target); kobj.setMap(boundMap); if(target.addLayer) target.addLayer(this); return this; },
      _setMapNull(){ kobj.setMap(null); if(tooltipOverlay) tooltipOverlay.setMap(null); },
      on(evt, cb){ if(evt==='click') kakao.maps.event.addListener(kobj, 'click', cb); return this; },
      bindTooltip(html, opts){
        if(boundMap) tooltipOverlay = makeTooltipOverlay(boundMap, centroidOf(points), html, opts);
        return this;
      },
      getBounds(){ return latLngBounds(points); }
    };
  }

  function polyline(points, options){
    options = options||{};
    const kobj = new kakao.maps.Polyline({
      path: toPath(points),
      strokeWeight: options.weight!=null?options.weight:2,
      strokeColor: options.color||'#333',
      strokeOpacity: options.opacity!=null?options.opacity:0.8,
      strokeStyle:'solid'
    });
    return {
      _kobj: kobj,
      addTo(target){ kobj.setMap(realMap(target)); if(target.addLayer) target.addLayer(this); return this; },
      _setMapNull(){ kobj.setMap(null); }
    };
  }

  function divIcon(opts){ return opts||{}; }

  function marker(pos, opts){
    opts = opts||{};
    const icon = opts.icon || {};
    const wrapEl = document.createElement('div');
    wrapEl.innerHTML = (icon.html||'').trim();
    const content = wrapEl.firstElementChild || wrapEl;
    const kobj = new kakao.maps.CustomOverlay({
      position: toLatLng(pos),
      content: content,
      xAnchor: 0.5, yAnchor: 0.5
    });
    let tooltipOverlay = null;
    let boundMap = null;
    let curPos = pos;
    return {
      _kobj: kobj,
      _el: content,
      addTo(target){ boundMap = realMap(target); kobj.setMap(boundMap); if(target.addLayer) target.addLayer(this); return this; },
      _setMapNull(){ kobj.setMap(null); if(tooltipOverlay) tooltipOverlay.setMap(null); },
      on(evt, cb){ if(evt==='click') content.addEventListener('click', cb); return this; },
      bindTooltip(html, opts){
        if(boundMap) tooltipOverlay = makeTooltipOverlay(boundMap, curPos, html, opts);
        return this;
      },
      setLatLng(p){
        curPos = p;
        kobj.setPosition(toLatLng(p));
        if(tooltipOverlay) tooltipOverlay.setPosition(toLatLng(p));
        return this;
      }
    };
  }

  return {
    map(id, opts){ return new MapWrap(document.getElementById(id), opts); },
    tileLayer(){ return { addTo(){ return this; } }; }, // 카카오맵 자체 배경지도를 쓰므로 별도 타일 불필요
    layerGroup(){ return new Group(); },
    polygon, polyline, marker, divIcon, latLngBounds
  };
})();
</script>

  const EDIT_PASSWORD_HASH = '4654d793972c3b6a1d48fb0ab58d9cb0de46c3d33d605f9222c283dfaa12d420';
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function ensureUnlocked(){
    if(guestMode){

      return false;
    }
    try{
      if(localStorage.getItem('editUnlocked')==='1') return true;
    }catch(e){}
    const pw = prompt('수정 · 추가 · 삭제하려면 비밀번호를 입력하세요:');
    if(pw===null) return false;
    const hash = await sha256Hex(pw);
    if(hash===EDIT_PASSWORD_HASH){
      try{ localStorage.setItem('editUnlocked','1'); }catch(e){}
      return true;
    }
    alert('비밀번호가 틀렸습니다.');
    return false;
  }

  function daysSince(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    if(isNaN(d.getTime())) return null;
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayMid - d) / 86400000);
  }

    return '';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // "2026-07-10" -> "26년 7월 10일"
  function formatDateKr(dateStr){
    if(!dateStr) return '';
    const m = String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(!m) return dateStr;
    const yy = m[1].slice(2);
    const mo = parseInt(m[2],10);
    const dd = parseInt(m[3],10);
    return `${yy}년 ${mo}월 ${dd}일`;
  }
  function formatDateKrNoYear(dateStr){
    if(!dateStr) return '';
    const m = String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(!m) return dateStr;
    const mo = parseInt(m[2],10);
    const dd = parseInt(m[3],10);
    return `${mo}월 ${dd}일`;
  }

  // ---------- map ----------

  // ---------- 지역(시도/시군구) 선택 패널 ----------
  const SIDO_LIST = ['서울','경기','인천'];
  const SIDO_LABELS = {'서울':'서울특별시','경기':'경기도','인천':'인천광역시'};
  let regionSido = null; // null이면 시도 목록, 값이 있으면 그 시도의 시군구 목록

  // 시도 선택 패널을 마우스로 끌어서 옮길 수 있게 함 (지도 확대축소 버튼 등과 겹칠 때 위치 조정용)
  (function enableRegionPanelDrag(){
    const panel = document.getElementById('regionPanel');
    const handle = document.getElementById('regionDragHandle');
    const wrap = document.querySelector('.map-wrap');
    if(!panel || !handle || !wrap) return;
    const POS_KEY = 'regionPanelPos';
    try{
      const saved = JSON.parse(localStorage.getItem(POS_KEY)||'null');
      if(saved && typeof saved.left==='number' && typeof saved.top==='number'){
        panel.style.left = saved.left+'px';
        panel.style.top = saved.top+'px';
        panel.style.right = 'auto';
      }
    }catch(e){}
    let startX=0, startY=0, startLeft=0, startTop=0, dragging=false;
    handle.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      dragging = true;
      const rect = panel.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      startLeft = rect.left - wrapRect.left;
      startTop = rect.top - wrapRect.top;
      startX = e.clientX; startY = e.clientY;
      panel.style.right = 'auto';
      panel.style.left = startLeft+'px';
      panel.style.top = startTop+'px';
    });
    document.addEventListener('mousemove', (e)=>{
      if(!dragging) return;
      const wrapRect = wrap.getBoundingClientRect();
      let newLeft = startLeft + (e.clientX-startX);
      let newTop = startTop + (e.clientY-startY);
      newLeft = Math.max(0, Math.min(newLeft, wrapRect.width - panel.offsetWidth));
      newTop = Math.max(0, Math.min(newTop, wrapRect.height - panel.offsetHeight));
      panel.style.left = newLeft+'px';
      panel.style.top = newTop+'px';
    });
    document.addEventListener('mouseup', ()=>{
      if(!dragging) return;
      dragging = false;
      try{
        localStorage.setItem(POS_KEY, JSON.stringify({
          left: parseFloat(panel.style.left)||0,
          top: parseFloat(panel.style.top)||0
        }));
      }catch(e){}
    });
  })();

  // ---------- 사업소(전체/강서/강남/강북) 전환 : 상단 탭 형태 ----------

  function initMap(){
    map = L.map('map', {zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 서울 25개 구 배경 레이어 (현장이 있는 구는 renderSeoulShapes에서 노란색으로 강조)
    seoulShapeLayer = L.layerGroup().addTo(map);

    districtLayer = L.layerGroup().addTo(map);
    siteLayer = L.layerGroup().addTo(map);
    focusLayer = L.layerGroup().addTo(map);

    // 초기 렌더 타이밍에 컨테이너 크기가 아직 확정 안 된 경우가 있어
    // 사이즈를 다시 계산한 뒤 경계에 맞추고, 화면 비율(가로가 긴 창)에서
    // 양옆 여백이 남지 않도록 한 단계 더 확대함
    map.on('zoomend', ()=>{ if(currentView!=='detail') renderMap(); });

    // 인쇄로 전환되며 헤더/탭이 사라져 지도 영역 크기가 바뀌므로,
    // Leaflet이 그 시점의 실제 크기에 맞춰 다시 배치하도록 함
    window.addEventListener('beforeprint', ()=>{
      map.invalidateSize();
      // 인쇄용으로 지도 컨테이너 크기가 바뀐 뒤에는 구역(폴리곤) 오버레이가 다시 그려지도록
      // 중심좌표를 살짝 재설정해서 강제로 리렌더시킴 (안 하면 폴리곤이 빈 지도로 인쇄되는 경우가 있음)
      if(map.kmap){
        const c = map.kmap.getCenter();
        map.kmap.setCenter(c);
      }
    });

    setTimeout(resetMapToSeoul, 0);
  }

  // Chaikin's corner-cutting algorithm: 원래 좌표(정확한 데이터)는 그대로 두고,
  // 화면에 그릴 때만 모서리를 부드럽게 깎아서 라운딩된 것처럼 보이게 함
  function roundPolygonCorners(points, iterations=2){
    let pts = points.map(p=>[p[0],p[1]]);
    for(let iter=0; iter<iterations; iter++){
      const next = [];
      const n = pts.length;
      for(let i=0;i<n;i++){
        const p0 = pts[i];
        const p1 = pts[(i+1)%n];
        next.push([p0[0]*0.75+p1[0]*0.25, p0[1]*0.75+p1[1]*0.25]);
        next.push([p0[0]*0.25+p1[0]*0.75, p0[1]*0.25+p1[1]*0.75]);
      }
      pts = next;
    }
    return pts;
  }

  // 카카오맵 내부 오버레이 렌더링이 인쇄 시 반영되지 않는 경우가 있어서,
  // 인쇄 직전에 현재 지도 투영(projection)으로 픽셀좌표를 직접 계산해 별도 SVG로 구역을 그려줌
  function drawPrintOverlay(site){
    const ov = document.getElementById('mapPrintOverlay');
    const mapEl = document.getElementById('map');
    if(!ov || !mapEl || !map || !map.kmap) return;
    const w = mapEl.offsetWidth, h = mapEl.offsetHeight;
    ov.setAttribute('width', w);
    ov.setAttribute('height', h);
    ov.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const proj = map.kmap.getProjection();
    const color = colorForStatus(site.status);
    let svgInner = '';
    if(site.polygon && site.polygon.length>=3){
      const ptsStr = site.polygon.map(p=>{
        const pt = proj.containerPointFromCoords(new kakao.maps.LatLng(p[0], p[1]));
        return `${pt.x},${pt.y}`;
      }).join(' ');
      svgInner = `<polygon points="${ptsStr}" fill="${color}" fill-opacity="0.35" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
    }else{
      const pos = (site.lat && site.lng) ? [site.lat,site.lng] : DISTRICTS[site.district];
      if(pos){
        const pt = proj.containerPointFromCoords(new kakao.maps.LatLng(pos[0], pos[1]));
        svgInner = `<circle cx="${pt.x}" cy="${pt.y}" r="9" fill="${color}" stroke="#fff" stroke-width="2"/>`;
      }
    }
    ov.innerHTML = svgInner;
    ov.style.display = 'block';
  }

  function focusMapOnSite(site){
    if(!map) return;
    districtLayer.clearLayers();
    siteLayer.clearLayers();
    focusLayer.clearLayers();
    // 상세보기에선 전체 보라색 배경 대신, 이 현장이 속한 구 하나만 연하게 표시
    if(seoulShapeLayer){
      seoulShapeLayer.clearLayers();
      const sidoName = (site.district||'').split(' ')[0];
      const guName = (site.district||'').split(' ').pop();
      const shape = shapeFor(sidoName, guName);
      if(shape){
        L.polygon(shape, {
          color:'#8b7cc9', weight:1.2, opacity:.7,
          fillColor:'#fef3c7', fillOpacity:.5,
          interactive:false
        }).addTo(seoulShapeLayer);
      }
    }
    clearDistrictBtn.style.display = 'none';

    const tooltipColor = colorForStatus(site.status);
    const badgeHtml = `<div class="map-tooltip" style="background:${tooltipColor};color:#fff;">${escapeHtml(site.name)}</div>`;

    let poly = null, marker = null, pos = null;
    if(site.polygon && site.polygon.length>=3){
      const smoothed = site.polygon;
      const siteColor = colorForStatus(site.status);
      poly = L.polygon(smoothed, {color:siteColor, weight:3, fillColor:siteColor, fillOpacity:.35, lineJoin:'round', lineCap:'round', smoothFactor:1.5}).addTo(focusLayer);
      poly.bindTooltip(badgeHtml, {permanent:true, direction:'top', className:'', offset:[0,-6]});
    }else{
      pos = (site.lat && site.lng) ? [site.lat,site.lng] : DISTRICTS[site.district];
      if(pos){
        const dot = L.divIcon({className:'', html:`<div class="site-dot" style="background:${colorForStatus(site.status)};width:18px;height:18px;"></div>`, iconSize:[18,18]});
        marker = L.marker(pos, {icon:dot}).addTo(focusLayer);
        marker.bindTooltip(badgeHtml, {permanent:true, direction:'top', className:'', offset:[0,-10]});
      }
    }

    // 사이드바 innerHTML이 방금 바뀐 직후라 지도 컨테이너 크기가 아직
    // 브라우저에 실제로 반영되기 전일 수 있음 → 다음 프레임에서 재계산
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        map.invalidateSize();
        if(poly){
          // 현장 크기(폴리곤 면적)와 상관없이 항상 동일한 확대 수준으로 보여주기 위해
          // fitBounds(면적에 맞춰 자동 확대) 대신, 폴리곤 중심점 + 고정 줌레벨을 사용
          const pts = site.polygon;
          const centerLat = pts.reduce((s,p)=>s+p[0],0)/pts.length;
          const centerLng = pts.reduce((s,p)=>s+p[1],0)/pts.length;
          map.setView([centerLat, centerLng], 15, {animate:false});
        }else if(pos){
          map.setView(pos, 15, {animate:false});
        }
      });
    });
  }

  let lastMapPositions = [];

  // 같은 구에 좌표 없이 여러 현장이 몰릴 때, 점들이 겹치지 않도록 구 중심 주변에 살짝 흩어주는 지터
  function hashAngle(id){
    let h=0; for(let i=0;i<id.length;i++) h=(h*131+id.charCodeAt(i))>>>0;
    return (h%360)*Math.PI/180;
  }
  function jitterOffset(id){
    const angle = hashAngle(id);
    const radius = 0.0035 + (id.length%10)/10*0.004;
    return [Math.cos(angle)*radius*0.75, Math.sin(angle)*radius];
  }
  // 서울 중심에서 해당 현장 방향으로 쭉 더 밀어낸 위치에 이름표를 둠 (자연스럽게 외곽/경기도 방향)
  // 같은 구에 현장이 여러 개면 그 방향에 수직으로 살짝씩 어긋나게(stagger) 배치해서 안 겹치게 함
  let regionFocusMode = false; // 지역선택 패널로 특정 구를 확대해서 볼 때 true
  function labelPosition(basePos, idx, groupSize, siteId){
    const center = [37.5665, 126.9780];
    let dx = basePos[0]-center[0], dy = basePos[1]-center[1];
    let dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 0.0005){ dx = 0; dy = -1; dist = 1; }
    let ux = dx/dist, uy = dy/dist;
    // 같은 방향으로 여러 구역의 선이 겹치지 않도록, 현장마다 살짝 다른 각도로 회전시킴
    const jitterDeg = (hashAngle(siteId) * 180/Math.PI % 70) - 35; // -35~35도
    const rad = jitterDeg * Math.PI/180;
    const rux = ux*Math.cos(rad) - uy*Math.sin(rad);
    const ruy = ux*Math.sin(rad) + uy*Math.cos(rad);
    ux = rux; uy = ruy;
    const perpX = -uy, perpY = ux;
    const pushOut = regionFocusMode ? 0.012 : 0.14;
    const stagger = (idx - (groupSize-1)/2) * (regionFocusMode ? 0.008 : 0.045);
    return [basePos[0] + ux*pushOut + perpX*stagger, basePos[1] + uy*pushOut + perpY*stagger];
  }

  function sitePosition(s){
    if(s.lat && s.lng) return [s.lat, s.lng];
    // 위도/경도가 따로 없어도 구역 경계(폴리곤)가 있으면 그 도형의 중심을 사용.
    // (이게 없으면 라벨/마커가 구역 도형과 상관없이 그 구의 대표 위치 근처로 몰려버림)
    if(s.polygon && s.polygon.length>=3){
      const latSum = s.polygon.reduce((sum,p)=>sum+p[0],0);
      const lngSum = s.polygon.reduce((sum,p)=>sum+p[1],0);
      return [latSum/s.polygon.length, lngSum/s.polygon.length];
    }
    const c = DISTRICTS[s.district];
    if(!c) return null;
    const [dx,dy] = jitterOffset(s.id);
    return [c[0]+dx, c[1]+dy];
  }

  // 라벨 위치 편집 모드에서 이름표를 마우스로 끌어서 옮기고, 놓으면 그 자리에 고정 저장
  // 더블클릭하면 자동 배치 위치로 초기화
  // 라벨 위치 편집 모드에서 이름표(현장 라벨 또는 구 라벨)를 마우스로 끌어서 옮기고,
  // 놓으면 onDragEnd 콜백으로 새 위치를 넘겨줌. 더블클릭하면 onReset 콜백 호출(기본 위치로 초기화)
  function enableDrag(marker, currentPos, onDragEnd, onReset){
    const el = marker._el;
    if(!el || !map || !map.kmap) return;
    let startX=0, startY=0, startLatLng=null;

    function onMove(e){
      const proj = map.kmap.getProjection();
      const startPt = proj.containerPointFromCoords(new kakao.maps.LatLng(startLatLng[0], startLatLng[1]));
      const newPt = new kakao.maps.Point(startPt.x + (e.clientX-startX), startPt.y + (e.clientY-startY));
      const newLatLng = proj.coordsFromContainerPoint(newPt);
      marker.setLatLng([newLatLng.getLat(), newLatLng.getLng()]);
    }
    function onUp(e){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      el.style.cursor = 'grab';
      const proj = map.kmap.getProjection();
      const startPt = proj.containerPointFromCoords(new kakao.maps.LatLng(startLatLng[0], startLatLng[1]));
      const newPt = new kakao.maps.Point(startPt.x + (e.clientX-startX), startPt.y + (e.clientY-startY));
      const newLatLng = proj.coordsFromContainerPoint(newPt);
      onDragEnd([newLatLng.getLat(), newLatLng.getLng()]);
    }

    el.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      startX = e.clientX; startY = e.clientY;
      startLatLng = currentPos;
      el.style.cursor = 'grabbing';
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    if(onReset){
      el.addEventListener('dblclick', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        onReset();
      });
    }
  }
  function enableLabelDrag(labelMarker, site, currentPos){
    enableDrag(labelMarker, currentPos, (newPos)=>{
      site.labelPos = newPos;
      saveSites();
      renderMap();
    }, ()=>{
      delete site.labelPos;
      saveSites();
      renderMap();
    });
  }

  function northPointOf(d, fallbackPos){
    const sidoName = d.split(' ')[0];
    const guName = d.split(' ').pop();
    const shape = shapeFor(sidoName, guName);
    if(!shape || !shape.length) return fallbackPos;
    let best = shape[0];
    shape.forEach(pt=>{ if(pt[0] > best[0]) best = pt; });
    return [best[0] - 0.003, best[1]]; // 살짝만 안쪽으로 내려서 경계선 위가 아니라 구 안쪽 상단에 오도록
  }

  // 레벨 1: 구 단위 현장수 배지 — 클릭하면 그 구로 확대하고 동 단위(레벨 2)로 드릴다운
  function renderGuLevel(fs){
    const byDistrict = {};
    fs.forEach(s=>{ byDistrict[s.district] = (byDistrict[s.district]||0)+1; });

    Object.keys(byDistrict).forEach(d=>{
      const centroid = DISTRICTS[d];
      if(!centroid) return;
      const pos = districtLabelOverrides[d] ? districtLabelOverrides[d] : northPointOf(d, centroid);
      const icon = L.divIcon({
        className:'',
        html:`<div class="district-pill"${labelEditMode?' style="cursor:grab;box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.4);"':''}>${d.split(' ').pop()} <span class="n">${byDistrict[d]}</span></div>`,
        iconSize:null
      });
      const marker = L.marker(pos, {icon}).addTo(districtLayer);
      if(labelEditMode){
        enableDrag(marker, pos, (newPos)=>{
          districtLabelOverrides[d] = newPos;
          saveDistrictLabelOverrides();
          renderMap();
        }, ()=>{
          delete districtLabelOverrides[d];
          saveDistrictLabelOverrides();
          renderMap();
        });
      }else{
        marker.on('click', ()=>{
          selectedDistrict = d;
          selectedDong = null;
          regionFocusMode = true;
          currentView = 'list';
          maybeAutoSelectDong();
          const sidoName = d.split(' ')[0], guName = d.split(' ').pop();
          const shape = shapeFor(sidoName, guName);
          if(shape) map.fitBounds(L.latLngBounds(shape), {padding:[30,30]});
          else map.setView(DISTRICTS[d], 13);
          renderAll();
          renderSeoulShapes();
        });
      }
    });
  }

  // 레벨 2: 선택된 구 안에서 동 단위 현장수 배지 — 클릭하면 그 동으로 확대하고 현장 단위(레벨 3)로 드릴다운
  // 실제 법정동 경계 데이터는 없으므로, 해당 동에 속한 현장들의 평균 좌표를 배지 위치로 사용함(근사치)
  function renderDongLevel(fs){
    const byDong = {};
    fs.forEach(s=>{
      const key = s.dong || '동 미지정';
      (byDong[key] = byDong[key]||[]).push(s);
    });

    Object.keys(byDong).forEach(dongName=>{
      const group = byDong[dongName];
      const positions = group.map(sitePosition).filter(Boolean);
      if(positions.length===0) return;
      const centerLat = positions.reduce((sum,p)=>sum+p[0],0)/positions.length;
      const centerLng = positions.reduce((sum,p)=>sum+p[1],0)/positions.length;
      const pos = [centerLat, centerLng];
      const icon = L.divIcon({
        className:'',
        html:`<div class="district-pill">${escapeHtml(dongName)} <span class="n">${group.length}</span></div>`,
        iconSize:null
      });
      const marker = L.marker(pos, {icon}).addTo(districtLayer);
      marker.on('click', ()=>{
        selectedDong = dongName;
        currentView = 'list';
        if(positions.length>1){
          map.fitBounds(L.latLngBounds(positions), {padding:[40,40]});
        }else{
          map.setView(pos, 16);
        }
        renderAll();
        renderSeoulShapes();
      });
    });
  }

  // 레벨 3: 개별 현장 표시(점/구역 + 이름표) — 기존 상세 지도 로직, 클릭하면 상세보기로 이동+지도 중앙 정렬
  function renderSiteLevel(fs){
    lastMapPositions = [];
    // 같은 구에 현장이 여러개면 이름표끼리 겹치지 않게 순번을 매겨둠
    const districtGroups = {};
    fs.forEach(s=>{ (districtGroups[s.district] = districtGroups[s.district]||[]).push(s); });

    fs.forEach(s=>{
      const basePos = sitePosition(s);
      if(!basePos) return;
      lastMapPositions.push(basePos);
      const group = districtGroups[s.district] || [s];
      const idx = group.indexOf(s);
      // 사용자가 드래그로 직접 옮겨서 고정해둔 위치(labelPos)가 있으면 그걸 우선 사용
      const labelPos = s.labelPos ? s.labelPos : labelPosition(basePos, idx, group.length, s.id);

      const goToDetailFor = (site)=>{
        currentDetailId = site.id;
        currentView = 'detail';
        detailTab = '개요';
        editMode = false;
        renderAll();
      };

      // 구역 경계(폴리곤)가 있으면 실제 모양을 색칠해서 표시, 없으면 작은 점
      if(s.polygon && s.polygon.length>=3){
        L.polygon(s.polygon, {
          color:colorForStatus(s.status), weight:1.5,
          fillColor:colorForStatus(s.status), fillOpacity:.45,
          interactive:true
        }).addTo(siteLayer).on('click', ()=>goToDetailFor(s));
      }else{
        const dot = L.divIcon({className:'', html:`<div class="site-dot" style="background:#111"></div>`, iconSize:[10,10]});
        L.marker(basePos, {icon:dot}).addTo(siteLayer).on('click', ()=>goToDetailFor(s));
      }

      // 바깥쪽(서울 중심에서 먼 방향 = 경기도 방향)에 이름표 배치, 항상 보임, 클릭 가능
      const labelIcon = L.divIcon({className:'', html:`<div class="site-label" style="background:${colorForStatus(s.status)}${labelEditMode?';cursor:grab;box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.4);':''}">${escapeHtml(s.name)}</div>`, iconSize:null});
      const labelMarker = L.marker(labelPos, {icon:labelIcon}).addTo(siteLayer);
      if(labelEditMode){
        enableLabelDrag(labelMarker, s, labelPos);
      }else{
        labelMarker.on('click', ()=>goToDetailFor(s));
      }
    });
  }

  function renderMap(){
    if(currentView==='detail') return; // 상세보기에서는 focusMapOnSite가 지도를 담당
    focusLayer.clearLayers();
    districtLayer.clearLayers();
    siteLayer.clearLayers();
    lastMapPositions = [];

    const fs = filteredSites();

    if(!selectedDistrict){
      renderGuLevel(fs);
    }else if(!selectedDong){
      renderDongLevel(fs);
    }else{
      renderSiteLevel(fs);
    }

    updateBackButtonLabel();
  }

  clearDistrictBtn.addEventListener('click', ()=>{
    if(selectedDong && dongAutoSkipped){
      // 동 단계를 건너뛰고 바로 현장 단계로 왔던 경우엔, 뒤로가기도 한번에 전체 보기로
      selectedDong = null;
      selectedDistrict = null;
      dongAutoSkipped = false;
      regionFocusMode = false;
      resetMapToSeoul();
    }else if(selectedDong){
      // 동 단계 -> 구 단계로 한 단계만 뒤로
      selectedDong = null;
      const sidoName = selectedDistrict.split(' ')[0], guName = selectedDistrict.split(' ').pop();
      const shape = shapeFor(sidoName, guName);
      if(map){
        if(shape) map.fitBounds(L.latLngBounds(shape), {padding:[30,30]});
        else map.setView(DISTRICTS[selectedDistrict], 13);
      }
    }else if(selectedDistrict){
      selectedDistrict = null;
      regionFocusMode = false;
      resetMapToSeoul();
    }
    renderAll();
    renderSeoulShapes();
    renderRegionPanel();
  });
  function updateBackButtonLabel(){
    if(selectedDong && !dongAutoSkipped){
      clearDistrictBtn.style.display = 'inline-flex';
      clearDistrictBtn.textContent = '‹ 동 목록으로';
    }else if(selectedDong || selectedDistrict){
      clearDistrictBtn.style.display = 'inline-flex';
      clearDistrictBtn.textContent = '‹ 전체 보기';
    }else{
      clearDistrictBtn.style.display = 'none';
    }
  }

  // ---------- modal ----------

  document.getElementById('addBtn').addEventListener('click', async ()=>{
    if(!(await ensureUnlocked())) return;
    openModal(null);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

  function parsePolygon(text){
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const pts = lines.map(l=>{
      const parts = l.split(',').map(x=>parseFloat(x.trim()));
      return (parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])) ? parts : null;
    }).filter(Boolean);
    return pts.length>=3 ? pts : null;
  }

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(!(await ensureUnlocked())) return;
    const name = document.getElementById('f_name').value.trim();
    if(!name){ alert('현장명을 입력해주세요.'); return; }
    const existing = editingId ? (sites.find(s=>s.id===editingId) || {}) : {};
    const data = Object.assign({}, existing, {
      id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()),
      name,
      district: document.getElementById('f_district').value,
      dong: document.getElementById('f_dong').value.trim(),
      stage: document.getElementById('f_stage').value,
      status: document.getElementById('f_status').value.trim(),
      area: document.getElementById('f_area').value.trim(),
      orderExpected: document.getElementById('f_order').value.trim(),
      households: document.getElementById('f_house').value.trim(),
      totalFloorArea: document.getElementById('f_totalFloorArea').value.trim(),
      scale: document.getElementById('f_scale').value.trim(),
      unionMembers: document.getElementById('f_union').value.trim(),
      managementCompany: document.getElementById('f_mgmtCo').value.trim(),
      designCompany: document.getElementById('f_designCo').value.trim(),
      trustCompany: document.getElementById('f_trustCo').value.trim(),
      manager: document.getElementById('f_manager').value.trim(),
      lastDate: document.getElementById('f_date').value,
      lat: parseFloat(document.getElementById('f_lat').value) || null,
      lng: parseFloat(document.getElementById('f_lng').value) || null,
      memo: document.getElementById('f_memo').value.trim(),
      polygon: parsePolygon(document.getElementById('f_polygon').value)
    });
    if(editingId){
      const idx = sites.findIndex(s=>s.id===editingId);
      if(idx>-1) sites[idx] = data;
    }else{
      sites.push(data);
    }
    await saveSites();
    closeModal();
    renderAll();
  });

  async function deleteSite(id){
    if(!confirm('이 현장을 삭제할까요?')) return;
    sites = sites.filter(s=>s.id!==id);
    await saveSites();
    renderAll();

  // ---------- excel ----------

    district:['구','자치구','지역구','구역'],
    dong:['동','법정동','읍면동'],
    status:['상태','유형','구분','태그'],
    stage:['단계','진행단계','진행상태'],
    area:['면적','대지면적','부지면적'],
    orderExpected:['예상발주'],
    households:['신축세대','세대수'],

    scale:['규모','층수'],
    unionMembers:['조합원수','조합원'],

    lng:['경도','lng','longitude','long'],
    polygon:['구역경계좌표','구역 경계 좌표','폴리곤','경계좌표','폴리곤좌표'],
    managementCompany:['정비업체'],
    designCompany:['설계업체'],
    trustCompany:['신탁사'],
    manager:['담당자']
  };
  function matchHeader(h){
    h = String(h).trim();
    for(const key in HEADER_MAP){
      if(HEADER_MAP[key].includes(h)) return key;
    }
    return null;
  }
  function resolveDistrict(rawDistrict, rawCity){
    const raw = String(rawDistrict||'').trim();
    if(!raw) return '';
    if(DISTRICTS[raw]) return raw; // 이미 "서울 노원구" 형식
    const city = String(rawCity||'').trim();
    if(city && DISTRICTS[`${city} ${raw}`]) return `${city} ${raw}`;
    // 도시 표기가 없으면 각 도시에서 동일한 구 이름을 찾아본다 (서울을 우선으로 둠)
    const candidates = CITY_NAMES.filter(c=>CITY_DISTRICTS[c][raw]);
    if(candidates.length===0) return raw;
    const chosen = candidates.includes('서울') ? '서울' : candidates[0];
    return `${chosen} ${raw}`;
  }

  // 현장명이 비슷하면(괄호/공백/'단지''구역''아파트' 등 접미어 무시) 같은 현장으로 보고
  // 새로 만들지 않고 기존 카드를 업데이트합니다. 값이 빈 칸인 컬럼은 기존 값을 그대로 둡니다.
  function normalizeSiteName(s){
    let t = String(s||'').trim();
    t = t.replace(/[\(\[][^\)\]]*[\)\]]/g, '');
    t = t.replace(/\s+/g, '');
    const suffixes = ['일대','번지','아파트단지','아파트','단지','정비구역','주택정비형','재건축사업','재건축','재개발사업','재개발','구역','조합','신탁'];
    let changed = true;
    while(changed){
      changed = false;
      for(const suf of suffixes){
        if(t.length>suf.length && t.endsWith(suf)){ t = t.slice(0, -suf.length); changed = true; }
      }
    }
    return t;
  }

  // 엑셀 파일을 즉시 반영하지 않고, 신규/업데이트 대상을 먼저 계산만 해서
  // 업로드 확인 모달에서 몇 건이 어떻게 바뀌는지 보여준 뒤 '적용'을 눌러야 실제로 반영됩니다.
  function buildUploadPreview(rows, colMap){
    const ops = []; // {type:'update'|'add', existing?, fields, name}
    let skipped = 0;
    rows.forEach(r=>{
      const name = String(r[colMap.name]||'').trim();
      const rawDistrict = String(r[colMap.district]||'').trim();
      if(!name) return;
      const rawCity = colMap.city ? String(r[colMap.city]||'').trim() : '';
      const matchedDistrict = rawDistrict ? resolveDistrict(rawDistrict, rawCity) : '';
      let lastDate = colMap.lastDate ? String(r[colMap.lastDate]||'').trim() : '';
      if(lastDate instanceof Date) lastDate = lastDate.toISOString().slice(0,10);

      const fields = {
        name,
        district: matchedDistrict,
        dong: colMap.dong ? String(r[colMap.dong]||'').trim() : '',
        stage: colMap.stage ? String(r[colMap.stage]||'').trim() : '',
        status: colMap.status ? String(r[colMap.status]||'').trim() : '',
        area: colMap.area ? String(r[colMap.area]||'').trim() : '',
        orderExpected: colMap.orderExpected ? String(r[colMap.orderExpected]||'').trim() : '',
        households: colMap.households ? String(r[colMap.households]||'').trim() : '',
        totalFloorArea: colMap.totalFloorArea ? String(r[colMap.totalFloorArea]||'').trim() : '',
        scale: colMap.scale ? String(r[colMap.scale]||'').trim() : '',
        unionMembers: colMap.unionMembers ? String(r[colMap.unionMembers]||'').trim() : '',
        lastDate,
        lat: colMap.lat ? (parseFloat(r[colMap.lat])||null) : null,
        lng: colMap.lng ? (parseFloat(r[colMap.lng])||null) : null,
        memo: colMap.memo ? String(r[colMap.memo]||'').trim() : '',
        polygon: colMap.polygon ? parsePolygon(String(r[colMap.polygon]||'').replace(/\r\n/g,'\n')) : null,
        managementCompany: colMap.managementCompany ? String(r[colMap.managementCompany]||'').trim() : '',
        designCompany: colMap.designCompany ? String(r[colMap.designCompany]||'').trim() : '',
        trustCompany: colMap.trustCompany ? String(r[colMap.trustCompany]||'').trim() : '',
        manager: colMap.manager ? String(r[colMap.manager]||'').trim() : ''
      };

      const target = normalizeSiteName(name);
      const existing = sites.find(s=> normalizeSiteName(s.name) === target);

      if(existing){
        ops.push({type:'update', existing, fields, name});
      } else if(matchedDistrict){
        ops.push({type:'add', fields, name});
      } else {
        skipped++; // 새 현장인데 구 정보가 없으면 건너뜀
      }
    });
    return {ops, skipped};
  }

  // 확인 모달에서 '적용'을 눌렀을 때만 실제로 sites 배열에 반영
  function applyUploadOps(ops){
    let added = 0, updated = 0;
    ops.forEach(op=>{
      if(op.type==='update'){
        const existing = op.existing;
        Object.keys(op.fields).forEach(k=>{
          const v = op.fields[k];
          const isEmpty = v===''||v===null||(Array.isArray(v)&&v.length===0);
          if(!isEmpty) existing[k] = v;
        });
        // 새 구역경계좌표가 들어왔으면, 예전에 대충 잡아뒀던 자리에 드래그로
        // 고정해둔 라벨 위치(labelPos)는 지워서 새 폴리곤 위치 기준으로 다시 계산되게 함
        if(op.fields.polygon && op.fields.polygon.length){
          delete existing.labelPos;
        }
        updated++;
      } else {
        sites.push(Object.assign({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()+added
        }, op.fields));
        added++;
      }
    });
    return {added, updated};
  }

  function showUploadConfirmModal(ops, skipped, onConfirm, onCancel){
    const added = ops.filter(o=>o.type==='add').length;
    const updated = ops.filter(o=>o.type==='update').length;
    const sampleNames = ops.slice(0,8).map(o=>`${o.type==='add'?'➕ 신규':'✎ 업데이트'} · ${escapeHtml(o.name)}`).join('<br>');
    const more = ops.length>8 ? `<div style="color:var(--text-dim);font-size:11px;margin-top:4px;">외 ${ops.length-8}건...</div>` : '';
    const wrap = document.createElement('div');
    wrap.className = 'overlay show';
    wrap.id = 'uploadPreviewOverlay';
    wrap.innerHTML = `
      <div class="modal" style="max-width:340px;">
        <h3 style="margin:0 0 10px;font-size:14px;">엑셀 업로드 확인</h3>
        <div style="font-size:13px;line-height:1.7;">
          신규 추가 <b style="color:var(--accent)">${added}건</b> · 업데이트 <b style="color:var(--accent)">${updated}건</b>
          ${skipped>0 ? `<br><span style="color:#ff8080;">구 정보 없어 건너뜀 ${skipped}건</span>` : ''}
        </div>
        <div style="margin-top:10px;font-size:12px;max-height:160px;overflow-y:auto;background:var(--bg-side-2);border-radius:8px;padding:8px 10px;">
          ${sampleNames || '변경 사항 없음'}
          ${more}
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" id="uploadConfirmBtn" style="flex:1;">적용</button>
          <button class="btn btn-ghost" id="uploadCancelBtn" style="flex:1;">취소</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    document.getElementById('uploadConfirmBtn').addEventListener('click', ()=>{
      wrap.remove();
      onConfirm();
    });
    document.getElementById('uploadCancelBtn').addEventListener('click', ()=>{
      wrap.remove();
      onCancel();
    });
  }

  document.getElementById('excelInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!(await ensureUnlocked())){ e.target.value=''; return; }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(rows.length===0){ alert('엑셀에서 데이터를 찾지 못했습니다.'); e.target.value=''; return; }

    const headers = Object.keys(rows[0]);
    const colMap = {};
    headers.forEach(h=>{ const key = matchHeader(h); if(key) colMap[key]=h; });

    if(!colMap.name || !colMap.district){
      alert('엑셀에 "현장명"과 "구" 컬럼이 필요합니다. 양식 다운로드를 참고해주세요.');
      e.target.value='';
      return;
    }

    const {ops, skipped} = buildUploadPreview(rows, colMap);
    if(ops.length===0){
      alert(skipped>0 ? `반영할 수 있는 데이터가 없습니다. (구 정보 없어 건너뜀 ${skipped}건)` : '반영할 수 있는 데이터가 없습니다.');
      e.target.value='';
      return;
    }

    showUploadConfirmModal(ops, skipped,
      async ()=>{
        const {added, updated} = applyUploadOps(ops);
        await saveSites();
        renderAll();
        alert(`${updated}건 업데이트, ${added}건 신규 추가되었습니다.`);
        e.target.value = '';
      },
      ()=>{ e.target.value = ''; }
    );
  });

  document.getElementById('templateBtn').addEventListener('click', ()=>{
    let rows;
    if(sites.length > 0){
      // 지금 등록된 실제 현장 데이터를 그대로 엑셀로 내보냄 -> 여기서 값을 고치고
      // (예: 구역경계좌표만 채우고) 그대로 "엑셀 업로드"에 다시 올리면 같은 현장명은
      // 새로 만들지 않고 업데이트됩니다.
      rows = sites.map(s=>({
        '현장명': s.name||'',
        '도시': '',
        '구': s.district||'',
        '동': s.dong||'',
        '상태': s.status||'',
        '단계': s.stage||'',
        '면적': s.area||'',
        '예상발주': s.orderExpected||'',
        '신축세대': s.households||'',
        '연면적': s.totalFloorArea||'',
        '규모': s.scale||'',
        '조합원수': s.unionMembers||'',
        '최근일자': s.lastDate||'',
        '정비업체': s.managementCompany||'',
        '설계업체': s.designCompany||'',
        '신탁사': s.trustCompany||'',
        '담당자': s.manager||'',
        '위도': s.lat||'',
        '경도': s.lng||'',
        '비고': s.memo||'',
        '구역경계좌표': (s.polygon && s.polygon.length) ? s.polygon.map(p=>p.join(',')).join('\n') : ''
      }));
    } else {
      rows = [
        {'현장명':'월계 시영(미미삼)','도시':'서울','구':'노원구','동':'','상태':'재건축','단계':'시장모니터링',
         '면적':'232298.6','예상발주':'27년 상반기','신축세대':'6103','연면적':'','규모':'','조합원수':'3986','최근일자':'2026-07-09',
         '정비업체':'','설계업체':'','신탁사':'','담당자':'','위도':'','경도':'','비고':'예시 데이터입니다',
         '구역경계좌표':'37.601,127.055\n37.603,127.058\n37.598,127.060'},
        {'현장명':'해운대 예시현장','도시':'부산','구':'해운대구','동':'','상태':'재건축','단계':'사전관리',
         '면적':'','예상발주':'','신축세대':'','연면적':'','규모':'','조합원수':'','최근일자':'2026-07-01',
         '정비업체':'','설계업체':'','신탁사':'','담당자':'','위도':'','경도':'','비고':'부산 지역 예시','구역경계좌표':''}
      ];
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'sites');
    XLSX.writeFile(wb, (sites.length>0 ? '현재현장_'+currentOffice : '시장모니터링_양식') + '.xlsx');
  });

  // ---------- search ----------
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchText = e.target.value;
    if(searchText) currentView = 'list';
    renderAll();
  });

  // ---------- 담당자 필터 ----------
  document.getElementById('managerFilter').addEventListener('change', (e)=>{
    selectedManager = e.target.value;
    currentView = 'list';
    renderAll();
  });

  // ---------- ESC로 상세보기 → 전체화면(목록) 복귀 ----------
  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Escape') return;
    if(overlay.classList.contains('show')) return;
    if(modeOverlay.classList.contains('show')) return;
    if(currentView !== 'detail') return;
    currentView = 'list';
    renderAll();
  });

  // ---------- render all ----------
  function renderSeoulShapes(){
    if(!seoulShapeLayer) return;
    if(currentView==='detail') return; // 상세보기에선 focusMapOnSite가 그린 단일 구 강조를 그대로 둠
    seoulShapeLayer.clearLayers();
    if(regionFocusMode && selectedDistrict){
      // 지역선택으로 특정 구/시를 볼 때는 그 지역 하나만 색칠, 나머지는 안 그려서(=흑백 지도) 구분되게 함
      const sidoName = selectedDistrict.split(' ')[0];
      const guName = selectedDistrict.split(' ').pop();
      const shape = shapeFor(sidoName, guName);
      if(shape){
        L.polygon(shape, {
          color:'#dba13a', weight:1.5, opacity:.8,
          fillColor:'#fef3c7', fillOpacity:.35,
          interactive:false
        }).addTo(seoulShapeLayer);
      }
      return;
    }
    const activeGu = new Set(sites.map(s=> (s.district||'').split(' ').pop()));
    Object.keys(SEOUL_DISTRICT_SHAPES).forEach(name=>{
      const isActive = activeGu.has(name);
      L.polygon(SEOUL_DISTRICT_SHAPES[name], {
        color:'#8b7cc9', weight:1.2, opacity:.7,
        fillColor: isActive ? '#fef3c7' : '#a78bfa',
        fillOpacity: isActive ? .5 : .42,
        interactive:false
      }).addTo(seoulShapeLayer);
    });
  }

  function renderAll(){
    renderTabs();
    renderManagerFilter();
    renderSidebar();
    renderMap();
    renderSeoulShapes();
  }
  // 현재 사업소에 실제로 존재하는 담당자 목록으로 필터 옵션을 채움
  function renderManagerFilter(){
    const el = document.getElementById('managerFilter');
    if(!el) return;
    const names = [...new Set(sites.map(s=>s.manager).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    if(!names.includes(selectedManager)) selectedManager = '';
    el.innerHTML = '<option value="">담당자 전체</option>' +
      names.map(n=>`<option value="${escapeHtml(n)}"${n===selectedManager?' selected':''}>${escapeHtml(n)}</option>`).join('');
  }

  // ---------- 모드 선택 ----------
  const modeOverlay = document.getElementById('modeOverlay');
  const modeChoiceRow = document.getElementById('modeChoiceRow');
  const pwRow = document.getElementById('pwRow');
  const pwInput = document.getElementById('pwInput');
  const pwError = document.getElementById('pwError');

  document.getElementById('adminModeBtn').addEventListener('click', ()=>{
    modeChoiceRow.style.display = 'none';
    pwRow.style.display = 'block';
    pwError.style.display = 'none';
    pwInput.value = '';
    pwInput.focus();
  });

  document.getElementById('guestModeBtn').addEventListener('click', ()=>{
    guestMode = true;
    modeOverlay.classList.remove('show');
  });

  async function tryPasswordSubmit(){
    const pw = pwInput.value;
    const hash = await sha256Hex(pw);
    if(hash===EDIT_PASSWORD_HASH){
      try{ localStorage.setItem('editUnlocked','1'); }catch(e){}
      modeOverlay.classList.remove('show');
    }else{
      pwError.style.display = 'block';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  document.getElementById('pwConfirmBtn').addEventListener('click', tryPasswordSubmit);
  pwInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter') tryPasswordSubmit();
  });
  document.getElementById('pwCancelBtn').addEventListener('click', ()=>{
    pwRow.style.display = 'none';
    modeChoiceRow.style.display = 'block';
  });

  // ---------- boot ----------
  (async function(){
    try{
      initFormSelects();
      initMap();
      await loadSites();
      await loadDistrictLabelOverrides();
      const brandEl = document.querySelector('.brand');
      if(brandEl) brandEl.textContent = currentOffice + ' 스크린';
      renderOfficeTabs();
      renderAll();
      renderSeoulShapes();
      renderRegionPanel();
    }catch(e){
      console.error('초기화 중 오류 발생, 화면을 최대한 복구합니다', e);
      // 여기까지 왔다는 건 데이터 로딩/보정 중 어딘가 문제가 있었다는 뜻이므로,
      // 화면이 완전히 빈 채로 남지 않도록 최소한 기본값으로라도 다시 그려봄
      try{
        if(!Array.isArray(sites)) sites = [];
        renderOfficeTabs();
        renderAll();
        renderSeoulShapes();
        renderRegionPanel();
      }catch(e2){ console.error('복구 렌더링도 실패', e2); }
      alert('데이터를 불러오는 중 문제가 있었어요. 화면이 이상하면 새로고침 해주세요. (자세한 내용은 개발자 도구 콘솔 참고)');
    }
  })();
})();
</script>
</body>
