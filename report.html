<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단톡방 일일 보고</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb;
    --text-main:#1f2430; --text-dim:#8a92a3; --accent:#1e3a8a; --accent-soft:#dbe4ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
  #app{max-width:960px;margin:0 auto;padding:18px 16px 60px;}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .title-input{font-size:17px;font-weight:800;border:none;background:transparent;flex:none;min-width:120px;color:var(--text-main);}
  .title-input:focus{outline:none;border-bottom:2px solid var(--accent);}
  .title-date{font-size:16px;color:var(--text-dim);font-weight:700;flex:1;white-space:nowrap;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#c3cbe8;cursor:default;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text-main);}
  .file-label{position:relative;overflow:hidden;}
  .file-label input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:60px 20px;text-align:center;color:var(--text-dim);}
  .empty-state b{color:var(--text-main);}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat-label{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
  .stat-value{font-size:20px;font-weight:800;}
  .stat-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
  .section h3{margin:0 0 14px;font-size:14.5px;}

  .hourchart{display:flex;align-items:flex-end;gap:3px;height:130px;}
  .hourbar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .hourbar-count{font-size:9px;color:var(--accent);font-weight:700;margin-bottom:2px;height:11px;}
  .hourbar{width:100%;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;}
  .hourbar.peak{background:var(--accent);}
  .hourlabels{display:flex;gap:3px;margin-top:6px;}
  .hourlabels span{flex:1;font-size:9px;color:var(--text-dim);text-align:center;}

  .rank-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .rank-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{width:18px;font-size:11px;font-weight:800;color:var(--text-dim);flex:none;}
  .rank-name{width:96px;flex:none;font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-bar-wrap{flex:1;background:#f0f1f5;border-radius:4px;height:6px;overflow:hidden;}
  .rank-bar{height:100%;background:var(--accent);border-radius:4px;}
  .rank-count{width:44px;flex:none;text-align:right;font-size:11px;color:var(--text-dim);}
  .rank-col-title{font-size:11px;color:var(--text-dim);font-weight:700;margin-bottom:6px;}

  .kp-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .kp-card:last-child{margin-bottom:0;}
  .kp-title{font-size:13.5px;font-weight:800;margin-bottom:5px;}
  .kp-summary{font-size:12.5px;color:#4b5261;line-height:1.6;}

  .stance-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
  .stance-col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stance-head{font-size:13px;font-weight:800;margin-bottom:10px;}
  .stance-item{border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .stance-item:last-child{margin-bottom:0;}
  .stance-speaker{font-size:11px;font-weight:800;color:#374151;margin-bottom:3px;}
  .stance-quote{font-size:12px;color:#4b5261;line-height:1.5;}

  .link-item{display:block;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .link-item:last-child{border-bottom:none;}
  .link-meta{color:var(--text-dim);font-size:11px;margin-right:6px;}

  .placeholder-text{color:var(--text-dim);font-size:12.5px;text-align:center;padding:20px;}

  @media (max-width:700px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .stance-grid{grid-template-columns:1fr;}
    .rank-cols{grid-template-columns:1fr;}
  }

  @media print{
    @page{ size: A4 portrait; margin: 12mm; }
    body{background:#fff !important;}
    #app{max-width:100% !important; padding:0 !important;}
    .file-label, #aiBtn, #dateFilter, #savedDateSelect, #printBtn, #copyBtn, #downloadBtn{display:none !important;}
    .title-input{font-size:19px !important;}
    /* 좁은 인쇄 미리보기 폭에서도 반응형(모바일용) 배치로 안 바뀌게 강제 고정 */
    .stat-row{grid-template-columns:repeat(4,1fr) !important;}
    .stance-grid{grid-template-columns:1fr 1fr 1fr !important; gap:8px !important;}
    .rank-cols{grid-template-columns:1fr 1fr !important;}
    /* 섹션이 페이지 중간에서 잘리지 않도록 */
    .section, .stat-card, .stance-col{page-break-inside:avoid; break-inside:avoid;}
    .section{margin-bottom:10px !important; padding:12px !important;}
    .stat-row{margin-bottom:10px !important;}
    .hourchart{height:90px !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <input id="titleInput" class="title-input" value="단톡방 일일 보고">
    <span id="titleDate" class="title-date"></span>
    <select id="savedDateSelect" class="btn btn-ghost" style="display:none;" title="저장된 날짜 바로 보기 (업로드 불필요)"></select>
    <label class="file-label btn btn-ghost">
      카톡 txt 업로드
      <input id="fileInput" type="file" accept=".txt">
    </label>
    <button class="btn btn-ghost" id="clearBtn" title="지금 화면 내용을 지우고 새 톡방을 새로 시작">🗑 지우기</button>
    <select id="dateFilter" class="btn btn-ghost" style="display:none;"></select>
    <button class="btn btn-primary" id="aiBtn" disabled>AI로 다시 분석</button>
    <button class="btn btn-ghost" id="printBtn" onclick="window.print()">🖨 인쇄</button>
    <button class="btn btn-ghost no-print" id="copyBtn">📋 요약 복사</button>
    <button class="btn btn-ghost no-print" id="downloadBtn">⬇️ 요약 txt</button>
  </div>

  <div id="content">
    <div class="empty-state">
      카카오톡 채팅방에서 <b>"대화 내보내기(.txt)"</b>로 저장한 파일을 위에서 업로드해주세요.<br>
      업로드하면 통계와 발언 성향 분석(우호적/비방/그외)이 바로 정리돼요.
    </div>
  </div>
</div>

<script>
(function(){
  let parsed = null;
  let aiAnalysisCache = {}; // { dateFilterValue: daily } - 이번 세션 안에서 AI로 이미 분석한 날짜는 다시 안 물어보고 재사용

  // 날짜별로 직접 분석해둔 내용 (그 날짜의 파일을 올렸을 때만 표시됨 - 다른 날짜엔 안내문구가 뜸)
  const DAILY_ANALYSIS = {}; // 이제 특정 톡방 예시 데이터 없이 깨끗하게 시작 (업로드한 파일로만 분석)

  // 날짜별로 미리 계산해둔 "통계" (총 메시지 수, 시간대별 대화량, 발언 순위, 링크 등).
  // 카톡 txt를 채팅으로 보내주시면 이 형식으로 계산해서 채워드려요.
  // 채워두면, 사이트를 열었을 때 업로드 없이도 그 날짜의 통계까지 바로 보여요.
  const DAILY_STATS = {
    // '2026년 7월 30일 목요일': {
    //   total: 123, participantCount: 40,
    //   hourCounts: [0,0,...] (24개), peakHour: 21,
    //   hourTopSpeakers: [null,...,{names:['홍길동'],count:3},...] (24개),
    //   ranking: [{name:'홍길동', count:12}, ...],
    //   links: [{url:'https://...', name:'홍길동'}, ...],
    //   mediaCount: 5, deletedCount: 1
    // }
  };

  function findDailyAnalysis(dates){
    if(!dates || dates.length===0) return null;
    if(dates.length===1) return DAILY_ANALYSIS[dates[0]] || null;

    // 여러 날짜가 섞인 파일이면, 그 중 분석해둔 날짜들을 찾아서 합쳐서 보여줌
    const matched = dates.filter(d=>DAILY_ANALYSIS[d]);
    if(matched.length===0) return null;

    const merged = {keyPoints:[], favorable:[], critical:[], other:[]};
    matched.forEach(d=>{
      const day = DAILY_ANALYSIS[d];
      const shortDate = (d.match(/(\d{1,2})월\s*(\d{1,2})일/)||[])[0] || d;
      day.keyPoints.forEach(kp=> merged.keyPoints.push({title:`[${shortDate}] ${kp.title}`, summary:kp.summary}));
      day.favorable.forEach(it=> merged.favorable.push({speaker:`${it.speaker} (${shortDate})`, quote:it.quote}));
      day.critical.forEach(it=> merged.critical.push({speaker:`${it.speaker} (${shortDate})`, quote:it.quote}));
      day.other.forEach(it=> merged.other.push({speaker:`${it.speaker} (${shortDate})`, quote:it.quote}));
    });
    return merged;
  }

  const fileInput = document.getElementById('fileInput');
  const aiBtn = document.getElementById('aiBtn');
  const content = document.getElementById('content');

  // 제목 옆에 오늘 날짜 자동 표시
  (function(){
    const titleDate = document.getElementById('titleDate');
    const d = new Date();
    titleDate.textContent = `${String(d.getFullYear()).slice(2)}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  })();

  function isSystemLine(line){
    // "OOO님이 들어왔습니다", "OOO님이 나갔습니다" 등 입퇴장 알림
    if(/님이 (들어왔습니다|나갔습니다)/.test(line)) return true;
    // 저장 정보/제목 줄, 사칭주의 등 카톡이 자동으로 붙이는 공지성 문구
    if(/^저장한 날짜\s*:/.test(line)) return true;
    if(/님과 카카오톡 대화$/.test(line)) return true;
    if(/^(타인, 기관 등의 사칭|불법촬영물 식별)/.test(line)) return true;
    return false;
  }

  function parseKakaoTxt(raw){
    const lines = raw.split(/\r?\n/);
    const msgLineRe = /^\[(.+?)\]\s\[(오전|오후)\s(\d{1,2}):(\d{2})\]\s(.*)$/;
    const dateLineRe = /^-{3,}\s*(.+요일)\s*-{3,}$/;

    const messages = [];
    let currentDate = null;
    let current = null;

    for(const rawLine of lines){
      const line = rawLine.trim();
      if(!line) continue;
      if(isSystemLine(line)) continue; // 입퇴장 알림 등은 완전히 무시 (이전 메시지에 붙지 않게)
      const dateMatch = line.match(dateLineRe);
      if(dateMatch){ currentDate = dateMatch[1]; current = null; continue; }
      const m = line.match(msgLineRe);
      if(m){
        const [, name, ampm, hourStr, minStr, text] = m;
        let hour = parseInt(hourStr,10);
        if(ampm==='오전'){ if(hour===12) hour=0; }
        else{ if(hour!==12) hour+=12; }
        current = {name:name.trim(), date:currentDate, hour, min:parseInt(minStr,10), text: text};
        messages.push(current);
      }else{
        if(current){ current.text += '\n' + line; }
      }
    }
    return messages;
  }

  function isSystemNotice(text){
    return /^(사진|동영상|이모티콘|삭제된 메시지입니다|메시지가 삭제되었습니다\.?)$/.test(text.trim());
  }

  function analyze(messages){
    const participants = {};
    const hourCounts = new Array(24).fill(0);
    const hourSpeakers = Array.from({length:24}, ()=>({})); // 시간대별 {이름:건수}
    const links = [];
    let mediaCount = 0;
    let deletedCount = 0;
    const dates = new Set();

    messages.forEach(m=>{
      if(m.date) dates.add(m.date);
      const trimmed = m.text.trim();
      const isDeleted = /메시지가 삭제되었습니다/.test(trimmed);
      const isMedia = /^(사진|동영상|이모티콘)$/.test(trimmed);
      if(isDeleted) deletedCount++;
      if(isMedia) mediaCount++;

      participants[m.name] = (participants[m.name]||0) + 1;
      hourCounts[m.hour]++;
      hourSpeakers[m.hour][m.name] = (hourSpeakers[m.hour][m.name]||0) + 1;

      const urlMatches = trimmed.match(/https?:\/\/[^\s]+/g);
      if(urlMatches) urlMatches.forEach(u=> links.push({url:u, name:m.name}));
    });

    const ranking = Object.entries(participants)
      .sort((a,b)=>b[1]-a[1])
      .map(([name,count])=>({name,count}));

    const peakHour = hourCounts.indexOf(Math.max(...hourCounts));

    // 시간대별 발언 Top1(동률이면 Top까지 여러명) 계산
    const hourTopSpeakers = hourSpeakers.map(obj=>{
      const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0) return null;
      const topCount = entries[0][1];
      const tops = entries.filter(e=>e[1]===topCount).map(e=>e[0]);
      return {names:tops, count:topCount};
    });

    return {
      total: messages.length,
      participantCount: ranking.length,
      dates: Array.from(dates),
      hourCounts,
      hourTopSpeakers,
      peakHour,
      ranking,
      links,
      mediaCount,
      deletedCount
    };
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 발언 순위를 2단 컬럼으로: 절반씩 나눠서 (예: 10개면 1~5/6~10, 20개면 1~10/11~20)
  function renderRankingCols(ranking){
    const maxCount = ranking.length ? ranking[0].count : 1;
    const half = Math.ceil(ranking.length/2);
    const colA = ranking.slice(0, half);
    const colB = ranking.slice(half);

    function rows(list, startIdx){
      return list.map((r,i)=>`
        <div class="rank-row">
          <div class="rank-num">${startIdx+i+1}</div>
          <div class="rank-name">${escapeHtml(r.name)}</div>
          <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(r.count/maxCount)*100}%"></div></div>
          <div class="rank-count">${r.count}건</div>
        </div>`).join('');
    }

    const labelA = colA.length ? `${1}~${colA.length}위` : '';
    const labelB = colB.length ? `${half+1}~${half+colB.length}위` : '';

    return `
      <div class="rank-cols">
        <div>
          <div class="rank-col-title">${labelA}</div>
          ${rows(colA, 0) || '<div class="placeholder-text">데이터가 없어요.</div>'}
        </div>
        <div>
          ${colB.length ? `<div class="rank-col-title">${labelB}</div>` : ''}
          ${rows(colB, half)}
        </div>
      </div>`;
  }

  function renderStanceList(items, emptyText, bg){
    if(!items || items.length===0) return `<div class="placeholder-text">${emptyText}</div>`;
    return items.map(it=>`
      <div class="stance-item" style="background:${bg}">
        <div class="stance-speaker">${escapeHtml(it.speaker||'')}</div>
        <div class="stance-quote">${escapeHtml(it.quote||'')}</div>
      </div>`).join('');
  }

  // 지금까지 분석해둔 모든 날짜의 우호/비방 발언 수를 날짜순으로 비교해서 보여줌
  // 지금까지 분석해둔 모든 날짜를 합친 누적 통계 + 반복 발언자
  // 이름(부분 일치)으로 그 사람의 모든 우호/비방/그외 발언을 날짜와 함께 모아옴
  function searchSpeaker(keyword){
    keyword = (keyword||'').trim();
    if(!keyword) return [];
    const results = [];
    Object.keys(DAILY_ANALYSIS).sort().forEach(d=>{
      const dm = d.match(/(\d{1,2})월\s*(\d{1,2})일/);
      const shortDate = dm ? dm[0] : d;
      ['favorable','critical','other'].forEach(type=>{
        (DAILY_ANALYSIS[d][type]||[]).forEach(it=>{
          if((it.speaker||'').includes(keyword)){
            results.push({date:shortDate, type, speaker:it.speaker, quote:it.quote});
          }
        });
      });
    });
    return results;
  }

  function renderSpeakerSearchResult(keyword){
    const box = document.getElementById('speakerSearchResult');
    if(!box) return;
    keyword = keyword.trim();
    if(!keyword){ box.innerHTML=''; return; }
    const results = searchSpeaker(keyword);
    const bgMap = {favorable:'#f0fdf4', critical:'#fef2f2', other:'#f9fafb'};
    const labelMap = {favorable:'✅ 우호', critical:'🚫 비방', other:'💬 그외'};

    let html = '';
    if(results.length){
      html += `<div style="font-size:12px; font-weight:700; color:var(--text-dim); margin:6px 0;">분류된 발언 (${results.length}건)</div>`;
      html += results.map(r=>`
        <div class="stance-item" style="background:${bgMap[r.type]}">
          <div class="stance-speaker">${escapeHtml(r.speaker)} <span style="color:#8a92a3;font-weight:500;">· ${labelMap[r.type]} · ${r.date}</span></div>
          <div class="stance-quote">${escapeHtml(r.quote)}</div>
        </div>`).join('');
    }else{
      html += `<div class="placeholder-text">"${escapeHtml(keyword)}" 관련 분류된(우호/비방/그외) 발언이 없어요.</div>`;
    }

    // 지금 업로드된 파일의 실제 원문 메시지도 함께 보여줌 (날짜별로 몇 건 말했는지 + 실제 내용)
    if(parsed && parsed.length){
      const raw = parsed.filter(m=> m.name.includes(keyword) && !isSystemLine(m.text) && !isSystemNotice(m.text));
      html += `<div style="font-size:12px; font-weight:700; color:var(--text-dim); margin:12px 0 6px;">이 파일 안 실제 발언 (${raw.length}건)</div>`;
      if(raw.length){
        html += raw.map(m=>`
          <div class="stance-item" style="background:#f4f4f5;">
            <div class="stance-speaker">${escapeHtml(m.name)} <span style="color:#8a92a3;font-weight:500;">· ${escapeHtml(m.date||'')} ${String(m.hour).padStart(2,'0')}시</span></div>
            <div class="stance-quote">${escapeHtml(m.text)}</div>
          </div>`).join('');
      }else{
        html += '<div class="placeholder-text">지금 업로드된 파일에는 이 이름으로 된 발언이 없어요.</div>';
      }
    }

    box.innerHTML = html;
  }
  window.renderSpeakerSearchResult = renderSpeakerSearchResult;

  // 단어(키워드)로 지금 업로드된 파일의 실제 메시지 전체를 검색
  function renderKeywordSearchResult(keyword){
    const box = document.getElementById('keywordSearchResult');
    if(!box) return;
    keyword = keyword.trim();
    if(!keyword){ box.innerHTML=''; return; }
    if(!parsed || !parsed.length){
      box.innerHTML = '<div class="placeholder-text">먼저 카톡 txt 파일을 업로드해주세요.</div>';
      return;
    }
    const matches = parsed.filter(m=> m.text.includes(keyword) && !isSystemLine(m.text) && !isSystemNotice(m.text));
    if(matches.length===0){
      box.innerHTML = `<div class="placeholder-text">"${escapeHtml(keyword)}"가 포함된 메시지가 없어요.</div>`;
      return;
    }
    const esc = s => escapeHtml(s);
    const highlight = (text)=>{
      const idx = text.indexOf(keyword);
      if(idx<0) return esc(text);
      return esc(text.slice(0,idx)) + `<mark style="background:#fef08a; padding:0 2px;">${esc(text.slice(idx,idx+keyword.length))}</mark>` + esc(text.slice(idx+keyword.length));
    };
    box.innerHTML = `<div style="font-size:12px; color:var(--text-dim); margin-bottom:6px;">${matches.length}건 찾음</div>` +
      matches.map(m=>`
        <div class="stance-item" style="background:#f4f4f5;">
          <div class="stance-speaker">${esc(m.name)} <span style="color:#8a92a3;font-weight:500;">· ${esc(m.date||'')} ${String(m.hour).padStart(2,'0')}시</span></div>
          <div class="stance-quote">${highlight(m.text)}</div>
        </div>`).join('');
  }
  window.renderKeywordSearchResult = renderKeywordSearchResult;

  // 최근 절반 vs 이전 절반 날짜를 비교해서 여론 흐름을 한 줄 코멘트로 요약
  function computeTrendComment(){
    const dateKeys = Object.keys(DAILY_ANALYSIS).sort();
    if(dateKeys.length < 2) return null;
    const half = Math.ceil(dateKeys.length/2);
    const earlier = dateKeys.slice(0, half);
    const recent = dateKeys.slice(half);
    const sum = (arr,type)=> arr.reduce((s,d)=> s + (DAILY_ANALYSIS[d][type]||[]).length, 0);

    const eFav = sum(earlier,'favorable'), eCrit = sum(earlier,'critical');
    const rFav = sum(recent,'favorable'), rCrit = sum(recent,'critical');

    const critDelta = rCrit - eCrit;
    const favDelta = rFav - eFav;

    if(rCrit===0 && rFav===0) return '최근 분석된 날짜에는 포스코 관련 발언이 거의 없었어요.';
    if(critDelta >= 2 && critDelta > favDelta) return `⚠️ 최근 들어 비방 발언이 이전보다 늘어난 추세예요 (${eCrit}건 → ${rCrit}건). 여론 모니터링이 필요해 보여요.`;
    if(favDelta >= 2 && favDelta > critDelta) return `📈 최근 들어 우호적 발언이 이전보다 늘어난 추세예요 (${eFav}건 → ${rFav}건).`;
    if(rCrit > rFav) return '최근 여론은 우호적 발언보다 비방 발언이 조금 더 많은 편이에요.';
    if(rFav > rCrit) return '최근 여론은 전반적으로 우호적인 편이에요.';
    return '최근 여론은 우호/비방이 비슷하게 나타나고 있어요.';
  }

  // period: 'all' | 3 | 7 (최근 n일)
  function getFilteredDateKeys(period){
    const sorted = Object.keys(DAILY_ANALYSIS).map(d=>{
      const m = d.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
      return {key:d, sortKey: m ? `${m[1]}${m[2].padStart(2,'0')}${m[3].padStart(2,'0')}` : d};
    }).sort((a,b)=> a.sortKey.localeCompare(b.sortKey)).map(o=>o.key);
    if(period==='all') return sorted;
    return sorted.slice(-period);
  }

  function computeCumulativeStats(period){
    const dateKeys = getFilteredDateKeys(period||'all');
    let favTotal=0, critTotal=0, otherTotal=0;
    const speakerCounts = {}; // name -> {fav, crit}

    dateKeys.forEach(d=>{
      const day = DAILY_ANALYSIS[d];
      (day.favorable||[]).forEach(it=>{
        favTotal++;
        const name = (it.speaker||'').trim();
        if(!speakerCounts[name]) speakerCounts[name] = {fav:0, crit:0};
        speakerCounts[name].fav++;
      });
      (day.critical||[]).forEach(it=>{
        critTotal++;
        const name = (it.speaker||'').trim();
        if(!speakerCounts[name]) speakerCounts[name] = {fav:0, crit:0};
        speakerCounts[name].crit++;
      });
      otherTotal += (day.other||[]).length;
    });

    const repeatSpeakers = Object.entries(speakerCounts)
      .filter(([name,c])=> (c.fav+c.crit) >= 2)
      .map(([name,c])=>({name, ...c}))
      .sort((a,b)=> (b.fav+b.crit)-(a.fav+a.crit));

    return {favTotal, critTotal, otherTotal, dayCount:dateKeys.length, repeatSpeakers};
  }

  let currentCumPeriod = 'all';
  let selectedCumDates = new Set(); // 클릭으로 여러 날짜를 골라서 그 날짜들만 모아보는 용도

  function renderCumulativeSummary(){
    const s = computeCumulativeStats(currentCumPeriod);
    const trendComment = computeTrendComment();
    const repeatHtml = s.repeatSpeakers.length
      ? s.repeatSpeakers.map(r=>{
          const parts = [];
          if(r.fav) parts.push(`<span style="color:#16a34a;">우호 ${r.fav}회</span>`);
          if(r.crit) parts.push(`<span style="color:#dc2626;">비방 ${r.crit}회</span>`);
          const nameEsc = r.name.replace(/'/g,"\\'");
          return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px; cursor:pointer;" onclick="selectRepeatSpeaker('${nameEsc}')" title="클릭하면 이 발언자의 내용을 아래에서 볼 수 있어요">
            <span style="font-weight:700; text-decoration:underline; text-underline-offset:3px;">${escapeHtml(r.name)}</span>
            <span>${parts.join(' · ')}</span>
          </div>`;
        }).join('')
      : '<div class="placeholder-text">2회 이상 반복 언급된 발언자가 아직 없어요.</div>';

    const periodBtn = (val,label)=> `<button onclick="setCumPeriod('${val}')" style="border:1px solid var(--line); background:${currentCumPeriod===val?'var(--accent)':'#fff'}; color:${currentCumPeriod===val?'#fff':'inherit'}; border-radius:999px; padding:4px 12px; font-size:11.5px; font-weight:700; cursor:pointer; margin-right:6px;">${label}</button>`;

    const dateChips = getKnownDates().slice().reverse().map(d=>{
      const dm = d.match(/(\d{1,2})월\s*(\d{1,2})일/);
      const label = dm ? dm[0] : d;
      const active = selectedCumDates.has(d);
      const esc = d.replace(/'/g,"\\'");
      return `<button onclick="toggleCumDateChip('${esc}')" style="border:1px solid var(--line); background:${active?'var(--accent)':'#fff'}; color:${active?'#fff':'inherit'}; border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700; cursor:pointer;">${escapeHtml(label)}</button>`;
    }).join('');

    let cumDateDetailHtml = '';
    if(selectedCumDates.size){
      const sortedSelected = sortDateKeys(Array.from(selectedCumDates));
      const bgMap = {favorable:'#f0fdf4', critical:'#fef2f2', other:'#f9fafb'};
      const labelMap = {favorable:'✅ 우호', critical:'🚫 비방', other:'💬 그외'};
      let rows = '';
      let total = 0;
      const shortLabels = [];
      sortedSelected.forEach(d=>{
        const dm = d.match(/(\d{1,2})월\s*(\d{1,2})일/);
        const shortDate = dm ? dm[0] : d;
        shortLabels.push(shortDate);
        const day = DAILY_ANALYSIS[d];
        if(!day){
          rows += `<div class="placeholder-text">${escapeHtml(shortDate)}은 아직 분석해둔 내용이 없어요.</div>`;
          return;
        }
        ['favorable','critical','other'].forEach(type=>{
          (day[type]||[]).forEach(it=>{
            total++;
            rows += `<div class="stance-item" style="background:${bgMap[type]}">
              <div class="stance-speaker">${escapeHtml(it.speaker||'')} <span style="color:#8a92a3;font-weight:500;">· ${labelMap[type]} · ${escapeHtml(shortDate)}</span></div>
              <div class="stance-quote">${escapeHtml(it.quote||'')}</div>
            </div>`;
          });
        });
      });
      cumDateDetailHtml = `
        <div style="margin-bottom:14px;">
          <div style="font-size:13px; font-weight:800; margin-bottom:8px;">선택한 날짜 발언자 (${shortLabels.join(', ')}) · ${total}건</div>
          ${rows || '<div class="placeholder-text">선택한 날짜에 분류된 발언이 없어요.</div>'}
        </div>`;
    }

    return `
      <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${periodBtn('all','전체 기간')}${periodBtn(7,'최근 7일')}${periodBtn(3,'최근 3일')}
      </div>
      <div style="margin-bottom:10px;">
        <div style="font-size:12px; color:var(--text-dim); margin-bottom:6px;">날짜별 발언자 보기 (여러 날짜 클릭 가능)</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          ${dateChips}
          ${selectedCumDates.size ? `<button onclick="clearCumDateChips()" style="border:1px dashed var(--line); background:#fff; color:var(--text-dim); border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700; cursor:pointer;">선택 해제</button>` : ''}
        </div>
      </div>
      ${cumDateDetailHtml}
      ${trendComment ? `<div style="background:var(--bg-side-2); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12.5px; font-weight:600;">${escapeHtml(trendComment)}</div>` : ''}
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">분석된 날짜</div><div class="stat-value">${s.dayCount}일</div></div>
        <div class="stat-card" style="cursor:pointer;" onclick="toggleCumDetail('favorable')"><div class="stat-label">누적 우호적 (클릭)</div><div class="stat-value" style="color:#16a34a;">${s.favTotal}건</div></div>
        <div class="stat-card" style="cursor:pointer;" onclick="toggleCumDetail('critical')"><div class="stat-label">누적 비방 (클릭)</div><div class="stat-value" style="color:#dc2626;">${s.critTotal}건</div></div>
        <div class="stat-card" style="cursor:pointer;" onclick="toggleCumDetail('other')"><div class="stat-label">누적 그외 (클릭)</div><div class="stat-value">${s.otherTotal}건</div></div>
      </div>
      <div id="cumDetailBox" style="display:none; margin-bottom:14px;"></div>
      <div style="margin-top:4px;">
        <div style="font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;">반복 발언자 (2회 이상, 선택된 기간 기준)</div>
        ${repeatHtml}
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;">발언자 검색 (이름 입력)</div>
        <input id="speakerSearchInput" placeholder="예: 손한준" oninput="renderSpeakerSearchResult(this.value)"
          style="width:100%; padding:8px 10px; font-size:12.5px; border-radius:8px; border:1px solid var(--line); background:#fff; box-sizing:border-box; margin-bottom:8px;">
        <div id="speakerSearchResult"></div>
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;">키워드 검색 (단어 입력, 지금 업로드된 파일 기준)</div>
        <input id="keywordSearchInput" placeholder="예: 임대, 분담금, 이주비" oninput="renderKeywordSearchResult(this.value)"
          style="width:100%; padding:8px 10px; font-size:12.5px; border-radius:8px; border:1px solid var(--line); background:#fff; box-sizing:border-box; margin-bottom:8px;">
        <div id="keywordSearchResult"></div>
      </div>`;
  }

  function setCumPeriod(period){
    currentCumPeriod = (period==='all') ? 'all' : Number(period);
    const wrap = document.getElementById('cumulativeSummaryWrap');
    if(wrap) wrap.innerHTML = renderCumulativeSummary();
  }
  window.setCumPeriod = setCumPeriod;

  // 누적 요약 카드를 클릭했을 때, 해당 종류(우호/비방/그외)의 발언을 날짜와 함께 전부 펼쳐서 보여줌
  function toggleCumDetail(type){
    const box = document.getElementById('cumDetailBox');
    if(!box) return;
    if(box.dataset.type===type && box.style.display!=='none'){
      box.style.display = 'none';
      box.dataset.type = '';
      return;
    }
    const bgMap = {favorable:'#f0fdf4', critical:'#fef2f2', other:'#f9fafb'};
    const titleMap = {favorable:'✅ 우호적 발언 전체', critical:'🚫 비방 발언 전체', other:'💬 그 외 발언 전체'};
    const dateKeys = getFilteredDateKeys(currentCumPeriod);
    let rows = '';
    dateKeys.forEach(d=>{
      const items = DAILY_ANALYSIS[d][type]||[];
      const dm = d.match(/(\d{1,2})월\s*(\d{1,2})일/);
      const shortDate = dm ? dm[0] : d;
      items.forEach(it=>{
        rows += `<div class="stance-item" style="background:${bgMap[type]}">
          <div class="stance-speaker">${escapeHtml(it.speaker||'')} <span style="color:#8a92a3;font-weight:500;">· ${shortDate}</span></div>
          <div class="stance-quote">${escapeHtml(it.quote||'')}</div>
        </div>`;
      });
    });
    box.innerHTML = `<div style="font-size:13px; font-weight:800; margin-bottom:8px;">${titleMap[type]}</div>${rows || '<div class="placeholder-text">해당 발언이 없어요.</div>'}`;
    box.style.display = 'block';
    box.dataset.type = type;
  }

  // onclick="..." 인라인 핸들러에서 호출할 수 있도록 전역에 노출
  window.toggleCumDetail = toggleCumDetail;

  // 반복 발언자 이름을 클릭하면, 발언자 검색창에 이름을 채우고 그 사람의 내용을 바로 보여줌
  function selectRepeatSpeaker(name){
    const input = document.getElementById('speakerSearchInput');
    if(input) input.value = name;
    renderSpeakerSearchResult(name);
    const box = document.getElementById('speakerSearchResult');
    if(box && box.scrollIntoView) box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  window.selectRepeatSpeaker = selectRepeatSpeaker;

  // 전체 누적 요약의 날짜 칩(버튼)을 클릭하면 선택/해제 토글하고, 선택된 날짜들을 모아서 다시 그림
  function toggleCumDateChip(dateKey){
    if(selectedCumDates.has(dateKey)) selectedCumDates.delete(dateKey);
    else selectedCumDates.add(dateKey);
    const wrap = document.getElementById('cumulativeSummaryWrap');
    if(wrap) wrap.innerHTML = renderCumulativeSummary();
  }
  window.toggleCumDateChip = toggleCumDateChip;

  function clearCumDateChips(){
    selectedCumDates.clear();
    const wrap = document.getElementById('cumulativeSummaryWrap');
    if(wrap) wrap.innerHTML = renderCumulativeSummary();
  }
  window.clearCumDateChips = clearCumDateChips;

  function renderTrendChart(){
    const dateKeys = Object.keys(DAILY_ANALYSIS);
    if(dateKeys.length===0) return '<div class="placeholder-text">아직 분석해둔 날짜가 없어요.</div>';

    // "2026년 7월 17일 금요일" 같은 문자열에서 정렬/표시용 값 추출
    const parsed = dateKeys.map(d=>{
      const m = d.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
      return {
        key:d,
        sortKey: m ? `${m[1]}${m[2].padStart(2,'0')}${m[3].padStart(2,'0')}` : d,
        label: m ? `${m[2]}/${m[3]}` : d,
        favorable: (DAILY_ANALYSIS[d].favorable||[]).length,
        critical: (DAILY_ANALYSIS[d].critical||[]).length
      };
    }).sort((a,b)=> a.sortKey.localeCompare(b.sortKey));

    const maxVal = Math.max(1, ...parsed.map(p=>Math.max(p.favorable,p.critical)));

    const bars = parsed.map(p=>`
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:36px;">
        <div style="display:flex; align-items:flex-end; gap:2px; height:100%;">
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer;" onclick="showDateDetail('${p.key.replace(/'/g,"\\'")}','favorable')">
            <span style="font-size:9px; color:#16a34a; font-weight:700;">${p.favorable>0?p.favorable:''}</span>
            <div title="우호적 ${p.favorable}건 (클릭)" style="width:12px; border-radius:2px 2px 0 0; background:#16a34a; height:${Math.max(2,(p.favorable/maxVal)*100)}%;"></div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer;" onclick="showDateDetail('${p.key.replace(/'/g,"\\'")}','critical')">
            <span style="font-size:9px; color:#dc2626; font-weight:700;">${p.critical>0?p.critical:''}</span>
            <div title="비방 ${p.critical}건 (클릭)" style="width:12px; border-radius:2px 2px 0 0; background:#dc2626; height:${Math.max(2,(p.critical/maxVal)*100)}%;"></div>
          </div>
        </div>
        <div style="font-size:10px; color:#8a92a3; margin-top:4px; white-space:nowrap;">${p.label}</div>
      </div>`).join('');

    return `
      <div style="display:flex; align-items:flex-end; gap:8px; height:110px; overflow-x:auto; padding-bottom:4px;">${bars}</div>
      <div style="display:flex; gap:14px; margin-top:8px; font-size:11px; color:#8a92a3;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#16a34a;margin-right:4px;"></span>우호적</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#dc2626;margin-right:4px;"></span>비방</span>
      </div>
      <div id="dateDetailBox" style="display:none; margin-top:10px;"></div>`;
  }

  // 특정 날짜의 우호적/비방 발언만 펼쳐서 보여줌
  function showDateDetail(dateKey, type){
    const box = document.getElementById('dateDetailBox');
    if(!box) return;
    const tag = dateKey + '|' + type;
    if(box.dataset.tag===tag && box.style.display!=='none'){
      box.style.display = 'none';
      box.dataset.tag = '';
      return;
    }
    const day = DAILY_ANALYSIS[dateKey];
    const items = day ? (day[type]||[]) : [];
    const bgMap = {favorable:'#f0fdf4', critical:'#fef2f2'};
    const titleMap = {favorable:'✅ 우호적 발언', critical:'🚫 비방 발언'};
    const dm = dateKey.match(/(\d{1,2})월\s*(\d{1,2})일/);
    const shortDate = dm ? dm[0] : dateKey;
    box.innerHTML = `<div style="font-size:12.5px; font-weight:800; margin-bottom:8px;">${shortDate} - ${titleMap[type]} (${items.length}건)</div>` +
      (items.length
        ? items.map(it=>`<div class="stance-item" style="background:${bgMap[type]}"><div class="stance-speaker">${escapeHtml(it.speaker||'')}</div><div class="stance-quote">${escapeHtml(it.quote||'')}</div></div>`).join('')
        : '<div class="placeholder-text">해당 발언이 없어요.</div>');
    box.style.display = 'block';
    box.dataset.tag = tag;
  }
  window.showDateDetail = showDateDetail;

  function renderHourlySpeakers(hourTopSpeakers){
    const rows = hourTopSpeakers
      .map((info,h)=> info ? {h,...info} : null)
      .filter(Boolean);
    if(rows.length===0) return '<div class="placeholder-text">데이터가 없어요.</div>';
    return `<div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
      ${rows.map(r=>`
        <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; cursor:pointer;" onclick="showHourMessages(${r.h})">
          <span style="color:#8a92a3;">${r.h}시</span>
          <span style="font-weight:700;">${r.names.map(n=>escapeHtml(n)).join(', ')}</span>
          <span style="color:#8a92a3;">${r.count}건 ▾</span>
        </div>`).join('')}
    </div>
    <div id="hourDetailBox" style="display:none; margin-top:10px;"></div>`;
  }

  // 특정 시간대에 실제로 오간 메시지들을 펼쳐서 보여줌
  function showHourMessages(hour){
    const box = document.getElementById('hourDetailBox');
    if(!box) return;
    if(box.dataset.hour==String(hour) && box.style.display!=='none'){
      box.style.display = 'none';
      box.dataset.hour = '';
      return;
    }
    const msgs = (parsed||[]).filter(m=>m.hour===hour && !isSystemLine(m.text) && !isSystemNotice(m.text));
    box.innerHTML = `<div style="font-size:12.5px; font-weight:800; margin-bottom:8px;">${hour}시에 오간 메시지 (${msgs.length}건)</div>` +
      (msgs.length
        ? msgs.map(m=>`<div class="stance-item" style="background:#f9fafb;"><div class="stance-speaker">${escapeHtml(m.name)}</div><div class="stance-quote">${escapeHtml(m.text)}</div></div>`).join('')
        : '<div class="placeholder-text">메시지가 없어요.</div>');
    box.style.display = 'block';
    box.dataset.hour = String(hour);
  }
  window.showHourMessages = showHourMessages;

  // a(통계, analyze()와 같은 모양) + daily(정성 분석)를 받아서 보고서 HTML을 만듦.
  // a가 null이면 "아직 통계 없음" 안내만 보여주고, 정성 분석(daily)은 있으면 그대로 보여줌.
  function buildReportHtml(a, daily){
    let statsBlock, rankLinkBlock;

    if(a){
      const maxHour = Math.max(...a.hourCounts,1);
      const hourBars = a.hourCounts.map((c,h)=>`
        <div class="hourbar-col" title="${h}시: ${c}건">
          <div class="hourbar-count" style="color:${c>0?'var(--accent)':'transparent'}">${c>0?c:''}</div>
          <div class="hourbar ${h===a.peakHour?'peak':''}" style="height:${Math.max(2,(c/maxHour)*100)}%"></div>
        </div>`).join('');
      const hourLabels = a.hourCounts.map((c,h)=> h%3===0 ? `<span>${h}시</span>` : `<span></span>`).join('');
      const linkRows = a.links.slice(0,30).map(l=>`<a class="link-item" href="${escapeHtml(l.url)}" target="_blank" rel="noopener"><span class="link-meta">${escapeHtml(l.name)}</span>${escapeHtml(l.url)}</a>`).join('') || '<div class="placeholder-text">공유된 링크가 없어요.</div>';

      statsBlock = `
        <div class="stat-row">
          <div class="stat-card"><div class="stat-label">총 메시지</div><div class="stat-value">${a.total.toLocaleString()}</div><div class="stat-sub">${(a.dates||[]).join(', ')||'-'}</div></div>
          <div class="stat-card"><div class="stat-label">참여자</div><div class="stat-value">${a.participantCount}</div><div class="stat-sub">명</div></div>
          <div class="stat-card"><div class="stat-label">가장 활발한 시간</div><div class="stat-value">${a.peakHour}시</div><div class="stat-sub">${a.hourCounts[a.peakHour]}건</div></div>
          <div class="stat-card"><div class="stat-label">공유 링크 · 사진</div><div class="stat-value">${a.links.length} · ${a.mediaCount}</div><div class="stat-sub">삭제된 메시지 ${a.deletedCount}건</div></div>
        </div>

        <div class="section">
          <h3>시간대별 대화량</h3>
          <div class="hourchart">${hourBars}</div>
          <div class="hourlabels">${hourLabels}</div>
        </div>

        <div class="section">
          <h3>시간대별 발언자</h3>
          ${renderHourlySpeakers(a.hourTopSpeakers)}
        </div>`;

      rankLinkBlock = `
        <div class="section">
          <h3>발언 순위 Top ${Math.min(a.ranking.length,20)}</h3>
          ${renderRankingCols(a.ranking.slice(0,20))}
        </div>

        <div class="section">
          <h3>공유된 링크</h3>
          <div>${linkRows}</div>
        </div>`;
    }else{
      statsBlock = `
        <div class="section">
          <div class="placeholder-text">이 날짜는 대화량 통계(총 메시지 수·시간대별 대화량·발언 순위 등)가 아직 준비되지 않았어요.<br>카톡 txt를 업로드하시면 바로 계산해서 보여드리고, 다롱님께 보내주시면 다음부터는 업로드 없이도 볼 수 있게 만들어드려요.</div>
        </div>`;
      rankLinkBlock = '';
    }

    return `
      ${statsBlock}

      <div class="section">
        <h3>중점 내용</h3>
        ${ daily
          ? daily.keyPoints.map(kp=>`<div class="kp-card"><div class="kp-title">${escapeHtml(kp.title)}</div><div class="kp-summary">${escapeHtml(kp.summary)}</div></div>`).join('')
          : '<div class="placeholder-text">이 파일(날짜)은 아직 분석해둔 내용이 없어요.<br>대화 내용을 채팅으로 공유해주시면, 직접 읽고 중점 내용을 정리해드릴게요.</div>'
        }
      </div>

      <div class="stance-grid">
        <div class="stance-col">
          <div class="stance-head" style="color:#16a34a;">✅ 우호적 발언</div>
          ${daily ? renderStanceList(daily.favorable, '우호적 발언이 없어요.', '#f0fdf4') : '<div class="placeholder-text">채팅으로 대화 내용을 주시면 분류해드려요.</div>'}
        </div>
        <div class="stance-col">
          <div class="stance-head" style="color:#dc2626;">🚫 비방 발언</div>
          ${daily ? renderStanceList(daily.critical, '비방 발언이 없어요.', '#fef2f2') : '<div class="placeholder-text">채팅으로 대화 내용을 주시면 분류해드려요.</div>'}
        </div>
        <div class="stance-col">
          <div class="stance-head" style="color:#6b7280;">💬 그 외 발언</div>
          ${daily ? renderStanceList(daily.other, '해당 발언이 없어요.', '#f9fafb') : '<div class="placeholder-text">채팅으로 대화 내용을 주시면 분류해드려요.</div>'}
        </div>
      </div>

      <div class="section">
        <h3>날짜별 여론 추이 (분석해둔 날짜 기준)</h3>
        ${renderTrendChart()}
      </div>

      <div class="section">
        <h3>전체 누적 요약</h3>
        <div id="cumulativeSummaryWrap">${renderCumulativeSummary()}</div>
      </div>

      ${rankLinkBlock}
    `;
  }

  function render(){
    if(!parsed) return;
    const dateFilter = document.getElementById('dateFilter');
    const selected = dateFilter.value;
    const filtered = (selected && selected!=='__all__') ? parsed.filter(m=>m.date===selected) : parsed;
    const a = analyze(filtered);
    const daily = aiAnalysisCache[selected] || findDailyAnalysis(a.dates);
    window.__currentDaily = daily;
    window.__currentTitle = document.getElementById('titleInput').value;
    window.__currentTitleDate = document.getElementById('titleDate').textContent;

    // 지금 보여주는 날짜에 맞춰 제목 옆 텍스트를 "(7월 09일 내용)" 식으로 갱신
    const titleDateEl = document.getElementById('titleDate');
    if(a.dates.length===1){
      const dm = a.dates[0].match(/(\d{1,2})월\s*(\d{1,2})일/);
      if(dm){
        const mo = dm[1].padStart(2,'0');
        const da = dm[2].padStart(2,'0');
        titleDateEl.textContent = `(${mo}월 ${da}일 내용)`;
      }
    }else if(a.dates.length>1){
      titleDateEl.textContent = `(${a.dates.length}일치 전체)`;
    }
    window.__currentTitleDate = titleDateEl.textContent;

    content.innerHTML = buildReportHtml(a, daily);
  }

  // 업로드 없이, 미리 분석/저장해둔 날짜를 바로 보여줌 (DAILY_ANALYSIS/DAILY_STATS 기반)
  function sortDateKeys(keys){
    return keys.map(d=>{
      const m = d.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
      return {key:d, sortKey: m ? `${m[1]}${m[2].padStart(2,'0')}${m[3].padStart(2,'0')}` : d};
    }).sort((a,b)=> a.sortKey.localeCompare(b.sortKey)).map(o=>o.key);
  }

  function getKnownDates(){
    const set = new Set([...Object.keys(DAILY_ANALYSIS), ...Object.keys(DAILY_STATS)]);
    return sortDateKeys(Array.from(set));
  }

  function renderSavedDate(dateKey){
    if(!dateKey) return;
    parsed = null;
    fileInput.value = '';
    aiBtn.disabled = true;
    const dateFilterEl = document.getElementById('dateFilter');
    dateFilterEl.style.display = 'none';
    dateFilterEl.innerHTML = '';

    const stats = DAILY_STATS[dateKey] || null;
    const daily = DAILY_ANALYSIS[dateKey] || null;
    const a = stats ? {
      total: stats.total,
      participantCount: stats.participantCount,
      dates: [dateKey],
      hourCounts: stats.hourCounts,
      hourTopSpeakers: stats.hourTopSpeakers,
      peakHour: stats.peakHour,
      ranking: stats.ranking,
      links: stats.links || [],
      mediaCount: stats.mediaCount || 0,
      deletedCount: stats.deletedCount || 0
    } : null;

    window.__currentDaily = daily;
    window.__currentTitle = document.getElementById('titleInput').value;
    const dm = dateKey.match(/(\d{1,2})월\s*(\d{1,2})일/);
    const titleDateEl = document.getElementById('titleDate');
    titleDateEl.textContent = dm ? `(${dm[0]} 내용)` : `(${dateKey})`;
    window.__currentTitleDate = titleDateEl.textContent;

    content.innerHTML = buildReportHtml(a, daily);
  }
  window.renderSavedDate = renderSavedDate;

  const savedDateSelect = document.getElementById('savedDateSelect');
  function populateSavedDateSelect(){
    const known = getKnownDates();
    if(known.length===0){ savedDateSelect.style.display='none'; return; }
    savedDateSelect.innerHTML = known.slice().reverse().map(d=>{
      const dm = d.match(/(\d{1,2})월\s*(\d{1,2})일/);
      const label = dm ? dm[0] : d;
      return `<option value="${escapeHtml(d)}">${escapeHtml(label)}${DAILY_STATS[d] ? ' 📊' : ''}</option>`;
    }).join('');
    savedDateSelect.style.display = 'inline-block';
  }
  savedDateSelect.addEventListener('change', ()=> renderSavedDate(savedDateSelect.value));

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(!confirm('지금 화면 내용을 지우고 새로 시작할까요? (업로드한 파일은 저장되는 게 아니라서, 다시 보려면 파일을 또 올려야 해요)')) return;
    parsed = null;
    fileInput.value = '';
    aiBtn.disabled = true;
    aiAnalysisCache = {};
    window.__currentDaily = null;
    window.__currentTitle = null;
    window.__currentTitleDate = null;
    const dateFilterEl = document.getElementById('dateFilter');
    dateFilterEl.style.display = 'none';
    dateFilterEl.innerHTML = '';
    document.getElementById('titleDate').textContent = '';
    content.innerHTML = `<div class="empty-state">
      카카오톡 채팅방에서 <b>"대화 내보내기(.txt)"</b>로 저장한 파일을 위에서 업로드해주세요.<br>
      업로드하면 통계와 발언 성향 분석(우호적/비방/그외)이 바로 정리돼요.
    </div>`;
  });

  function refreshDateFilterOptions(){
    const dateFilter = document.getElementById('dateFilter');
    if(!parsed) return;
    const uniqueDates = Array.from(new Set(parsed.map(m=>m.date).filter(Boolean)));
    const prevSelection = dateFilter.value;
    if(uniqueDates.length > 1){
      dateFilter.innerHTML = `<option value="__all__">전체 기간 (${uniqueDates.length}일)</option>` +
        uniqueDates.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}${(DAILY_ANALYSIS[d]||aiAnalysisCache[d])?' (분석완료)':''}</option>`).join('');
      dateFilter.style.display = 'inline-block';
      if(prevSelection && dateFilter.querySelector(`option[value="${CSS.escape(prevSelection)}"]`)) dateFilter.value = prevSelection;
    }else{
      dateFilter.innerHTML = '';
      dateFilter.style.display = 'none';
    }
  }

  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      parsed = parseKakaoTxt(ev.target.result);
      aiAnalysisCache = {};
      aiBtn.disabled = false;

      // 파일 안에 있는 날짜들을 모아서 필터 드롭다운을 채움 (여러 날짜가 섞인 파일이면 날짜별로 골라볼 수 있게)
      const dateFilter = document.getElementById('dateFilter');
      refreshDateFilterOptions();
      dateFilter.value = '__all__';

      render();
    };
    reader.readAsText(file, 'utf-8');
  });

  document.getElementById('dateFilter').addEventListener('change', render);

  function buildSummaryText(){
    const daily = window.__currentDaily;
    if(!daily) return null;
    const lines = [];
    lines.push(`■ ${window.__currentTitle || '단톡방 일일 보고'}`);
    lines.push('');
    lines.push('[중점 내용]');
    daily.keyPoints.forEach((kp,i)=> lines.push(`${i+1}. ${kp.title} - ${kp.summary}`));
    lines.push('');
    lines.push('[우호적 발언]');
    if(daily.favorable.length) daily.favorable.forEach(it=> lines.push(`- ${it.speaker}: ${it.quote}`));
    else lines.push('- 없음');
    lines.push('');
    lines.push('[비방 발언]');
    if(daily.critical.length) daily.critical.forEach(it=> lines.push(`- ${it.speaker}: ${it.quote}`));
    else lines.push('- 없음');
    lines.push('');
    lines.push('[그 외 발언]');
    if(daily.other.length) daily.other.forEach(it=> lines.push(`- ${it.speaker}: ${it.quote}`));
    else lines.push('- 없음');
    return lines.join('\n');
  }

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('copyBtn');
    const text = buildSummaryText();
    if(!text){
      btn.textContent = '분석 내용 없음';
      setTimeout(()=>{ btn.textContent = '📋 요약 복사'; }, 1500);
      return;
    }
    navigator.clipboard.writeText(text).then(()=>{
      btn.textContent = '✅ 복사됨';
      setTimeout(()=>{ btn.textContent = '📋 요약 복사'; }, 1500);
    }).catch(()=>{
      btn.textContent = '복사 실패';
      setTimeout(()=>{ btn.textContent = '📋 요약 복사'; }, 1500);
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('downloadBtn');
    const text = buildSummaryText();
    if(!text){
      btn.textContent = '분석 내용 없음';
      setTimeout(()=>{ btn.textContent = '⬇️ 요약 txt'; }, 1500);
      return;
    }
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateLabel = (window.__currentTitleDate || '').replace(/[^\d]/g,'') || 'summary';
    a.href = url;
    a.download = `단톡방_요약_${dateLabel}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  const AI_PROXY_URL = 'https://stately-sfogliatella-7ab674.netlify.app/.netlify/functions/proxy';

  aiBtn.addEventListener('click', async ()=>{
    if(!parsed){ alert('먼저 카카오톡 대화 파일을 업로드해주세요.'); return; }
    const dateFilter = document.getElementById('dateFilter');
    const selected = dateFilter.value;
    const filtered = (selected && selected!=='__all__') ? parsed.filter(m=>m.date===selected) : parsed;
    if(!filtered.length){ alert('분석할 메시지가 없어요.'); return; }

    const originalLabel = aiBtn.textContent;
    aiBtn.disabled = true;
    aiBtn.textContent = '🤖 AI 분석 중...';
    try{
      const res = await fetch(`${AI_PROXY_URL}?action=analyze-chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ messages: filtered }),
      });
      let data = null;
      try{ data = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((data && data.error) ? data.error : ('프록시 응답 오류 (' + res.status + ')'));
      if(data && data.error) throw new Error(data.error);

      const daily = {
        keyPoints: data.keyPoints || [],
        favorable: data.favorable || [],
        critical: data.critical || [],
        other: data.other || [],
      };
      aiAnalysisCache[selected] = daily; // 이 날짜/범위는 다시 눌러도 캐시에서 바로 보여줌 (재분석 전까진 재호출 안 함)
      refreshDateFilterOptions();
      const a = analyze(filtered);
      window.__currentDaily = daily;
      window.__currentTitle = document.getElementById('titleInput').value;
      window.__currentTitleDate = document.getElementById('titleDate').textContent;
      content.innerHTML = buildReportHtml(a, daily);
    }catch(e){
      console.error('AI 분석 실패', e);
      alert('AI 분석을 가져오지 못했어요: ' + (e && e.message ? e.message : e));
    }
    aiBtn.disabled = false;
    aiBtn.textContent = originalLabel;
  });

  // 페이지를 열자마자, 업로드 없이 지금까지 분석해둔 가장 최근 날짜를 바로 보여줌
  (function initSavedView(){
    populateSavedDateSelect();
    const known = getKnownDates();
    if(known.length){
      const latest = known[known.length-1];
      savedDateSelect.value = latest;
      renderSavedDate(latest);
    }
  })();
})();
</script>
</body>
</html>
