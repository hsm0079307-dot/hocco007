<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>통합 일정표 &amp; 날짜별 체크리스트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1c2430;--sub:#5b6470;--line:#e2e6ea;--bg:#f6f7f9;
    --gallery:#2f6f6b;--gallery-bg:#eaf4f2;
    --tour:#a8562f;--tour-bg:#faece3;
    --closed:#c94f4f;--closed-bg:#fbeceb;
    --card-bg:#fff;
  }
  body.dark-mode{
    --ink:#e8eaed;--sub:#9aa4b2;--line:#333c48;--bg:#14181f;
    --gallery-bg:#183330;--tour-bg:#3a2417;--closed-bg:#3a1f1f;
    --card-bg:#1c222c;
  }
  body.dark-mode header{background:#0c0f14;}
  body.dark-mode .cell,body.dark-mode .checklist-section,body.dark-mode .car,
  body.dark-mode .control-panel,body.dark-mode .summary-card,body.dark-mode .legend span,
  body.dark-mode .danjiToggleBar span,body.dark-mode .colFilterBtn,body.dark-mode .colFilterDropdown,
  body.dark-mode .toolbar button,body.dark-mode #formFields input,body.dark-mode #formFields textarea,
  body.dark-mode #formFields select,body.dark-mode th,body.dark-mode .managerFilterBar .resetBtn,
  body.dark-mode .modal,body.dark-mode #lockScreen input,body.dark-mode tr.scheduled td,
  body.dark-mode .chartWeekBar button,body.dark-mode .colFilterDropdown .df-actions button,
  body.dark-mode .control-row input[type=date]{
    background:var(--card-bg);color:var(--ink);border-color:var(--line);
  }
  body.dark-mode .dow{background:transparent;}
  body.dark-mode .modal-close-x{color:var(--ink);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 60px;transition:background .2s,color .2s;}
  .wrap{max-width:960px;margin:0 auto;}
  header{background:var(--ink);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header h1{margin:0 0 4px;font-size:19px;}
  header h1[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed transparent;padding-bottom:2px;}
  header h1[contenteditable]:hover{border-color:rgba(255,255,255,.4);}
  header h1[contenteditable]:focus{border-color:rgba(255,255,255,.6);}
  header p{margin:0;font-size:12.5px;color:#c7cdd6;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .toolbar button{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);}
  .bottom-toolbar{
    margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .bottom-menu-wrap{position:relative;margin-top:24px;}
  .bottom-menu-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
    padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .bottom-menu-dropdown{
    display:none;position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;
    min-width:180px;box-shadow:0 6px 20px rgba(0,0,0,.1);
  }
  .bottom-menu-dropdown.open{display:block;}
  .bottom-menu-dropdown button{
    display:block;width:100%;text-align:left;border:none;background:none;color:var(--ink);
    padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:6px;
  }
  .bottom-menu-dropdown button:hover{background:var(--bg);}
  #saveBtn:disabled{background:var(--gallery);color:#fff;}
  .danger-btn{color:var(--closed)!important;}
  body.dark-mode .bottom-menu-btn,body.dark-mode .bottom-menu-dropdown{background:var(--card-bg);border-color:var(--line);color:var(--ink);}
  body.dark-mode .bottom-menu-dropdown button:hover{background:var(--bg);}

  .dash-panel{
    display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin-bottom:16px;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;
  }
  body.dark-mode .dash-panel{background:var(--card-bg);}
  .dashboard-grid{display:flex;gap:6px;flex:0 0 auto;}
  .dash-search-input{
    flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:0 12px;
    font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .dash-search-btn{border:none;background:var(--ink);color:#fff;border-radius:8px;padding:0 16px;font-size:12px;font-weight:700;cursor:pointer;}
  body.dark-mode .dash-search-input{background:var(--card-bg);border-color:var(--line);}

  .manager-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}

  .bulk-check-btn{
    border:1px solid var(--gallery);background:var(--gallery-bg);color:var(--gallery);border-radius:7px;
    padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;margin-bottom:8px;
  }
  .dash-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:center;
    cursor:pointer;transition:box-shadow .2s;min-width:58px;display:flex;align-items:center;gap:6px;
  }
  .dash-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .dash-card .dash-num{font-size:14px;font-weight:800;color:var(--ink);}
  .dash-card .dash-label{font-size:9px;color:var(--sub);white-space:nowrap;}
  .dash-card.warn .dash-num{color:#c9821f;}
  .dash-card.alert .dash-num{color:var(--closed);}
  body.dark-mode .dash-card{background:var(--card-bg);border-color:var(--line);}

  .control-panel{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:16px;font-size:12.5px;
  }
  .control-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .control-row.center-row{justify-content:center;}
  .control-divider{height:1px;background:var(--line);margin:12px 0;}
  .control-row label{color:var(--sub);font-weight:600;}
  .control-row input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;}
  .control-row button{border:none;background:var(--ink);color:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .control-row .quick{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .control-row span.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:20px;cursor:pointer;user-select:none;}
  .control-row span.toggle:hover{border-color:var(--sub);}
  .control-row .danjiToggleBar{display:flex;gap:8px;flex-wrap:wrap;margin:0;}
  body.dark-mode .control-panel{background:var(--card-bg);}
  body.dark-mode .control-row span.toggle{background:var(--bg);}
  body.dark-mode .control-divider{background:var(--line);}

  .catbar{display:none;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px;font-size:12.5px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:20px;}
  .legend span.toggle{cursor:pointer;user-select:none;}
  .legend span.toggle:hover{border-color:var(--sub);}
  .cat-label-edit{outline:none;border-bottom:1px dashed transparent;cursor:text;}
  .cat-label-edit:empty::before{content:"이름 추가";color:var(--sub);opacity:.7;font-style:italic;}
  .toggle:has(.cat-label-edit:empty){border-style:dashed;background:transparent;}
  .cat-label-edit:hover{border-bottom-color:var(--line);}
  .cat-label-edit:focus{border-bottom-color:var(--sub);}
  #siteSubtitle[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed transparent;}
  #siteSubtitle[contenteditable]:hover{border-bottom-color:rgba(255,255,255,.4);}
  #siteSubtitle[contenteditable]:focus{border-bottom-color:rgba(255,255,255,.6);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#fff;border:1.5px solid var(--line);}
  .dot.gallery.lit{background:var(--gallery);border-color:var(--gallery);}
  .dot.tour.lit{background:var(--tour);border-color:var(--tour);}
  .dot.closed.lit{background:var(--closed);border-color:var(--closed);}

  .danjiToggleBar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-size:12.5px;}
  .danjiToggleBar span{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    padding:4px 10px;border-radius:20px;cursor:pointer;user-select:none;
  }
  .danjiToggleBar span:hover{border-color:var(--sub);}
  .add-danji-btn{border-style:dashed!important;color:var(--sub);}
  .add-danji-btn:hover{color:var(--ink);}
  .danjiToggleBar .dot.danji{background:#c7cdd6;border-color:#c7cdd6;}
  .danjiToggleBar .dot.danji.lit{background:#3b6fd6;border-color:#3b6fd6;}

  .month-label{font-size:13.5px;font-weight:700;margin:16px 0 6px 2px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:2px 0;}
  .dow.sun{color:var(--closed);}
  .cell{background:#fff;border:1px solid var(--line);border-radius:6px;height:44px;padding:3px 5px;position:relative;cursor:pointer;transition:box-shadow .15s;}
  .cell.cap-full{background:#fff7ec;border:2px solid #e08a2b;}
  .cap-ribbon{
    position:absolute;top:2px;right:2px;background:#e08a2b;color:#fff;
    font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.5px;
  }
  .cap-status{position:absolute;left:5px;bottom:3px;font-size:7.5px;font-weight:700;color:#c94f4f;}
  .cap-status.full{color:#c9821f;}
  .cell:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .cell.empty{background:transparent;border:none;cursor:default;}
  .cell.gclosed{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#fbeceb 8px,#fbeceb 16px);}
  .cell.active{outline:2px solid var(--ink);}
  .cell.today{border:2px solid #3b6fd6;background:#f3f7ff;}
  .cell.today .date{color:#3b6fd6;}
  .cell.today .date::after{content:" (오늘)";font-size:9px;font-weight:700;color:#3b6fd6;}
  .date{font-size:11px;font-weight:700;}
  .sun .date{color:var(--closed);}
  .badges{position:absolute;right:4px;bottom:3px;display:flex;gap:2px;}
  .b{width:13px;height:13px;border-radius:4px;font-size:7.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;}
  .b.gallery{background:var(--gallery);}
  .b.tour{background:var(--tour);}
  .b.closed{background:var(--closed);font-size:8px;}

  /* 체크리스트 섹션 */
  .checklist-section{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s;}

  .tab-nav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab-btn{
    flex:1;border:none;background:none;color:var(--sub);font-size:12.5px;font-weight:700;
    padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn.on{color:var(--ink);border-bottom-color:var(--ink);}
  .tab-btn:hover{color:var(--ink);}
  .checklist-section:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .checklist-section h2{margin:0 0 10px;font-size:16px;}
  .filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select{
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;
    background:#fff;color:var(--ink);min-width:180px;
  }
  .filterbar button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .closed-banner{background:var(--closed-bg);color:var(--closed);font-weight:700;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .empty-day{color:var(--sub);font-size:13px;padding:10px 0;}

  .sub-title{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:13.5px;font-weight:700;}
  .sub-title .tag{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:700;}
  .tag.gallery{background:var(--gallery-bg);color:var(--gallery);}
  .tag.tour{background:var(--tour-bg);color:var(--tour);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
  #checklistBody table{table-layout:fixed;}
  #checklistBody th:nth-child(1),#checklistBody td:nth-child(1){width:10%;} /* 시간 */
  #checklistBody th:nth-child(2),#checklistBody td:nth-child(2){width:13%;} /* 단지명 */
  #checklistBody th:nth-child(3),#checklistBody td:nth-child(3){width:12%;} /* 동호수 */
  #checklistBody th:nth-child(4),#checklistBody td:nth-child(4){width:20%;} /* 성함 */
  #checklistBody th:nth-child(5),#checklistBody td:nth-child(5){width:11%;} /* 동반 */
  #checklistBody th:nth-child(6),#checklistBody td:nth-child(6){width:11%;} /* 담당 */
  #checklistBody th:nth-child(7),#checklistBody td:nth-child(7){width:11%;} /* 픽업/자가 */
  #checklistBody th:nth-child(8),#checklistBody td:nth-child(8){width:5%;padding-left:2px;padding-right:2px;}  /* 확인 */
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  th{background:var(--bg);color:var(--sub);font-weight:700;font-size:11.5px;}
  td.name{font-weight:600;}
  .memo-name{cursor:pointer;border-bottom:1px dashed var(--sub);}
  .memo-name:hover{color:var(--gallery);}
  .memo-name.has-memo{border-bottom-color:var(--gallery);}
  .memo-dot{color:var(--gallery);font-size:7px;vertical-align:middle;}
  input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  tr.checked td{background:#f4fbf9;}
  tr.attended td{background:#eaf6f0;}
  tr.noshow td{background:#fdecea;}
  tr.scheduled td{background:#fff;}
  .status-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;}
  .status-pill.attended{background:#2f6f6b;color:#fff;}
  .status-pill.noshow{background:#c94f4f;color:#fff;}
  .status-pill.scheduled{background:#8a93a0;color:#fff;}

  .summary-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;max-width:360px;
  }
  .summary-card{
    flex:1;min-width:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;text-align:center;cursor:pointer;transition:box-shadow .15s;
  }
  .summary-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .summary-card .num{font-size:15px;font-weight:800;}
  .summary-card .label{font-size:10px;color:var(--sub);margin-top:1px;}
  .summary-card.attended .num{color:#2f6f6b;}
  .summary-card.noshow .num{color:#c94f4f;}
  .summary-card.scheduled .num{color:#5b6470;}

  #statusBody{max-height:60vh;overflow-y:auto;}
  #statusBody .row-line{cursor:pointer;padding:8px 2px;}
  #statusBody .row-line:hover{background:var(--bg);border-radius:6px;}

  #logBody{max-height:60vh;overflow-y:auto;font-size:12.5px;}
  .log-entry{padding:8px 0;border-bottom:1px solid var(--line);}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .log-time{color:var(--sub);font-size:10.5px;display:block;margin-bottom:2px;}

  #shareBody{text-align:center;}
  #shareBody img{width:160px;height:160px;margin:10px auto;display:block;border:1px solid var(--line);border-radius:8px;}
  #shareBody .share-url{
    font-size:11.5px;color:var(--sub);word-break:break-all;background:var(--bg);
    border-radius:8px;padding:8px 10px;margin:10px 0;
  }
  #shareBody button{
    width:100%;border:none;background:var(--ink);color:#fff;border-radius:8px;
    padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;
  }

  .manager-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;table-layout:fixed;}
  .manager-table th,.manager-table td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  .manager-table th{background:var(--bg);color:var(--sub);font-weight:700;font-size:11.5px;}
  .manager-table th:nth-child(1),.manager-table td:nth-child(1){width:34px;}
  .manager-table th:nth-child(2),.manager-table td:nth-child(2),
  .manager-table th:nth-child(3),.manager-table td:nth-child(3){width:90px;}
  .manager-table td.mname{font-weight:700;text-align:center;}
  .manager-table td.mdanji{text-align:center;}
  .manager-table td.m-attended{color:#2f6f6b;font-weight:700;}
  .manager-table td.m-noshow{color:#c94f4f;font-weight:700;}
  .manager-table td.m-scheduled{color:#5b6470;font-weight:700;}
  .manager-table td.clickable-count{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
  .manager-table td.clickable-count:hover{background:var(--bg);}

  .chartWeekBar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
  .chartWeekBar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--ink);}
  .chartWeekBar span{font-size:12px;font-weight:700;color:var(--ink);min-width:44px;text-align:center;}

  .chart-bars{display:flex;align-items:flex-end;gap:6px;height:56px;padding:4px 4px 0;border-bottom:1px solid var(--line);max-width:320px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:4px;}
  .chart-col:hover{background:var(--bg);}
  .chart-bar-wrap{flex:1;display:flex;align-items:flex-end;}
  .chart-bar{width:55%;min-width:10px;background:linear-gradient(180deg,var(--gallery),#4a938e);border-radius:3px 3px 0 0;}
  .chart-label{font-size:9.5px;color:var(--sub);margin-top:2px;font-weight:700;}
  .chart-count{font-size:9px;color:var(--ink);font-weight:700;}

  .managerFilterBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .colFilter{position:relative;}
  .colFilterBtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .colFilterBtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .colFilterDropdown{
    display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:20;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    min-width:160px;max-height:220px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.1);
  }
  .colFilterDropdown.open{display:block;}
  .colFilterDropdown label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 2px;cursor:pointer;white-space:nowrap;}
  .colFilterDropdown input[type=checkbox]{width:14px;height:14px;}
  .colFilterDropdown .df-actions{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .colFilterDropdown .df-actions button{
    flex:1;border:none;background:var(--bg);border-radius:6px;padding:4px 0;font-size:11px;cursor:pointer;color:var(--ink);
  }
  .managerFilterBar .resetBtn{
    border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--sub);
  }

  @media print{
    header, .control-panel, .catbar, .danjiToggleBar, .legend, .month-label, .grid, .filterbar, #addStaffBtn, .modal-actions, .overlay, .tab-nav, .bottom-menu-wrap{display:none !important;}
    body{background:#fff;padding:0;}
    .checklist-section, .car{border:none;box-shadow:none;padding:0;margin-top:10px;}
    .summary-bar{margin-bottom:10px;}
    body.printing-all #checklistBody{display:none !important;}
    body.printing-all #printAllContainer{display:block !important;}
  }
  #printAllContainer{display:none;}
  .print-date-block{margin-bottom:18px;}
  @media print{
    .print-date-block{page-break-after:always;}
    .print-date-block:last-child{page-break-after:auto;}
  }
  .print-date-title{font-size:14px;font-weight:800;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--ink);}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  @media (max-width:480px){
    body{padding:12px 8px 40px;}
    header{flex-direction:column;align-items:flex-start;padding:14px 16px;}
    header h1{font-size:16px;}
    .toolbar{width:100%;}
    .toolbar button{flex:1;font-size:11px;padding:7px 6px;}
    .control-panel{padding:10px 10px;}

<script>
const DEFAULT_PASSWORD = "0134";
const PW_STORAGE_KEY = "calendar_password_v1";
function getPassword(){
  return localStorage.getItem(PW_STORAGE_KEY) || DEFAULT_PASSWORD;
}
function checkPassword(){
  const val = document.getElementById("pwInput").value;
  if(val === getPassword()){
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "block";
  } else {
    document.getElementById("pwErr").textContent = "비밀번호가 올바르지 않습니다";
  }
}
document.getElementById("pwInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") checkPassword();
});

// 강서사업소 스크린(대시보드)의 "🖼 투어 예약" 버튼으로 들어온 경우엔 비밀번호 화면을 건너뛴다.
// (대시보드 쪽에서 같은 토큰을 붙여서 링크를 열어줌 — index.html의 GALLERY_ENTRY_TOKEN과 반드시 같아야 함)
const DASHBOARD_ENTRY_TOKEN = 'gs-dash-2026';
// 대시보드에서 게스트로 넘어온 경우엔 예약 추가/수정/삭제를 막고 조회만 되게 한다.
let CAL_READONLY_MODE = false;
(function tryDashboardAutoUnlock(){
  try{
    const p = new URLSearchParams(window.location.search);
    if(p.get('entry') === DASHBOARD_ENTRY_TOKEN){
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("appRoot").style.display = "block";
    }
    if(p.get('mode') === 'guest') CAL_READONLY_MODE = true;
  }catch(e){}
})();
function blockIfReadonly(){
  if(!CAL_READONLY_MODE) return false;
  alert('게스트는 조회만 가능해요. 예약 추가/수정/삭제는 관리자로 들어와야 해요.');
  return true;
}
window.addEventListener('DOMContentLoaded', ()=>{
  if(!CAL_READONLY_MODE) return;
  const banner = document.createElement('div');
  banner.textContent = '👁 읽기 전용 모드 (게스트) — 예약 추가/수정/삭제 불가';
  banner.style.cssText = 'position:sticky;top:0;z-index:900;background:#8a5a00;color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:7px 10px;';
  document.body.insertBefore(banner, document.body.firstChild);
});

const STORAGE_CHECK = "calendar_checkmarks_v1";

// ---- 카테고리 명칭(갤러리/21차투어) 편집 가능 ----
const CAT_LABEL_KEY = "category_labels_v1";
let CAT_LABEL = {gallery:"", tour:""};
try{
  const savedCat = JSON.parse(localStorage.getItem(CAT_LABEL_KEY));
  if(savedCat) CAT_LABEL = {...CAT_LABEL, ...savedCat};
}catch(e){}
function persistCatLabel(){ localStorage.setItem(CAT_LABEL_KEY, JSON.stringify(CAT_LABEL)); }

// ---- 날짜 목록 (요일 포함) ----
const ALL_DATES = [
  ["7-20","7월 20일(월)"],["7-21","7월 21일(화)"],["7-22","7월 22일(수)"],["7-23","7월 23일(목)"],
  ["7-24","7월 24일(금)"],["7-25","7월 25일(토)"],["7-26","7월 26일(일)"],
  ["7-27","7월 27일(월)"],["7-28","7월 28일(화)"],["7-29","7월 29일(수)"],["7-30","7월 30일(목)"],
  ["7-31","7월 31일(금)"],["8-1","8월 1일(토)"],["8-2","8월 2일(일)"],["8-3","8월 3일(월)"],
  ["8-4","8월 4일(화)"],["8-5","8월 5일(수)"],["8-6","8월 6일(목)"],["8-7","8월 7일(금)"],
  ["8-8","8월 8일(토)"],["8-9","8월 9일(일)"],["8-10","8월 10일(월)"],["8-11","8월 11일(화)"],
  ["8-12","8월 12일(수)"],["8-13","8월 13일(목)"],["8-14","8월 14일(금)"],["8-15","8월 15일(토)"],
  ["8-16","8월 16일(일)"]
];
const CAPACITY_WEEKDAY_KEY = "capacity_weekday_v1"; // 평일 정원 키
const CAPACITY_WEEKEND_KEY = "capacity_weekend_v1"; // 주말 정원 키
const CAPACITY_DATE_KEY = "capacity_date_override_v1"; // 날짜별 정원 개별 지정 키
let dateCapacityOverrides = {};
try{ dateCapacityOverrides = JSON.parse(localStorage.getItem(CAPACITY_DATE_KEY)) || {}; }catch(e){ dateCapacityOverrides = {}; }
function persistDateCapacity(){ localStorage.setItem(CAPACITY_DATE_KEY, JSON.stringify(dateCapacityOverrides)); }
let WEEKS = [];
let currentChartWeek = 0;
function rebuildWeeks(){
  const keys = getActiveDateKeys();
  const weekMap = new Map(); // mondayTimestamp -> true
  keys.forEach(k=>{
    const d = parseKeyDate(k);
    const dow = mondayIndex(d.getDay());
    const monday = new Date(d);
    monday.setDate(d.getDate()-dow);
    monday.setHours(0,0,0,0);
    weekMap.set(monday.getTime(), true);
  });
  const weekStarts = [...weekMap.keys()].sort((a,b)=>a-b);
  WEEKS = weekStarts.map(ts=>{
    const monday = new Date(ts);
    const days = [];
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      const key = (d.getMonth()+1)+"-"+d.getDate();
      days.push([key, labelFor(key)]);
    }
    return days;
  });
  if(currentChartWeek >= WEEKS.length) currentChartWeek = Math.max(0, WEEKS.length-1);
}

const SCHEDULE_DATA_KEY = "manual_schedule_data_v1";
let GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED, TOUR_CLOSED;
function loadScheduleData(){
  try{
    const raw = localStorage.getItem(SCHEDULE_DATA_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      GALLERY_ROWS = parsed.GALLERY_ROWS || {};
      TOUR_ROWS = parsed.TOUR_ROWS || {};
      GALLERY_CLOSED = parsed.GALLERY_CLOSED || {};
      TOUR_CLOSED = parsed.TOUR_CLOSED || {};
      return;
    }
  }catch(e){}
  // 새 설치/새 현장은 완전히 빈 상태로 시작 (샘플 데이터 자동 주입 안 함)
  GALLERY_ROWS = {};
  TOUR_ROWS = {};
  GALLERY_CLOSED = {};
  TOUR_CLOSED = {};
}
function persistScheduleData(){
  localStorage.setItem(SCHEDULE_DATA_KEY, JSON.stringify({GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED, TOUR_CLOSED}));
}

// ---------- 강서사업소 스크린(접촉 리포트) 연동 ----------
// 같은 Firebase 프로젝트를 공유해서: (1) 이 캘린더의 예약 데이터를 클라우드에도 올려 기기 간에 보이게 하고
// (2) 예약이 잡히면 해당 현장의 접촉 리포트에 자동으로 방문 기록을 남긴다.
const CAL_FIREBASE_DB_URL = 'https://add-project-74efc-default-rtdb.asia-southeast1.firebasedatabase.app';
const CAL_FIREBASE_DATA_URL = CAL_FIREBASE_DB_URL + '/data.json';
const CAL_FIREBASE_DB_SECRET = 'kYHJbpUE7jEVdLu69ZVMY3DGf4DBYeaA4JGZiS4B';
const CAL_FIREBASE_WRITE_URL = CAL_FIREBASE_DATA_URL + '?auth=' + encodeURIComponent(CAL_FIREBASE_DB_SECRET);
const CAL_DEFAULT_OFFICE = '강서사업소'; // 현장 목록에서 못 찾을 때 기본으로 찾아볼 사업소

let cachedOfficesData = {}; // 대시보드의 현장 목록 (사업소별)
let siteOptionsList = [];   // [{name, office}] - 단지명 드롭다운용, 대시보드 현장 목록에서 그대로 가져옴

function rebuildSiteOptions(){
  siteOptionsList = [];
  Object.keys(cachedOfficesData).forEach(off=>{
    (cachedOfficesData[off]||[]).forEach(s=>{
      if(s && s.name) siteOptionsList.push({name: s.name, office: off});
    });
  });
}

function officeForSiteName(name){
  const found = siteOptionsList.find(s=>s.name===name);
  return found ? found.office : CAL_DEFAULT_OFFICE;
}

// "단지명" 입력칸: 현장 목록을 불러왔으면 드롭다운으로, 아직 못 불러왔으면(오프라인 등) 기존처럼 직접입력으로 대체
function danjiSelectField(currentValue, defaultValue){
  if(!siteOptionsList.length){
    return {id:"danji", label:"단지명", value: currentValue||defaultValue||"", placeholder:"예: 화랑아파트"};
  }
  const names = siteOptionsList.map(s=>s.name);
  const val = (currentValue && names.includes(currentValue)) ? currentValue
    : (defaultValue && names.includes(defaultValue)) ? defaultValue
    : names[0];
  return {id:"danji", label:"단지명", type:"select", value: val, options: siteOptionsList.map(s=>({value:s.name, label:s.name}))};
}

// M-D 형식(연도 없음) 예약 날짜 키를 접촉리포트가 쓰는 YYYY-MM-DD로 변환
function bookingKeyToISODate(key){
  const parts = String(key).split('-').map(Number);
  const m = parts[0], d = parts[1];
  const y = new Date().getFullYear();
  if(!m || !d) return new Date().toISOString().slice(0,10);
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}

// 예약 1건을 접촉리포트 현장 로그로 밀어넣고, 이 캘린더의 예약 데이터 전체도 클라우드에 올린다.
// 실패해도(오프라인 등) 이 캘린더 자체 저장(localStorage)은 이미 끝난 뒤라 예약 자체는 안전하다.
async function syncBookingToDashboard(kind, key, v){
  try{
    const res = await fetch(CAL_FIREBASE_DATA_URL + '?_=' + Date.now(), {cache:'no-store'});
    const fresh = res.ok ? await res.json() : {};
    const offices = Object.assign({}, (fresh && fresh.offices && typeof fresh.offices==='object') ? fresh.offices : cachedOfficesData);
    const siteName = v.danji;
    if(siteName){
      const office = officeForSiteName(siteName);
      if(Array.isArray(offices[office])){
        const idx = offices[office].findIndex(s=>s && s.name===siteName);
        if(idx > -1){
          const site = Object.assign({}, offices[office][idx]);
          const logs = Array.isArray(site.logs) ? site.logs.slice() : [];
          const noteBits = [];
          if(v.time) noteBits.push(v.time);
          if(v.plus && v.plus!=='-') noteBits.push('동반: '+v.plus);
          if(v.spot && v.spot!=='-') noteBits.push(v.spot);
          logs.push({
            id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2,8),
            date: bookingKeyToISODate(key),
            author: v.manager || '',
            contactName: v.name || '',
            owner: '',
            unit: v.ho || '',
            contactMethod: kind==='gallery' ? '갤러리 투어' : '현장 투어',
            executiveStance: '',
            closeness: '',
            text: (kind==='gallery' ? '갤러리' : '현장') + ' 투어 예약' + (noteBits.length ? ' - ' + noteBits.join(' · ') : '')
          });
          site.logs = logs;
          const arr = offices[office].slice();
          arr[idx] = site;
          offices[office] = arr;
        }
      }
    }
    const galleryBookings = {GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED, TOUR_CLOSED};
    const body = Object.assign({}, fresh, {offices, galleryBookings});
    await fetch(CAL_FIREBASE_WRITE_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    cachedOfficesData = offices;
    rebuildSiteOptions();
  }catch(e){
    console.error('접촉리포트 연동 실패(오프라인일 수 있음). 이 예약은 이 기기에는 저장되어 있습니다.', e);
  }
}
// 삭제/휴관 지정처럼 접촉리포트에 로그를 새로 남길 필요는 없고 예약 목록 자체만 클라우드에 반영하면 되는 경우용.

// 페이지를 열 때 클라우드의 현장 목록(단지명 드롭다운용)과, 이 캘린더의 최신 예약 데이터를 받아온다.
async function loadDashboardLinkOnStartup(){
  try{
    const res = await fetch(CAL_FIREBASE_DATA_URL + '?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data && data.offices && typeof data.offices==='object'){
      cachedOfficesData = data.offices;
      rebuildSiteOptions();
    }
    if(data && data.galleryBookings && typeof data.galleryBookings==='object'){
      const gb = data.galleryBookings;
      if(gb.GALLERY_ROWS) GALLERY_ROWS = gb.GALLERY_ROWS;
      if(gb.TOUR_ROWS) TOUR_ROWS = gb.TOUR_ROWS;
      if(gb.GALLERY_CLOSED) GALLERY_CLOSED = gb.GALLERY_CLOSED;
      if(gb.TOUR_CLOSED) TOUR_CLOSED = gb.TOUR_CLOSED;
      persistScheduleData();
      onScheduleDataChanged();
    }
  }catch(e){
    console.error('클라우드 예약 데이터 불러오기 실패, 이 기기에 저장된 내용으로 진행합니다', e);
  }
}
loadDashboardLinkOnStartup();

// 주소창에 ?site=현장명&office=사업소 가 붙어서 들어오면(대시보드의 "🖼 투어 예약" 버튼으로 들어온 경우)
// 그 현장을 갤러리 방문 기본 단지명으로 미리 채워둔다. (실제 적용은 GALLERY_DANJI 선언 이후 아래쪽에서 처리)
const DATA = {}; // 캘린더 배지 표시용
function rebuildDATA(){
  Object.keys(DATA).forEach(k=>delete DATA[k]);
  function computeEntry(k){
    const g = GALLERY_ROWS[k] || GALLERY_CLOSED[k];
    const t = TOUR_ROWS[k] || TOUR_CLOSED[k];
    if(g || t){
      DATA[k] = {
        gallery: !!g, tour: !!t,
        galleryClosed: !!GALLERY_CLOSED[k], tourClosed: !!TOUR_CLOSED[k],
        closed: !!GALLERY_CLOSED[k] // 하위호환용
      };
    }
  }
  new Set([...Object.keys(GALLERY_ROWS), ...Object.keys(TOUR_ROWS), ...Object.keys(GALLERY_CLOSED), ...Object.keys(TOUR_CLOSED)]).forEach(k=>computeEntry(k));
}
rebuildDATA();

// ---- PDF 내보내기 (현재 필터된 날짜) ----
function pdfExportCurrentDate(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const key = currentDateKey;
  let y = 18;
  doc.setFontSize(14);
  doc.text(labelFor(key), 14, y); y += 10;

  function addSection(kind, rows, catLabel){
    if(!rows || rows.length===0) return;
    doc.setFontSize(11);
    doc.text(catLabel, 14, y); y += 7;
    doc.setFontSize(9);
    rows.forEach((raw,idx)=>{
      const r = reorderRow(kind, raw);
      const line = r.join(" / ");
      const lines = doc.splitTextToSize(line, 180);
      lines.forEach(l=>{
        if(y > 280){ doc.addPage(); y = 18; }
        doc.text(l, 16, y); y += 6;
      });
    });
    y += 4;
  }
  addSection("gallery", GALLERY_ROWS[key], CAT_LABEL.gallery);
  addSection("tour", TOUR_ROWS[key], CAT_LABEL.tour);

  if(y===28){
    doc.setFontSize(10);
    doc.text("등록된 일정이 없습니다.", 14, y);
  }
  doc.save((document.getElementById("siteTitle").textContent||"일정표")+"_"+key+".pdf");
}

// ---- 대시보드 요약 ----
function buildDashboard(){
  const todayKey = todayKeyStr();
  let todayCount = 0;
  todayCount = (GALLERY_ROWS[todayKey]||[]).length + (TOUR_ROWS[todayKey]||[]).length;

  let uncheckedPast = 0;
  const now = new Date(); now.setHours(0,0,0,0);
  Object.keys(GALLERY_ROWS).forEach(key=>{
    if(parseKeyDate(key) < now){
      GALLERY_ROWS[key].forEach((r,idx)=>{ if(!checkState["gallery_"+key+"_"+idx]) uncheckedPast++; });
    }
  });
  Object.keys(TOUR_ROWS).forEach(key=>{
    if(parseKeyDate(key) < now){
      TOUR_ROWS[key].forEach((r,idx)=>{ if(!checkState["tour_"+key+"_"+idx]) uncheckedPast++; });
    }
  });

  let nearFullCount = 0;
  getActiveDateKeys().forEach(key=>{
    const cap = getCapacityForKey(key);
    if(cap>0){
      const hc = computeDateHeadcount(key);
      if(hc >= cap*0.8) nearFullCount++;
    }
  });

  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowKey = (tomorrow.getMonth()+1)+"-"+tomorrow.getDate();
  const tomorrowCount = (GALLERY_ROWS[tomorrowKey]||[]).length + (TOUR_ROWS[tomorrowKey]||[]).length;

  const html =
    "<div class='dashboard-grid'>"+
    "<div class='dash-card' onclick=\"openPreview('"+todayKey+"')\"><div class='dash-num'>"+todayCount+"</div><div class='dash-label'>오늘</div></div>"+
    "<div class='dash-card"+(uncheckedPast>0?" alert":"")+"' onclick=\"openStatusPreview('noshow')\"><div class='dash-num'>"+uncheckedPast+"</div><div class='dash-label'>미확인</div></div>"+
    "<div class='dash-card"+(nearFullCount>0?" warn":"")+"' onclick=\"openNearFullPreview()\"><div class='dash-num'>"+nearFullCount+"</div><div class='dash-label'>마감임박</div></div>"+
    "<div class='dash-card"+(tomorrowCount>0?" warn":"")+"' onclick=\"openPreview('"+tomorrowKey+"')\"><div class='dash-num'>"+tomorrowCount+"</div><div class='dash-label'>내일</div></div>"+
    "</div>";
  document.getElementById("dashboardCard").innerHTML = html;
}

// ---- 이름으로 전체 검색 ----
function runGlobalSearch(){
  const q = document.getElementById("globalSearchInput").value.trim();
  if(!q) return;
  const results = [];
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((r,idx)=>{
      if((r[3] && r[3].includes(q)) || (r[5] && r[5].includes(q))) results.push({key, kind:"gallery", idx, name:r[3], time:r[0], manager:r[5]});
    });
  });
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((r,idx)=>{
      if((r[3] && r[3].includes(q)) || (r[5] && r[5].includes(q))) results.push({key, kind:"tour", idx, name:r[3], time:r[0], manager:r[5]});
    });
  });
  results.sort((a,b)=>parseKeyDate(a.key)-parseKeyDate(b.key));

  document.getElementById("statusTitle").textContent = "'"+q+"' 검색 결과 ("+results.length+"건)";
  let html = "";
  if(results.length===0){
    html = "<div class='empty-msg'>일치하는 일정이 없습니다.</div>";
  } else {
    results.forEach(r=>{
      const tagClass = r.kind==="gallery" ? "gallery" : "tour";
      const tagLabel = r.kind==="gallery" ? CAT_LABEL.gallery : CAT_LABEL.tour;
      html += "<div class='row-line' onclick=\"closeStatusOverlay();openPreview('"+r.key+"')\">"+
        "<span><span class='tag "+tagClass+"' style='margin-right:6px;'>"+tagLabel+"</span>"+
        labelFor(r.key)+" · "+r.time+" · "+r.name+" ("+r.manager+")</span></div>";
    });
  }
  document.getElementById("statusBody").innerHTML = html;
  document.getElementById("statusOverlay").classList.add("on");
}

  if(inp) inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") runGlobalSearch(); });
});

// ---- 담당자별 색상 라벨 ----
const MANAGER_COLOR_PALETTE = ["#2f6f6b","#a8562f","#4a5fc1","#c1519b","#5a9e3e","#c98a1f","#6b5fc1","#3e9e8f","#c15a5a","#5f8fc1"];
function managerColor(name){
  if(!name) return "#999";
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) & 0xffffffff; }
  const idx = Math.abs(hash) % MANAGER_COLOR_PALETTE.length;
  return MANAGER_COLOR_PALETTE[idx];
}

function pad(n){return n<10 ? "0"+n : ""+n;}
function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mondayIndex(jsDay){return (jsDay+6)%7;}

const RANGE_KEY = "calendar_range_v1";
const defaultRange = {start:"2026-07-20", end:"2026-08-16"};
function loadRange(){
  try{
    const raw = localStorage.getItem(RANGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {...defaultRange};
}
function persistRange(){ localStorage.setItem(RANGE_KEY, JSON.stringify(range)); }
let range = loadRange();

function buildCalendarArea(){
  const area = document.getElementById("calendarArea");
  area.innerHTML = "";
  const start = new Date(range.start+"T00:00:00");
  const end = new Date(range.end+"T00:00:00");
  if(isNaN(start) || isNaN(end) || start>end){
    area.innerHTML = "<div class='empty-day'>날짜 범위를 올바르게 지정해주세요.</div>";
    return;
  }
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const lastMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  const dowNames = ["월","화","수","목","금","토","일"];

  while(cursor <= lastMonth){
    const y = cursor.getFullYear();
    const m = cursor.getMonth()+1;
    const daysInMonth = new Date(y, m, 0).getDate();
    const monthStartD = (y===start.getFullYear() && m===(start.getMonth()+1)) ? start.getDate() : 1;
    const monthEndD = (y===end.getFullYear() && m===(end.getMonth()+1)) ? end.getDate() : daysInMonth;

    const label = document.createElement("div");
    label.className = "month-label";
    label.textContent = y+"년 "+m+"월";
    area.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "grid";
    area.appendChild(grid);

    dowNames.forEach((d,i)=>{
      const el = document.createElement("div");
      el.className = "dow" + (i===6?" sun":"");
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstJsDay = new Date(y, m-1, monthStartD).getDay();
    const leadBlanks = mondayIndex(firstJsDay);
    for(let i=0;i<leadBlanks;i++){
      const el = document.createElement("div");
      el.className = "cell empty";
      grid.appendChild(el);
    }

    const today = new Date(); today.setHours(0,0,0,0);
    for(let d=monthStartD; d<=monthEndD; d++){
      const key = m+"-"+d;
      const dowIndex = mondayIndex(new Date(y, m-1, d).getDay());
      const el = document.createElement("div");
      el.className = "cell" + (dowIndex===6?" sun":"");
      el.id = "cal-"+key;
      const info = DATA[key];
      const hasGalleryRows = !!GALLERY_ROWS[key];
      const hasTourRows = !!TOUR_ROWS[key];
      const showGalleryClosed = info && info.galleryClosed && activeCategories.gallery && galleryMatchesDanjiFilter(key) && showClosedToggle;
      const showTourClosed = info && info.tourClosed && activeCategories.tour && tourMatchesDanjiFilter(key) && showClosedToggle;
      if(showGalleryClosed || showTourClosed) el.className += " gclosed";
      const cellDate = new Date(y, m-1, d);
      if(cellDate.getTime()===today.getTime()) el.className += " today";
      el.innerHTML = "<div class='date'>"+d+"</div>";
      const badges = document.createElement("div");
      badges.className = "badges";
      if(info){
        if(showGalleryClosed){
          badges.innerHTML += "<div class='b closed' title='"+CAT_LABEL.gallery+" · "+(GALLERY_CLOSED[key]||"").replace(/'/g,"&#39;")+"'>휴</div>";
        } else if(hasGalleryRows && activeCategories.gallery && galleryMatchesDanjiFilter(key)){
          badges.innerHTML += "<div class='b gallery'>갤</div>";
        }
        if(showTourClosed){
          badges.innerHTML += "<div class='b closed' title='"+CAT_LABEL.tour+" · "+(TOUR_CLOSED[key]||"").replace(/'/g,"&#39;")+"'>휴</div>";
        } else if(hasTourRows && activeCategories.tour && tourMatchesDanjiFilter(key)){
          badges.innerHTML += "<div class='b tour'>투</div>";
        }
      }
      el.appendChild(badges);

      const capacity = getCapacityForKey(key);
      if(capacity>0 && info && !showGalleryClosed){
        const headcount = computeDateHeadcount(key);
        if(headcount>0){
          const capEl = document.createElement("div");
          if(headcount>=capacity){
            capEl.className = "cap-status full";
            capEl.textContent = "마감";
            el.className += " cap-full";
          } else {
            capEl.className = "cap-status";
            capEl.textContent = (capacity-headcount)+"명 남음";
          }
          el.appendChild(capEl);
        }
      }

      el.onclick = ()=>openPreview(key);
      grid.appendChild(el);
    }
    cursor = new Date(y, m, 1);
  }
}

const GALLERY_DANJI_KEY = "gallery_danji_name_v1";
let GALLERY_DANJI = localStorage.getItem(GALLERY_DANJI_KEY) || "";
function persistGalleryDanji(){ localStorage.setItem(GALLERY_DANJI_KEY, GALLERY_DANJI); }
(function applyIncomingSiteParam(){
  try{
    const p = new URLSearchParams(window.location.search);
    const siteParam = p.get('site');
    if(siteParam){ GALLERY_DANJI = siteParam; persistGalleryDanji(); }
  }catch(e){}
})();
function reorderRow(kind, r){
  if(kind==="gallery" && r.length<=5){
    // 구버전 5필드 형식(하위호환): [시간, 자가/픽업, 성함, 동반, 담당]
    const [time, spot, name, plus, manager] = r;
    return [time, GALLERY_DANJI, "-", name, plus, manager, spot];
  }
  // 통합 형식: [시간, 단지명, 동호수, 성함, 동반, 담당, 픽업/자가?]
  const [time, danji, ho, name, plus, manager, spot] = r;
  return [time, danji||GALLERY_DANJI, ho||"-", name, plus, manager, spot || "-"];
}

// 오늘 날짜 기준으로 해당 날짜가 지났는지 판단 (연도는 2026 가정)
function parseKeyDate(key){
  const [m,d] = key.split("-").map(Number);
  return new Date(2026, m-1, d);
}
function isPast(key){
  const today = new Date();
  today.setHours(0,0,0,0);
  return parseKeyDate(key) < today;
}
function isToday(key){
  const today = new Date();
  today.setHours(0,0,0,0);
  return parseKeyDate(key).getTime() === today.getTime();
}

function rowStatus(kind, key, idx){
  const rowKey = kind+"_"+key+"_"+idx;
  const checked = !!checkState[rowKey];
  if(checked) return "attended";
  if(isPast(key)) return "noshow";
  return "scheduled";
}

let activeCategories = {gallery:true, tour:true};
function toggleCategory(kind){
  activeCategories[kind] = !activeCategories[kind];
  const dotId = kind==="gallery" ? "dotGallery" : "dotTour";
  document.getElementById(dotId).classList.toggle("lit", activeCategories[kind]);
  buildCalendarArea();

  if(oldName===GALLERY_DANJI){

  let changed = false;
  Object.keys(TOUR_ROWS).forEach(key=>{

    });

    GALLERY_ROWS[key].forEach(r=>{

  });

    extraDanjiNames = extraDanjiNames.map(n=>n===oldName?newName:n);
    persistExtraDanji();

  if(changed) persistScheduleData();
  if(activeDanjiFilter.has(oldName)){

let selectedDanji = new Set();   // 비어있으면 전체 표시

function computeManagerTally(){
  const tally = {};
  function bump(manager, status, danji){
    if(!manager) return;
    if(!tally[manager]) tally[manager] = {attended:0, noshow:0, scheduled:0, danji:new Set()};
    tally[manager][status]++;
    if(danji) tally[manager].danji.add(danji);
  }
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((r, idx)=>{
      const manager = r[5];
      const danji = r[1] || GALLERY_DANJI;
      const status = rowStatus("gallery", key, idx);
      bump(manager, status, danji);
    });
  });
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((r, idx)=>{
      const manager = r[5];
      const danji = r[1];
      const status = rowStatus("tour", key, idx);
      bump(manager, status, danji);
    });
  });
  return tally;
}

function danjiSortKey(danjiLabel){
  // 화랑아파트가 항상 먼저, 그 다음 단지 숫자 오름차순
  const first = (danjiLabel||"").split("/")[0];
  if(first.includes("화랑")) return -1;
  const m = first.match(/(\d+)/);
  return m ? parseInt(m[1],10) : 999;
}

// "김진숙·오지현" 같은 공동담당은 마지막 이름 기준으로 정렬 (해당 개인 담당자 바로 아래에 위치)
function managerSortName(name){
  const parts = name.split(/[·,]/).map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts[parts.length-1] : name;
}

function updateManagerTable(){
  const tally = computeManagerTally();
  const names = Object.keys(tally).sort((a,b)=>{
    const da = [...tally[a].danji].join("/");
    const db = [...tally[b].danji].join("/");
    const ka = danjiSortKey(da), kb = danjiSortKey(db);
    if(ka!==kb) return ka-kb;
    const sa = managerSortName(a), sb = managerSortName(b);
    if(sa!==sb) return sa.localeCompare(sb, "ko");
    const aCombined = a !== sa;
    const bCombined = b !== sb;
    if(aCombined !== bCombined) return aCombined ? 1 : -1; // 공동담당은 개인 담당자 다음
    return a.localeCompare(b, "ko");
  });

  let html = "<table class='manager-table'><thead><tr><th>No</th><th>단지명</th><th>담당자</th><th>참석</th><th>예정</th><th>불참</th><th>합계</th></tr></thead><tbody>";
  let rowNum = 0;
  names.forEach(name=>{
    const t = tally[name];
    const danjiLabel = [...t.danji].join("/");
    if(selectedManagers.size>0 && !selectedManagers.has(name)) return;
    if(selectedDanji.size>0 && ![...t.danji].some(d=>selectedDanji.has(d))) return;
    rowNum++;
    const total = t.attended + t.noshow + t.scheduled;
    const nameEsc = name.replace(/'/g,"&#39;");
    html += "<tr><td>"+rowNum+"</td><td class='mdanji'>"+danjiLabel+"</td><td class='mname'>"+name+"</td>"+
      "<td class='m-attended clickable-count' onclick=\"openStatusPreview('attended','"+nameEsc+"')\">"+t.attended+"</td>"+
      "<td class='m-scheduled clickable-count' onclick=\"openStatusPreview('scheduled','"+nameEsc+"')\">"+t.scheduled+"</td>"+
      "<td class='m-noshow clickable-count' onclick=\"openStatusPreview('noshow','"+nameEsc+"')\">"+t.noshow+"</td>"+
      "<td>"+total+"</td></tr>";
  });
  if(rowNum===0){
    html += "<tr><td colspan='7' style='color:var(--sub);padding:12px;'>조건에 맞는 담당자가 없습니다.</td></tr>";
  }
  html += "</tbody></table>";
  document.getElementById("managerTable").innerHTML = html;
}

// ---------- 요일별 참석 현황 차트 ----------
function updateStatsChart(){
  const labelEl = document.getElementById("chartWeekLabel");
  if(WEEKS.length===0){
    if(labelEl) labelEl.textContent = "-";
    document.getElementById("statsChart").innerHTML = "<div class='empty-msg'>등록된 일정이 없습니다.</div>";
    return;
  }
  const week = WEEKS[currentChartWeek] || [];
  if(labelEl) labelEl.textContent = (currentChartWeek+1)+"주차";

  const counts = week.map(([key])=>computeDateHeadcount(key));
  const maxCount = Math.max(1, ...counts);
  let html = "<div class='chart-bars'>";
  week.forEach(([key,label],i)=>{
    const count = counts[i];
    const barHeight = count>0 ? Math.max(6, Math.round((count/maxCount)*40)) : 2;
    const m = label.match(/\(([^)]+)\)/);
    const dowLabel = m ? m[1] : "";
    html += "<div class='chart-col' onclick=\"openPreview('"+key+"')\" title='"+label+" · "+count+"명'>"+
      "<div class='chart-count'>"+(count>0?count:"")+"</div>"+
      "<div class='chart-bar-wrap'><div class='chart-bar' style='height:"+barHeight+"px;'></div></div>"+
      "<div class='chart-label'>"+dowLabel+"</div>"+
      "</div>";
  });
  html += "</div>";
  document.getElementById("statsChart").innerHTML = html;
}
function prevChartWeek(){
  if(currentChartWeek>0){ currentChartWeek--; updateStatsChart(); }
}
function nextChartWeek(){
  if(currentChartWeek<WEEKS.length-1){ currentChartWeek++; updateStatsChart(); }
}

    return selectedManagers.has(raw[5]);
  };
  const passesDanjiFilter = (raw)=>{
    if(selectedDanji.size===0) return true;
    const d = raw[1] || GALLERY_DANJI;
    return selectedDanji.has(d);
  };

  const galleryData = [["날짜","시간","단지명","동호수","성함","동반","담당","픽업/자가","상태"]];
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((raw, idx)=>{
      if(!passesManagerFilter(raw) || !passesDanjiFilter(raw)) return;
      const r = reorderRow("gallery", raw);
      const status = statusLabel(rowStatus("gallery", key, idx));
      galleryData.push([labelFor(key), ...r, status]);
    });
  });
  const tourData = [["날짜","시간","단지명","동호수","성함/업체","동반","담당","픽업/자가","상태"]];
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((raw, idx)=>{
      if(!passesManagerFilter(raw) || !passesDanjiFilter(raw)) return;
      const r = reorderRow("tour", raw);
      const status = statusLabel(rowStatus("tour", key, idx));
      tourData.push([labelFor(key), ...r, status]);
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(galleryData), (CAT_LABEL.gallery||"갤러리").slice(0,31));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tourData), (CAT_LABEL.tour||"투어").slice(0,31));
  const suffix = (selectedManagers.size>0 || selectedDanji.size>0) ? "_필터적용" : "";
  XLSX.writeFile(wb, "통합일정표_체크결과"+suffix+".xlsx");
}

function printAllDates(){
  const savedManagerFilter = managerFilterValue;
  managerFilterValue = ""; // 인쇄 시엔 담당자 필터 무시하고 전체 표시

  const container = document.getElementById("printAllContainer");
  let html = "";
  getActiveDateKeys().forEach(key=>{
    const label = labelFor(key);
    const hasGallery = activeCategories.gallery && (GALLERY_ROWS[key] || GALLERY_CLOSED[key]);
    const hasTour = activeCategories.tour && (TOUR_ROWS[key] || TOUR_CLOSED[key]);
    if(!hasGallery && !hasTour) return;

    let block = "<div class='print-date-block'><div class='print-date-title'>"+label+"</div>";
    if(GALLERY_CLOSED[key] && activeCategories.gallery){
      block += "<div class='closed-banner'>"+CAT_LABEL.gallery+" : "+GALLERY_CLOSED[key]+"</div>";
    }
    if(TOUR_CLOSED[key] && activeCategories.tour){
      block += "<div class='closed-banner'>"+CAT_LABEL.tour+" : "+TOUR_CLOSED[key]+"</div>";
    }
    if(activeCategories.gallery && !GALLERY_CLOSED[key]) block += renderTable("gallery", key, GALLERY_ROWS[key], "gallery", CAT_LABEL.gallery);
    if(activeCategories.tour && !TOUR_CLOSED[key]) block += renderTable("tour", key, TOUR_ROWS[key], "tour", CAT_LABEL.tour);
    block += "</div>";
    html += block;
  });

  if(!html){
    html = "<div class='empty-day'>인쇄할 일정이 없습니다.</div>";
  }
  container.innerHTML = html;
  managerFilterValue = savedManagerFilter;

  document.body.classList.add("printing-all");
  window.print();
}
window.addEventListener("afterprint", ()=>{
  document.body.classList.remove("printing-all");
});


function todayKeyStr(){
  const t = new Date();
  return (t.getMonth()+1)+"-"+t.getDate();
}
let currentDateKey = (getActiveDateKeys()[0]) || todayKeyStr();
let previewKey = null;

function labelFor(key){
  const d = parseKeyDate(key);
  const dowNames = ["일","월","화","수","목","금","토"];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일("+dowNames[d.getDay()]+")";
}

// 실제 일정(예정/참석 등 데이터)이 있는 날짜만 모아 시간순 정렬
function getActiveDateKeys(){
  const keySet = new Set([
    ...Object.keys(GALLERY_ROWS),
    ...Object.keys(TOUR_ROWS),
    ...Object.keys(GALLERY_CLOSED),
    ...Object.keys(TOUR_CLOSED),
  ]);
  return [...keySet].sort((a,b)=>parseKeyDate(a)-parseKeyDate(b));
}

// ---- 공용 입력 폼 (prompt/confirm 대신 페이지 내 폼 사용) ----
let formCallback = null;
function openForm(title, fields, callback){
  document.getElementById("formTitle").textContent = title;
  const fieldsEl = document.getElementById("formFields");
  fieldsEl.innerHTML = fields.map(f=>{
    const val = (f.value||"").replace(/'/g,"&#39;");
    if(f.type==="select"){
      const opts = (f.options||[]).map(o=>
        "<option value='"+o.value.replace(/'/g,"&#39;")+"'"+(o.value===f.value?" selected":"")+">"+o.label+"</option>"
      ).join("");
      return "<div class='field-label'>"+f.label+"</div>"+
        "<select id='ff-"+f.id+"'>"+opts+"</select>";
    }
    if(f.multiline){
      return "<div class='field-label'>"+f.label+"</div>"+
        "<textarea id='ff-"+f.id+"' placeholder='"+(f.placeholder||"")+"' rows='4'>"+escText(f.value||"")+"</textarea>";
    }
    return "<div class='field-label'>"+f.label+"</div>"+
      "<input type='text' id='ff-"+f.id+"'"+(f.readonly?" readonly":"")+" placeholder='"+(f.placeholder||"")+"' value='"+val+"'>";
  }).join("");
  formCallback = callback;
  document.getElementById("overlay").classList.remove("on");
  document.getElementById("formOverlay").classList.add("on");
  const firstInput = fieldsEl.querySelector("input, textarea, select");
  if(firstInput) setTimeout(()=>firstInput.focus(), 50);
}
function closeFormOverlay(){
  document.getElementById("formOverlay").classList.remove("on");
  formCallback = null;
}
document.getElementById("formOverlay").addEventListener("click",(e)=>{
  if(e.target.id==="formOverlay") closeFormOverlay();
});
function submitForm(){
  if(!formCallback) return;
  const inputs = document.querySelectorAll("#formFields input, #formFields textarea, #formFields select");
  const values = {};
  inputs.forEach(inp=>{ values[inp.id.replace("ff-","")] = inp.value.trim(); });
  const cb = formCallback;
  document.getElementById("formOverlay").classList.remove("on");
  formCallback = null;
  cb(values);
}

function deleteEntry(kind, key, idx, btn){
  if(blockIfReadonly()) return;
  if(btn && btn.dataset.confirm !== "1"){
    btn.dataset.confirm = "1";
    btn.textContent = "정말 삭제?";
    setTimeout(()=>{ if(btn){ btn.dataset.confirm=""; btn.textContent="삭제"; } }, 3000);
    return;
  }
  const store = kind==="gallery" ? GALLERY_ROWS : TOUR_ROWS;
  if(!store[key]) return;
  const removed = store[key][idx];
  const removedName = removed ? removed[3] : "";
  store[key].splice(idx,1);
  if(store[key].length===0) delete store[key];
  logChange(labelFor(key)+" · "+(kind==="gallery"?CAT_LABEL.gallery:CAT_LABEL.tour)+" '"+removedName+"' 삭제");
  onScheduleDataChanged();
  syncBookingsStateOnly();
  openPreview(key);
}

function toggleClosedDay(kind){

    openPreview(key);
  } else {

function selectDate(key, scroll){
  currentDateKey = key;
  document.getElementById("dateFilter").value = key;
  document.querySelectorAll(".cell.active").forEach(c=>c.classList.remove("active"));
  const calCell = document.getElementById("cal-"+key);
  if(calCell) calCell.classList.add("active");

  const body = document.getElementById("checklistBody");
  let html = "";

  if(GALLERY_CLOSED[key] && activeCategories.gallery && showClosedToggle){
    html += "<div class='closed-banner'>"+CAT_LABEL.gallery+" : "+GALLERY_CLOSED[key]+"</div>";
  }
  if(TOUR_CLOSED[key] && activeCategories.tour && showClosedToggle){
    html += "<div class='closed-banner'>"+CAT_LABEL.tour+" : "+TOUR_CLOSED[key]+"</div>";
  }

  const galleryHtml = (activeCategories.gallery && !GALLERY_CLOSED[key]) ? renderTable("gallery", key, GALLERY_ROWS[key], "gallery", CAT_LABEL.gallery) : "";
  const tourHtml = (activeCategories.tour && !TOUR_CLOSED[key]) ? renderTable("tour", key, TOUR_ROWS[key], "tour", CAT_LABEL.tour) : "";

  if(!galleryHtml && !tourHtml && !(GALLERY_CLOSED[key] && activeCategories.gallery) && !(TOUR_CLOSED[key] && activeCategories.tour)){
    html += "<div class='empty-day'>표시할 일정이 없습니다.</div>";
  } else {
    html += galleryHtml + tourHtml;
  }

  body.innerHTML = html;

  if(scroll){
    document.querySelector(".checklist-section").scrollIntoView({behavior:"smooth", block:"start"});
  }
}

function prevDate(){
  const keys = getActiveDateKeys();
  const idx = keys.findIndex(k=>k===currentDateKey);
  if(idx>0) selectDate(keys[idx-1], false);
}
function nextDate(){
  const keys = getActiveDateKeys();
  const idx = keys.findIndex(k=>k===currentDateKey);

const STAFF_KEY = "staff_contacts_v1";
const defaultStaff = [
  {name:"성윤희", phone:"", car:"12라 2092"},
  {name:"임윤경", phone:"", car:"03너 7397"},
  {name:"장연수", phone:"", car:"02가 4809"},
  {name:"김민주", phone:"", car:"30도 1235"},
];
function loadStaff(){
  try{
    const raw = localStorage.getItem(STAFF_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultStaff));
}
function persistStaff(){
  localStorage.setItem(STAFF_KEY, JSON.stringify(staffList));
}
let staffList = loadStaff();
initStaffTable();

function renderStaffTable(){
  const body = document.getElementById("staffBody");
  body.innerHTML = "";
  staffList.forEach((s, idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td class='name' contenteditable='true' data-field='name' data-idx='"+idx+"'>"+(s.name||"")+"</td>"+
      "<td contenteditable='true' data-field='phone' data-idx='"+idx+"'>"+(s.phone||"")+"</td>"+
      "<td contenteditable='true' data-field='car' data-idx='"+idx+"'>"+(s.car||"")+"</td>"+
      "<td class='del'><button onclick='removeStaffRow("+idx+")'>✕</button></td>";
    body.appendChild(tr);
  });
  body.querySelectorAll("td[contenteditable]").forEach(td=>{
    td.addEventListener("blur", ()=>{
      const idx = +td.dataset.idx;
      const field = td.dataset.field;
      staffList[idx][field] = td.textContent.trim();
      persistStaff();
    });
  });
}
function addStaffRow(){
  staffList.push({name:"", phone:"", car:""});
  persistStaff();
  renderStaffTable();
  const rows = document.querySelectorAll("#staffBody tr");
  const lastNameCell = rows[rows.length-1].querySelector("td.name");
  if(lastNameCell) lastNameCell.focus();
}
function removeStaffRow(idx){
  staffList.splice(idx,1);
  persistStaff();
  renderStaffTable();
}
function initStaffTable(){
  renderStaffTable();
}

// ---- 일일 정원(마감 기준) 설정 - 평일/주말 구분 ----
function getCapacityRaw(){
  const wd = localStorage.getItem(CAPACITY_WEEKDAY_KEY);
  const we = localStorage.getItem(CAPACITY_WEEKEND_KEY);
  return {
    weekday: wd ? parseInt(wd,10) : 0,
    weekend: we ? parseInt(we,10) : 0
  };
}
function getCapacityForKey(key){
  if(dateCapacityOverrides[key]) return dateCapacityOverrides[key];
  const dow = mondayIndex(parseKeyDate(key).getDay()); // 0=월 ... 5=토, 6=일
  const cap = getCapacityRaw();
  return (dow>=5) ? cap.weekend : cap.weekday;
}
function openDateCapacitySettings(){
  const key = previewKey;
  if(!key) return;
  const current = dateCapacityOverrides[key];
  openForm(labelFor(key)+" 정원 설정 (비우면 평일/주말 기본값 사용)", [
    {id:"cap", label:"이 날짜 정원(명)", placeholder:"예: 15 (기본값 사용시 비워두세요)", value: current ? String(current) : ""}
  ], (v)=>{
    const num = parseInt(v.cap,10);
    if(isNaN(num) || num<=0) delete dateCapacityOverrides[key];
    else dateCapacityOverrides[key] = num;
    persistDateCapacity();
    buildCalendarArea();
    openPreview(key);
  });
}
function openCapacitySettings(){
  const cap = getCapacityRaw();
  openForm("일일 정원 설정 (동반 포함 인원, 0이면 사용 안 함)", [
    {id:"weekday", label:"평일 정원(월~금)", placeholder:"예: 15", value: cap.weekday ? String(cap.weekday) : ""},
    {id:"weekend", label:"주말 정원(토·일)", placeholder:"예: 20", value: cap.weekend ? String(cap.weekend) : ""}
  ], (v)=>{
    const wd = parseInt(v.weekday,10);
    const we = parseInt(v.weekend,10);
    if(isNaN(wd) || wd<=0) localStorage.removeItem(CAPACITY_WEEKDAY_KEY);
    else localStorage.setItem(CAPACITY_WEEKDAY_KEY, String(wd));
    if(isNaN(we) || we<=0) localStorage.removeItem(CAPACITY_WEEKEND_KEY);
    else localStorage.setItem(CAPACITY_WEEKEND_KEY, String(we));
    buildCalendarArea();
  });
}

// 동반 표기에서 인원 수 추출: "외2명"→2, "오영순+1"→1, 그 외/-→0
function parseCompanionCount(str){
  if(!str) return 0;
  let m = str.match(/외\s*(\d+)\s*명/);
  if(m) return parseInt(m[1],10);
  m = str.match(/\+\s*(\d+)/);
  if(m) return parseInt(m[1],10);
  return 0;
}
function computeDateHeadcount(key){
  let total = 0;
  (GALLERY_ROWS[key]||[]).forEach(r=>{ total += 1 + parseCompanionCount(r[4]); }); // r=[time,danji,ho,name,plus,manager,spot]
  (TOUR_ROWS[key]||[]).forEach(r=>{ total += 1 + parseCompanionCount(r[4]); }); // r=[time,danji,ho,name,plus,manager,spot]
  return total;
}
