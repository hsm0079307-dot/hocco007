<script id="calendar-v2-preview">
(function(){
  function esc2(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  window.openPreview=function(key){
    previewKey=key;
    const title=document.getElementById('modalTitle');
    const body=document.getElementById('modalBody');
    if(!body) return;

    if(title) title.textContent=labelFor(key);

    const gallery=(GALLERY_ROWS[key]||[]);
    const tour=(TOUR_ROWS[key]||[]);
    const total=gallery.length+tour.length;
    const head=computeDateHeadcount(key);
    const cap=getCapacityForKey(key);
    const isClosed=!!GALLERY_CLOSED[key];

    let html=`<div class="preview-v2-summary">
      <span>일정 <strong>${total}건</strong></span>
      ${head>0?`<span>예상 인원 <strong>${head}명</strong></span>`:''}
    </div>`;

    if(isClosed){
      html+=`<div class="preview-v2-group closed">
        <div class="preview-v2-group-head">휴관 / 이용 불가</div>
        <div class="preview-v2-closed">${esc2(GALLERY_CLOSED[key])}</div>
      </div>`;
    }

    if(gallery.length){
      html+=`<section class="preview-v2-group gallery">
        <div class="preview-v2-group-head">갤러리 · ${gallery.length}건</div>
        <div class="preview-v2-list">`;
      gallery.forEach((r,idx)=>{
        const [time,spot,name,plus,manager]=r;
        const meta=[
          plus&&plus!=='-'?plus:'',
          manager&&manager!=='-'?'담당 '+manager:'',
          spot&&spot!=='-'?spot:''
        ].filter(Boolean).join(' · ');
        html+=`<div class="preview-v2-item gallery">
          <div class="preview-v2-time">${esc2(time||'일정')}</div>
          <div class="preview-v2-main">
            <div class="preview-v2-title">
              <span class="preview-v2-site">${esc2(GALLERY_DANJI||'갤러리')}</span>
              <span class="preview-v2-name">${esc2(name||'성명 미입력')}</span>
            </div>
            <div class="preview-v2-meta">${esc2(meta||'상세 정보 없음')}</div>
          </div>
          <button class="preview-v2-del" title="삭제" onclick="deleteEntry('gallery','${key}',${idx},this)">×</button>
        </div>`;
      });
      html+=`</div></section>`;
    }

    if(tour.length){
      html+=`<section class="preview-v2-group tour">
        <div class="preview-v2-group-head">투어 · ${tour.length}건</div>
        <div class="preview-v2-list">`;
      tour.forEach((r,idx)=>{
        const [time,danji,ho,name,plus,manager]=r;
        const meta=[
          name&&name!=='-'?name:'',
          ho&&ho!=='-'?ho:'',
          plus&&plus!=='-'?plus:'',
          manager&&manager!=='-'?'담당 '+manager:''
        ].filter(Boolean).join(' · ');
        html+=`<div class="preview-v2-item tour">
          <div class="preview-v2-time">${esc2(time||'일정')}</div>
          <div class="preview-v2-main">
            <div class="preview-v2-title">
              <span class="preview-v2-site">${esc2(danji||'현장 미입력')}</span>
              <span class="preview-v2-name">${esc2(name||'성명 미입력')}</span>
            </div>
            <div class="preview-v2-meta">${esc2(meta||'상세 정보 없음')}</div>
          </div>
          <button class="preview-v2-del" title="삭제" onclick="deleteEntry('tour','${key}',${idx},this)">×</button>
        </div>`;
      });
      html+=`</div></section>`;
    }

    if(!total && !isClosed){
      html+=`<div class="preview-empty">등록된 일정이 없습니다.</div>`;
    }

    html+=`<div class="preview-v2-settings">
      <div class="preview-v2-cap">정원 <strong>${cap>0?cap+'명':'미설정'}${head>0?' · 현재 '+head+'명':''}</strong></div>
      <button onclick="openDateCapacitySettings()">이 날짜 정원 설정 ›</button>
    </div>`;

    html+=`<div class="preview-v2-actions">
      <button class="gallery" onclick="addEntryFlow('gallery')">+ 갤러리 일정</button>
      <button class="tour" onclick="addEntryFlow('tour')">+ 투어 일정</button>
      <button class="primary" onclick="openInChecklist()">체크리스트 열기</button>
    </div>
    <div class="preview-v2-secondary">
      <button onclick="toggleClosedDay()">${isClosed?'휴관 해제':'휴관 / 이용불가 지정'}</button>
    </div>`;

    body.innerHTML=html;
    document.getElementById('overlay').classList.add('on');
  };
})();
</script>

<script id="calendar-canva-full-redesign-behavior">
(function(){
  function labelManagerCard(){
    const title=document.getElementById('m13ManagerTitle');
    const sub=document.getElementById('m13ManagerSub');
    if(title) title.textContent='전체 통계 · 담당자별 현황';
    if(sub){
      const old=sub.textContent||'';
      if(old && !old.includes('펼쳐보기')) sub.textContent = old + ' · 펼쳐보기';
    }
  }
  function closeRangeOnApply(){
    const apply=document.getElementById('m13Apply');
    const card=document.getElementById('m13RangeCard');
    if(apply && card && !apply.dataset.cvBound){
      apply.dataset.cvBound='1';
      apply.addEventListener('click', function(){
        card.classList.remove('range-open');
        const toggle=document.getElementById('m13RangeToggle');
        if(toggle) toggle.textContent='기간 설정';
      });
    }
  }
  function init(){ labelManagerCard(); closeRangeOnApply(); }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
  const _renderShell = window.renderShell;
  if(typeof _renderShell === 'function'){
    window.renderShell = function(){
      const ret = _renderShell.apply(this, arguments);
      labelManagerCard();
      closeRangeOnApply();
      return ret;
    };
  }
})();
</script>

    wrap.insertBefore(app,wrap.firstChild);built=true;bind();
  }

  function bind(){
    document.getElementById('proPrev').onclick=()=>setMonth(-1);
    document.getElementById('proNext').onclick=()=>setMonth(1);

    document.getElementById('proManage').onclick=()=>document.getElementById('mobileAdminFab')?.click();

    document.getElementById('proBackdrop').onclick=closeSheet;

    const search=document.getElementById('proSearchInput'); if(search)search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(search.value)});
  }
  function handleNav(a){
    if(a==='schedule'){document.body.classList.remove('pro-show-legacy');window.scrollTo({top:0,behavior:'smooth'});return}

    if(a==='manager'||a==='stats'){document.body.classList.add('pro-show-legacy');const target=document.querySelector(a==='stats'?'#statsChart':'.checklist-section');target?.scrollIntoView({behavior:'smooth',block:'start'});return}

  function handleMobile(a,b){
    document.querySelectorAll('.pro-bottomnav button').forEach(x=>x.classList.toggle('active',x===b));
    if(a==='schedule'){closeSheet();window.scrollTo({top:0,behavior:'smooth'})}
    if(a==='gallery'){previewKey=selectedKey;if(typeof addEntryFlow==='function')addEntryFlow('gallery')}

    if(a==='more')document.getElementById('mobileAdminFab')?.click();
  }
  function doSearch(q){
    q=String(q||'').trim().toLowerCase(); if(!q)return;
    const b=baseDate(), y=b.getFullYear(),m=b.getMonth();
    for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
      const k=key(new Date(y,m,d)); const hit=dayEvents(k).some(e=>[e.site,e.name,e.meta].join(' ').toLowerCase().includes(q));
      if(hit){select(k,true);return}
    }
  }
  function siteClick(name){
    if(typeof activeDanjiFilter==='undefined')return;
    if(!name)activeDanjiFilter.clear();
    else{activeDanjiFilter.clear();activeDanjiFilter.add(name)}
    try{if(typeof buildCalendarArea==='function')buildCalendarArea();if(typeof selectDate==='function'&&currentDateKey)selectDate(currentDateKey,false)}catch(e){}
    render();
  }
  function renderSites(){
    const box=document.getElementById('proSiteRow');if(!box)return;
    const active=(typeof activeDanjiFilter!=='undefined')?activeDanjiFilter:new Set();
    box.innerHTML=`<button class="pro-chip ${active.size===0?'on':''}" type="button" data-site="">전체</button>`+allSites().map(s=>`<button class="pro-chip ${active.has(s)?'on':''}" type="button" data-site="${esc(s)}">${esc(s)}</button>`).join('');
    box.querySelectorAll('button').forEach(btn=>btn.onclick=()=>siteClick(btn.dataset.site||''));
  }
  function renderCalendar(){
    const box=document.getElementById('proDays');if(!box)return;
    const b=baseDate(),y=b.getFullYear(),m=b.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
    document.getElementById('proMonthTitle').textContent=`${y}년 ${m+1}월`;
    const daysInMonth=new Date(y,m+1,0).getDate();
    const weeks=(first.getDay()+daysInMonth<=35)?5:6;
    box.dataset.weeks=String(weeks);
    let html='';
    for(let i=0;i<weeks*7;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),other=d.getMonth()!==m,ev=other?[]:dayEvents(k),g=ev.some(x=>x.kind==='gallery'),t=ev.some(x=>x.kind==='tour'),dow=d.getDay();
      html+=`<button type="button" class="pro-day ${other?'other':''} ${dow===0?'sun':''} ${dow===6?'sat':''} ${!other&&k===selectedKey?'selected':''}" data-key="${k}" data-other="${other?1:0}" data-y="${d.getFullYear()}" data-m="${d.getMonth()}" data-d="${d.getDate()}"><span class="pro-daynum">${d.getDate()}</span>${(g||t)?`<span class="pro-day-dots">${g?'<i class="g"></i>':''}${t?'<i class="t"></i>':''}</span>`:''}</button>`;
    }

    box.querySelectorAll('.pro-day').forEach(btn=>btn.onclick=()=>{

        const f=new Date(+btn.dataset.y,+btn.dataset.m,1),l=new Date(+btn.dataset.y,+btn.dataset.m+1,0),s=document.getElementById('rangeStart'),e=document.getElementById('rangeEnd');if(s)s.value=iso(f);if(e)e.value=iso(l);if(typeof applyRange==='function')applyRange();

  function renderMini(){
    const box=document.getElementById('proMobileSummary');if(!box)return;const ev=dayEvents(selectedKey);const show=ev.slice(0,3);

    const group=(arr,kind,title)=>arr.length?`<section class="pro-group"><div class="pro-group-title ${kind}"><i class="pro-dot ${kind}"></i>${title} · ${arr.length}건</div><div class="pro-eventlist">${arr.map(e=>`<div class="pro-event ${kind}"><div class="pro-time">${esc(e.time)}</div><div><div class="pro-event-title">${esc(e.site)} &nbsp; ${esc(e.name)}</div><div class="pro-event-meta">${esc(e.meta||'상세 정보 없음')}</div></div><div class="pro-event-arr">›</div></div>`).join('')}</div></section>`:'';
    body.innerHTML=`<div class="pro-detail-date">${esc(label(selectedKey))}</div><div class="pro-statrow"><div class="pro-stat">${svg.cal}<span>일정 <b>${ev.length}건</b></span></div><div class="pro-stat">${svg.people}<span>예상 인원 <b>${head}명</b></span></div></div>${closed?`<div class="pro-group"><div class="pro-group-title" style="color:#bd6074">휴관 / 이용불가</div><div class="pro-empty" style="padding:16px">${esc(closed)}</div></div>`:''}${group(g,'gallery','갤러리')}${group(t,'tour','투어')}${!ev.length&&!closed?'<div class="pro-empty">등록된 일정이 없습니다.</div>':''}<div class="pro-capacity"><span>정원 &nbsp;<b>${cap>0?cap+'명':'미설정'}${head>0?' · 현재 '+head+'명':''}</b></span><button type="button" id="proCapBtn">이 날짜 정원 설정 ›</button></div><div class="pro-actions"><button class="pro-add-gallery" id="proAddG" type="button">+ 갤러리 일정</button><button class="pro-add-tour" id="proAddT" type="button">+ 투어 일정</button><button class="pro-open-check" id="proOpenCheck" type="button">체크리스트 열기</button></div><div class="pro-secondary"><button id="proClosedBtn" type="button">${closed?'휴관 해제':'휴관 / 이용불가 지정'}</button></div>`;
    document.getElementById('proCapBtn').onclick=()=>{previewKey=selectedKey;if(typeof openDateCapacitySettings==='function')openDateCapacitySettings()};
    document.getElementById('proAddG').onclick=()=>{previewKey=selectedKey;if(typeof addEntryFlow==='function')addEntryFlow('gallery')};
    document.getElementById('proAddT').onclick=()=>{previewKey=selectedKey;if(typeof addEntryFlow==='function')addEntryFlow('tour')};
    document.getElementById('proOpenCheck').onclick=openChecklist;
    document.getElementById('proClosedBtn').onclick=()=>{previewKey=selectedKey;if(typeof toggleClosedDay==='function')toggleClosedDay()};
  }
  function select(k,open){selectedKey=k;previewKey=k;currentDateKey=k;try{if(typeof selectDate==='function')selectDate(k,false)}catch(e){}render();if(open&&matchMedia('(max-width:760px)').matches)openSheet()}
  function openSheet(){document.body.classList.add('pro-sheet-open')}
  function closeSheet(){document.body.classList.remove('pro-sheet-open')}
  function openChecklist(){closeSheet();document.body.classList.add('pro-show-legacy');try{if(typeof selectDate==='function')selectDate(selectedKey,true)}catch(e){}}

  function render(){
    build();
    const b=baseDate(); if(!selectedKey)selectedKey=pickSelectedForMonth(b);
    document.getElementById('proTitle').textContent=sourceTitle();
    renderSites();renderCalendar();renderMini();renderDetail();
    const lg=document.getElementById('proLegendG'),lt=document.getElementById('proLegendT');if(lg)lg.classList.toggle('off',typeof activeCategories!=='undefined'&&!activeCategories.gallery);if(lt)lt.classList.toggle('off',typeof activeCategories!=='undefined'&&!activeCategories.tour);
  }

  function wrap(name){const old=window[name];if(typeof old!=='function'||old.__pro20)return;const fn=function(){const r=old.apply(this,arguments);setTimeout(render,0);return r};fn.__pro20=true;window[name]=fn}
  function init(){
    ['applyRange','setThisMonth','setNextMonth','toggleCategory','toggleClosedFilter','onScheduleDataChanged','deleteEntry'].forEach(wrap);
    const originalPreview=window.openPreview;
    window.openPreview=function(k){selectedKey=k;previewKey=k;currentDateKey=k;render();if(matchMedia('(max-width:760px)').matches)openSheet();};window.openPreview.__pro20=true;
    render();window.addEventListener('resize',()=>render());
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="calendar-pro-v24-mobile-empty-upcoming">
(function(){
  function mobile(){return !!(window.matchMedia&&matchMedia('(max-width:760px)').matches)}
  function q(s,r){return (r||document).querySelector(s)}
  function qa(s,r){return Array.from((r||document).querySelectorAll(s))}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function key(d){return (d.getMonth()+1)+'-'+d.getDate()}
  function eventRows(k){
    const out=[];let filter=new Set();try{filter=(typeof activeDanjiFilter!=='undefined'&&activeDanjiFilter)||new Set()}catch(e){}
    let showG=true,showT=true;try{if(typeof activeCategories!=='undefined'){showG=activeCategories.gallery!==false;showT=activeCategories.tour!==false}}catch(e){}
    if(showG){try{(GALLERY_ROWS?.[k]||[]).forEach(function(r){const site=(typeof GALLERY_DANJI!=='undefined'&&GALLERY_DANJI)||'갤러리';if(filter.size&&!filter.has(site))return;out.push({kind:'gallery',time:r[0]||'일정',site:site,name:r[2]||'성명 미입력'})})}catch(e){}}
    if(showT){try{(TOUR_ROWS?.[k]||[]).forEach(function(r){const site=r[1]||'현장 미입력';if(filter.size&&!filter.has(site))return;out.push({kind:'tour',time:r[0]||'일정',site:site,name:r[3]||'성명 미입력'})})}catch(e){}}
    return out;
  }
  function selectedDate(){
    const el=q('.pro-day.selected');
    const rs=q('#rangeStart');
    const b=rs&&rs.value?new Date(rs.value+'T00:00:00'):new Date();
    if(el&&el.dataset.key){const p=el.dataset.key.split('-').map(Number);return new Date(b.getFullYear(),p[0]-1,p[1])}
    return new Date();
  }
  function fmt(d){return (d.getMonth()+1)+'/'+d.getDate()+' '+['일','월','화','수','목','금','토'][d.getDay()]}
  function upcoming(from,maxRows){
    const rows=[];
    for(let n=1;n<=62 && rows.length<maxRows;n++){
      const d=new Date(from);d.setDate(d.getDate()+n);const k=key(d),ev=eventRows(k);
      for(const x of ev){rows.push({date:d,key:k,...x});if(rows.length>=maxRows)break}
    }
    return rows;
  }
  function enhance(){
    if(!mobile())return;
    const box=q('#proMobileSummary');if(!box||!box.classList.contains('is-empty'))return;
    if(q('.pro-v24-emptyline',box))return;
    const list=q('.pro-mini-events',box);if(!list)return;
    const up=upcoming(selectedDate(),3);
    list.innerHTML='<div class="pro-v24-emptyline">선택한 날짜에 등록된 일정이 없습니다.</div>'+
      (up.length?'<div class="pro-v24-upcoming"><div class="pro-v24-upcoming-head"><strong>다가오는 일정</strong><span>다음 일정 미리보기</span></div>'+up.map(function(x){return '<div class="pro-v24-up-row" data-key="'+esc(x.key)+'"><span class="pro-v24-up-date">'+esc(fmt(x.date))+'</span><i class="'+esc(x.kind)+'"></i><div class="pro-v24-up-main"><b>'+esc(x.time)+'</b><span>'+esc(x.site)+'</span></div><em class="pro-v24-up-name">'+esc(x.name)+'</em></div>'}).join('')+'</div>':'');
    qa('.pro-v24-up-row',box).forEach(function(row){row.onclick=function(){try{if(typeof window.openPreview==='function')window.openPreview(row.dataset.key)}catch(e){}}});
  }
  function init(){
    setTimeout(function(){
      enhance();
      const box=q('#proMobileSummary');
      if(box){
        new MutationObserver(function(){setTimeout(enhance,0)}).observe(box,{childList:true,subtree:true});
      }
    },120);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<style id="calendar-pro-v25-functional-fix">
/* V25 — functionality + truly dynamic site filters */
@media (max-width:760px){
  /* Legacy forms/settings must appear above the custom mobile sheet. */
  .overlay{z-index:2200!important}
  .overlay .modal{z-index:2201!important}
  #lockScreen{z-index:3000!important}
  .pro-tools-backdrop{z-index:2290!important}
  .pro-tools-sheet,.pro-customer-sheet{z-index:2300!important}
}

<script id="calendar-pro-v25-functional-fix-js">
(function(){
  const q=(s,r)=>(r||document).querySelector(s);
  const qa=(s,r)=>Array.from((r||document).querySelectorAll(s));
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let syncing=false;

  function dynamicSites(){
    const set=new Set();
    try{
      Object.values(typeof TOUR_ROWS!=='undefined'?(TOUR_ROWS||{}):{}).forEach(rows=>{
        (rows||[]).forEach(r=>{const n=String((r&&r[1])||'').trim();if(n&&n!=='-')set.add(n)});
      });
    }catch(e){}
    try{
      const hasGallery=Object.values(typeof GALLERY_ROWS!=='undefined'?(GALLERY_ROWS||{}):{}).some(rows=>Array.isArray(rows)&&rows.length);
      const g=(typeof GALLERY_DANJI!=='undefined'?String(GALLERY_DANJI||'').trim():'');
      if(hasGallery&&g)set.add(g);
    }catch(e){}
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'}));
  }

  function triggerProRender(){
    // The pro renderer already listens to resize; using it avoids duplicating its private state.
    try{window.dispatchEvent(new Event('resize'))}catch(e){}
  }

  function setSiteFilter(name){
    try{
      if(typeof activeDanjiFilter==='undefined')return;
      activeDanjiFilter.clear();
      if(name)activeDanjiFilter.add(name);
      if(typeof buildCalendarArea==='function')buildCalendarArea();
      if(typeof currentDateKey!=='undefined'&&currentDateKey&&typeof selectDate==='function')selectDate(currentDateKey,false);
    }catch(e){console.error(e)}
    triggerProRender();
    setTimeout(syncSites,20);
  }

  function syncSites(){
    if(syncing)return;
    const row=q('#proSiteRow');if(!row)return;
    syncing=true;
    try{
      const sites=dynamicSites();
      let active=[];
      try{active=(typeof activeDanjiFilter!=='undefined')?Array.from(activeDanjiFilter):[]}catch(e){}
      // If old data/filter disappeared, don't leave the calendar silently filtered to nothing.
      if(active.some(x=>!sites.includes(x))){
        try{activeDanjiFilter.clear();active=[]}catch(e){}
      }
      const sig=JSON.stringify([sites,active]);
      if(row.dataset.dynamicSig!==sig){
        row.dataset.dynamicSig=sig;
        row.innerHTML='<button class="pro-chip '+(active.length===0?'on':'')+'" type="button" data-v25-site="">전체</button>'+sites.map(n=>'<button class="pro-chip '+(active.includes(n)?'on':'')+'" type="button" data-v25-site="'+esc(n)+'">'+esc(n)+'</button>').join('');
      }
    }finally{syncing=false}
  }

  function openTools(){
    document.body.classList.remove('pro-sheet-open','pro-customer-open');
    if(typeof window.proOpenTools==='function'){window.proOpenTools();return}
    const fab=q('#mobileAdminFab');if(fab)fab.click();
  }
  function openCustomers(){
    document.body.classList.remove('pro-sheet-open','pro-tools-open');
    if(typeof window.proOpenCustomers==='function'){window.proOpenCustomers();return}
  }
  function openChecklist(){
    document.body.classList.remove('pro-sheet-open','pro-tools-open','pro-customer-open');
    document.body.classList.add('pro-show-legacy');
    try{
      const sel=q('.pro-day.selected');const k=sel?.dataset?.key||(typeof currentDateKey!=='undefined'?currentDateKey:'');
      if(k&&typeof selectDate==='function')selectDate(k,true);
    }catch(e){}
    setTimeout(()=>q('.checklist-section')?.scrollIntoView({behavior:'smooth',block:'start'}),80);
  }

  // Capture phase makes the visible app controls reliable even if older redesign layers
  // attached conflicting handlers to the same buttons.
  document.addEventListener('click',function(e){
    const site=e.target.closest('#proSiteRow [data-v25-site]');
    if(site){e.preventDefault();e.stopImmediatePropagation();setSiteFilter(site.getAttribute('data-v25-site')||'');return}

    const manage=e.target.closest('#proManage');
    if(manage){e.preventDefault();e.stopImmediatePropagation();openTools();return}

    const nav=e.target.closest('.pro-bottomnav button');
    if(nav){
      const a=nav.dataset.mobile;
      if(a==='more'||a==='customer'||a==='check'||a==='schedule'){
        e.preventDefault();e.stopImmediatePropagation();
        qa('.pro-bottomnav button').forEach(b=>b.classList.toggle('active',b===nav));
        if(a==='more')openTools();
        else if(a==='customer')openCustomers();
        else if(a==='check')openChecklist();
        else {document.body.classList.remove('pro-sheet-open','pro-tools-open','pro-customer-open','pro-show-legacy');window.scrollTo({top:0,behavior:'smooth'})}
        return;
      }
    }
  },true);

  function relabelNav(){
    const bs=qa('.pro-bottomnav button');if(bs.length<4)return;
    const cfg=[['schedule','일정'],['customer','고객'],['check','체크리스트'],['more','더보기']];
    cfg.forEach((x,i)=>{bs[i].dataset.mobile=x[0];const sp=q('span',bs[i]);if(sp)sp.textContent=x[1]});
  }

  function fixDetailActions(){
    // Close custom sheet before opening legacy edit/settings overlays.
    [['#proAddG','gallery'],['#proAddT','tour']].forEach(([sel,kind])=>{
      const b=q(sel);if(!b||b.dataset.v25wired)return;b.dataset.v25wired='1';
      b.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();document.body.classList.remove('pro-sheet-open');setTimeout(()=>{try{const k=q('.pro-day.selected')?.dataset?.key;if(k)previewKey=k;if(typeof addEntryFlow==='function')addEntryFlow(kind)}catch(err){console.error(err)}},60)},true);
    });
    const cap=q('#proCapBtn');if(cap&&!cap.dataset.v25wired){cap.dataset.v25wired='1';cap.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();document.body.classList.remove('pro-sheet-open');setTimeout(()=>{try{const k=q('.pro-day.selected')?.dataset?.key;if(k)previewKey=k;if(typeof openDateCapacitySettings==='function')openDateCapacitySettings()}catch(err){console.error(err)}},60)},true)}
    const closed=q('#proClosedBtn');if(closed&&!closed.dataset.v25wired){closed.dataset.v25wired='1';closed.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();document.body.classList.remove('pro-sheet-open');setTimeout(()=>{try{const k=q('.pro-day.selected')?.dataset?.key;if(k)previewKey=k;if(typeof toggleClosedDay==='function')toggleClosedDay()}catch(err){console.error(err)}},60)},true)}
  }

  function refresh(){relabelNav();syncSites();fixDetailActions()}
  function init(){
    setTimeout(refresh,80);
    const root=q('#proCalendarApp');
    if(root){new MutationObserver(()=>{clearTimeout(window.__v25t);window.__v25t=setTimeout(refresh,25)}).observe(root,{childList:true,subtree:true})}
    // Changes to underlying schedule data may not mutate proSiteRow immediately.
    window.addEventListener('resize',()=>setTimeout(refresh,25));
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="calendar-pro-v26-clean-mobile-js">
(function(){
  const q=(s,r)=>(r||document).querySelector(s);
  const qa=(s,r)=>Array.from((r||document).querySelectorAll(s));
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mobile=()=>matchMedia('(max-width:760px)').matches;
  let timer=null;

  function selectedBtn(){return q('.pro-day.selected')}
  function selectedKey(){return selectedBtn()?.dataset?.key||(typeof currentDateKey!=='undefined'?currentDateKey:'')||''}
  function selectedDate(){
    const b=selectedBtn();
    if(b&&b.dataset.y!=null)return new Date(+b.dataset.y,+b.dataset.m,+b.dataset.d);
    const rs=q('#rangeStart');const base=rs&&rs.value?new Date(rs.value+'T00:00:00'):new Date();
    const p=selectedKey().split('-').map(Number);return p.length===2?new Date(base.getFullYear(),p[0]-1,p[1]):base;
  }
  function dateLabel(d){return `${d.getMonth()+1}월 ${d.getDate()}일(${['일','월','화','수','목','금','토'][d.getDay()]})`}
  function compactDate(d){return `${d.getMonth()+1}/${d.getDate()} ${['일','월','화','수','목','금','토'][d.getDay()]}`}

  function dynamicSites(){
    const set=new Set();
    try{Object.values(typeof TOUR_ROWS!=='undefined'?(TOUR_ROWS||{}):{}).forEach(rows=>(rows||[]).forEach(r=>{const n=String((r&&r[1])||'').trim();if(n&&n!=='-')set.add(n)}))}catch(e){}
    try{
      const hasGallery=Object.values(typeof GALLERY_ROWS!=='undefined'?(GALLERY_ROWS||{}):{}).some(rows=>Array.isArray(rows)&&rows.length);
      const g=(typeof GALLERY_DANJI!=='undefined'?String(GALLERY_DANJI||'').trim():'');if(hasGallery&&g)set.add(g);
    }catch(e){}
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'}));
  }
  function activeSites(){try{return typeof activeDanjiFilter!=='undefined'?Array.from(activeDanjiFilter):[]}catch(e){return []}}
  function setSite(name){
    try{
      if(typeof activeDanjiFilter==='undefined')return;
      activeDanjiFilter.clear();if(name)activeDanjiFilter.add(name);
      if(typeof buildCalendarArea==='function')buildCalendarArea();
      if(typeof currentDateKey!=='undefined'&&currentDateKey&&typeof selectDate==='function')selectDate(currentDateKey,false);
    }catch(e){console.error(e)}
    try{window.dispatchEvent(new Event('resize'))}catch(e){}
    schedule();
  }
  function categories(){
    let g=true,t=true;try{g=activeCategories?.gallery!==false;t=activeCategories?.tour!==false}catch(e){}
    return {g,t};
  }
  function mountFilter(){
    if(!mobile())return;const row=q('#proSiteRow');if(!row)return;
    const sites=dynamicSites(),active=activeSites(),cat=categories();
    const valid=active.filter(x=>sites.includes(x));
    if(valid.length!==active.length){try{activeDanjiFilter.clear()}catch(e){}}
    const selected=valid[0]||'';
    const sig=JSON.stringify([sites,selected,cat.g,cat.t]);if(row.dataset.v26sig===sig&&q('#proSiteSelect',row))return;
    row.dataset.v26sig=sig;
    row.innerHTML=`<label class="pro-v26-sitewrap"><select class="pro-v26-site-select" id="proSiteSelect" aria-label="현장 선택"><option value="">전체 현장</option>${sites.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}</select></label><button class="pro-v26-cat gallery ${cat.g?'':'off'}" type="button" id="proCatG"><i></i>갤러리</button><button class="pro-v26-cat tour ${cat.t?'':'off'}" type="button" id="proCatT"><i></i>투어</button>`;
    q('#proSiteSelect',row).onchange=e=>setSite(e.target.value||'');
    q('#proCatG',row).onclick=()=>{q('#proLegendG')?.click();schedule()};
    q('#proCatT',row).onclick=()=>{q('#proLegendT')?.click();schedule()};
  }

  function rowsFor(k){
    const out=[],filter=new Set(activeSites()),cat=categories();
    try{if(cat.g)(GALLERY_ROWS?.[k]||[]).forEach(r=>{const site=(typeof GALLERY_DANJI!=='undefined'&&GALLERY_DANJI)||'갤러리';if(filter.size&&!filter.has(site))return;out.push({kind:'gallery',time:r[0]||'일정',site,name:r[2]||'성명 미입력',meta:[r[1],r[3],r[4]?'담당 '+r[4]:''].filter(x=>x&&x!=='-').join(' · ')})})}catch(e){}
    try{if(cat.t)(TOUR_ROWS?.[k]||[]).forEach(r=>{const site=r[1]||'현장 미입력';if(filter.size&&!filter.has(site))return;out.push({kind:'tour',time:r[0]||'일정',site,name:r[3]||'성명 미입력',meta:[r[2],r[4],r[5]?'담당 '+r[5]:''].filter(x=>x&&x!=='-').join(' · ')})})}catch(e){}
    return out;
  }
  function keyOf(d){return `${d.getMonth()+1}-${d.getDate()}`}
  function upcoming(from,max=3){
    const out=[];for(let i=1;i<=62&&out.length<max;i++){const d=new Date(from);d.setDate(d.getDate()+i);const k=keyOf(d);for(const x of rowsFor(k)){out.push({date:d,key:k,...x});if(out.length>=max)break}}return out;
  }
  function openSheet(){document.body.classList.remove('pro-tools-open','pro-customer-open');document.body.classList.add('pro-sheet-open')}
  function goUpcoming(k){
    const btn=q(`.pro-day[data-key="${CSS.escape(k)}"]`);
    if(btn){btn.click();setTimeout(openSheet,70);return}
    try{
      const [m,d]=k.split('-').map(Number);const base=selectedDate();let y=base.getFullYear();if(m<base.getMonth()+1)y++;
      const s=q('#rangeStart'),e=q('#rangeEnd');if(s)s.value=`${y}-${String(m).padStart(2,'0')}-01`;if(e)e.value=`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
      if(typeof applyRange==='function')applyRange();
      setTimeout(()=>{const b=q(`.pro-day[data-key="${CSS.escape(k)}"]`);if(b){b.click();setTimeout(openSheet,50)}},100);
    }catch(err){console.error(err)}
  }
  function renderList(){
    if(!mobile())return;const box=q('#proMobileSummary');if(!box)return;const k=selectedKey();if(!k)return;
    const d=selectedDate(),rows=rowsFor(k),ups=rows.length?[]:upcoming(d,3);
    const sig=JSON.stringify([k,rows,ups.map(x=>[x.key,x.time,x.site,x.name])]);if(box.dataset.v26sig===sig&&q('.pro-v26-list',box))return;
    box.dataset.v26sig=sig;
    const list=rows.length?rows.map(x=>`<button class="pro-v26-event-row" type="button"><span class="dot ${x.kind}"></span><time>${esc(x.time)}</time><span class="pro-v26-event-main"><b>${esc(x.site)}${x.name?' · '+esc(x.name):''}</b><small>${esc(x.meta||'')}</small></span><span class="pro-v26-arr">›</span></button>`).join(''):
      `<div class="pro-v26-empty">이 날짜에는 등록된 일정이 없습니다.</div>${ups.length?`<div class="pro-v26-up-title"><strong>다가오는 일정</strong><span>다음 일정 미리보기</span></div>${ups.map(x=>`<button class="pro-v26-up-row" type="button" data-key="${esc(x.key)}"><span class="date">${esc(compactDate(x.date))}</span><span class="dot ${x.kind}"></span><span class="pro-v26-event-main"><b>${esc(x.time)} · ${esc(x.site)}</b><small>${esc(x.name)}</small></span><span class="pro-v26-arr">›</span></button>`).join('')}`:''}`;
    box.innerHTML=`<div class="pro-v26-list"><div class="pro-v26-list-head"><div><strong>${esc(dateLabel(d))}</strong><span class="count">${rows.length}건</span></div><button class="pro-v26-detail-link" type="button">상세보기 ›</button></div><div class="pro-v26-events">${list}</div></div>`;
    q('.pro-v26-detail-link',box).onclick=openSheet;
    qa('.pro-v26-event-row',box).forEach(b=>b.onclick=openSheet);
    qa('.pro-v26-up-row',box).forEach(b=>b.onclick=()=>goUpcoming(b.dataset.key));
  }

  function navIntent(){
    const bs=qa('.pro-bottomnav button');if(bs.length<4)return;
    // v25 may rewrite data-mobile; pointerdown repairs it before its click handler runs.
    bs[0].dataset.mobile='schedule';bs[1].dataset.mobile='gallery';bs[2].dataset.mobile='tour';bs[3].dataset.mobile='more';
  }
  function preNav(e){const b=e.target.closest('.pro-bottomnav button');if(!b)return;const bs=qa('.pro-bottomnav button');const i=bs.indexOf(b);if(i===1)b.dataset.mobile='gallery';else if(i===2)b.dataset.mobile='tour'}
  document.addEventListener('pointerdown',preNav,true);document.addEventListener('touchstart',preNav,true);
  document.addEventListener('click',function(e){
    const b=e.target.closest('.pro-bottomnav button');if(!b||!mobile())return;const bs=qa('.pro-bottomnav button'),i=bs.indexOf(b);
    if(i===1||i===2){e.preventDefault();e.stopImmediatePropagation();bs.forEach((x,j)=>x.classList.toggle('active',j===i));const k=selectedKey();if(k)previewKey=k;setTimeout(()=>{try{if(typeof addEntryFlow==='function')addEntryFlow(i===1?'gallery':'tour')}catch(err){console.error(err)}},20)}
  },true);

  function update(){if(!mobile())return;mountFilter();renderList();navIntent()}
  function schedule(){clearTimeout(timer);timer=setTimeout(update,35)}
  function init(){setTimeout(update,100);const root=q('#proCalendarApp');if(root)new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class','data-weeks']});window.addEventListener('resize',schedule)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

  .pro-v27-agenda-list{display:flex;flex-direction:column}
  .pro-v27-agenda-row,.pro-v27-up-row{
    width:100%;min-height:45px;border:0;border-top:1px solid #f0f4f5;background:#fff;padding:7px 1px;

  function renderFilters(){

  function fdShortSite(n){

  function fdEventHeadcount(x){

  function fdDayGroups(k){

    for(let i=0;i<42;i++){

  }
  function renderDetail(){

    if(ev.length){list='<div class="fd-detail-list">'+ev.map(x=>`<div class="fd-event ${x.kind}"><div class="fd-event-time">${esc(x.time)}</div><div class="fd-event-copy"><strong>${esc(x.site)} · ${esc(x.name)}</strong><span>${esc(x.meta|| (x.manager?'담당 '+x.manager:''))}</span></div><div class="fd-kind">${x.kind==='gallery'?'갤러리':x.kind==='tour'?'투어':'휴관'}</div></div>`).join('')+'</div>'}

<script id="desktop-onepage-v7-user-fixes-script">
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const getYM=()=>{const v=document.getElementById('rangeStart')?.value;if(v){const d=new Date(v+'T00:00:00');if(!isNaN(d))return [d.getFullYear(),d.getMonth()]};const m=(document.getElementById('fdMonthTitle')?.textContent||'').match(/(\d{4})년\s*(\d{1,2})월/);return m?[+m[1],+m[2]-1]:[new Date().getFullYear(),new Date().getMonth()]};
  const key=(m,d)=>(m+1)+'-'+d;
  function ensureTitle(){
    const edit=document.getElementById('fdEditTitle');if(!edit||edit.dataset.bound)return;edit.dataset.bound='1';
    const title=document.getElementById('fdMainTitle'),sub=document.getElementById('fdSubtitleText');
    let savedTitle='',savedSub='';
    try{savedTitle=localStorage.getItem('fdDisplayTitle')||localStorage.getItem('site_title_v1')||'';savedSub=localStorage.getItem('fdCustomTitle')||''}catch(e){}
    title.textContent=savedTitle||'현장 일정표';sub.textContent=savedSub;document.title=title.textContent;
    edit.onclick=()=>{
      let dialog=document.getElementById('fdTitleDialog');
      if(!dialog){
        dialog=document.createElement('dialog');dialog.id='fdTitleDialog';
        dialog.innerHTML='<form method="dialog"><h2>일정표 제목 수정</h2><label>제목<input name="heading" required maxlength="80" autocomplete="off"></label><label>부제목<input name="subtitle" maxlength="120" autocomplete="off"></label><p class="fd-title-error" role="alert"></p><div><button type="button" class="cancel">취소</button><button type="submit" class="save">저장</button></div></form>';
        document.body.appendChild(dialog);
        dialog.querySelector('.cancel').onclick=()=>dialog.close();
        dialog.querySelector('form').onsubmit=e=>{
          e.preventDefault();const name=dialog.querySelector('[name=heading]').value.trim();const subtitle=dialog.querySelector('[name=subtitle]').value.trim();
          if(!name){dialog.querySelector('.fd-title-error').textContent='제목을 입력해주세요.';return;}
          try{localStorage.setItem('fdDisplayTitle',name);localStorage.setItem('site_title_v1',name);localStorage.setItem('fdCustomTitle',subtitle)}
          catch(err){dialog.querySelector('.fd-title-error').textContent='브라우저 저장이 차단되어 있습니다. 저장을 허용한 뒤 다시 시도해주세요.';return;}
          title.textContent=name;sub.textContent=subtitle;document.title=name;
          const src=document.getElementById('siteTitle');if(src)src.textContent=name;
          dialog.close();
        };
      }
      dialog.querySelector('[name=heading]').value=title.textContent;
      dialog.querySelector('[name=subtitle]').value=sub.textContent;
      dialog.querySelector('.fd-title-error').textContent='';dialog.showModal();
    };
  }
  function ensureModal(){
    let modal=document.getElementById('fdSummaryModal');if(modal)return modal;
    modal=document.createElement('div');modal.id='fdSummaryModal';modal.className='fd-summary-modal';modal.innerHTML='<div class="fd-summary-dialog" role="dialog" aria-modal="true"><div class="fd-summary-dialog-head"><strong id="fdSummaryModalTitle">월간 집계 상세</strong><button type="button" id="fdSummaryModalClose">✕</button></div><div class="fd-summary-dialog-body" id="fdSummaryModalBody"></div></div>';
    document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('on')});modal.querySelector('#fdSummaryModalClose').onclick=()=>modal.classList.remove('on');
    return modal;
  }
  function monthEvents(kind){
    const [y,m]=getYM(),n=new Date(y,m+1,0).getDate(),rows=[];
    for(let d=1;d<=n;d++){
      const k=key(m,d);
      if(kind!=='tour'){
        try{(GALLERY_ROWS?.[k]||[]).forEach(r=>rows.push({date:d,kind:'gallery',time:r[0]||'-',site:(typeof GALLERY_DANJI!=='undefined'&&GALLERY_DANJI)||'갤러리',name:r[2]||'성명 미입력',meta:[r[1],r[4]?'담당 '+r[4]:''].filter(Boolean).join(' · ')}))}catch(e){}
      }
      if(kind!=='gallery'){
        try{(TOUR_ROWS?.[k]||[]).forEach(r=>rows.push({date:d,kind:'tour',time:r[0]||'-',site:r[1]||'현장 미입력',name:r[3]||'성명 미입력',meta:[r[2],r[5]?'담당 '+r[5]:''].filter(Boolean).join(' · ')}))}catch(e){}
      }
    }
    return rows;
  }
  function headRows(){
    const [y,m]=getYM(),n=new Date(y,m+1,0).getDate(),rows=[];
    for(let d=1;d<=n;d++){const k=key(m,d);let count=0,events=0;try{count=typeof computeDateHeadcount==='function'?computeDateHeadcount(k):0;events=(GALLERY_ROWS?.[k]||[]).length+(TOUR_ROWS?.[k]||[]).length}catch(e){}if(events||count)rows.push({date:d,count,events})}
    return rows;
  }
  function openSummary(type){
    const modal=ensureModal(),body=modal.querySelector('#fdSummaryModalBody'),title=modal.querySelector('#fdSummaryModalTitle');const [y,m]=getYM();
    if(type==='head'){
      const rows=headRows();title.textContent=`${y}년 ${m+1}월 예상 인원 상세`;
      body.innerHTML=rows.length?rows.map(r=>`<div class="fd-month-head-row"><time>${m+1}월 ${r.date}일</time><span>일정 ${r.events}건</span><strong>${r.count}명</strong></div>`).join(''):'<div class="fd-summary-empty">해당 월의 일정이 없습니다.</div>';
    }else{
      const kind=type==='gallery'?'gallery':type==='tour'?'tour':'all',rows=monthEvents(kind),label=type==='gallery'?'갤러리':type==='tour'?'투어':'전체 일정';title.textContent=`${y}년 ${m+1}월 ${label}`;
      body.innerHTML=rows.length?rows.map(r=>`<div class="fd-month-detail-row ${r.kind}"><time>${m+1}/${r.date}</time><span class="kind">${r.kind==='gallery'?'갤러리':'투어'}</span><div class="fd-month-detail-main"><strong>${esc(r.site)} · ${esc(r.name)}</strong><span>${esc(r.meta||'')}</span></div><em>${esc(r.time)}</em></div>`).join(''):'<div class="fd-summary-empty">해당 일정이 없습니다.</div>';
    }
    modal.classList.add('on');
  }
  document.addEventListener('click',e=>{const k=e.target.closest('.fd-kpi[data-summary-type]');if(k){e.preventDefault();openSummary(k.dataset.summaryType)}});
  const mo=new MutationObserver(()=>ensureTitle());mo.observe(document.documentElement,{subtree:true,childList:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(ensureTitle,120));else setTimeout(ensureTitle,120);
})();
</script>

<script id="desktop-cleanup-openfix-v11-js">
(function(){
  function isDesktop(){return !!(window.matchMedia&&window.matchMedia('(min-width:761px)').matches);}
  function cleanStoredTitle(v){
    v=String(v||'').trim();
    if(!v) return '';
    if(/2차\s*&\s*갤러리/i.test(v)) return '';
    if(/\(현장명\)/.test(v)) return '';
    if(v==='통합 일정표 & 날짜별 체크리스트') return '';
    return v;
  }
  function fixDesktop(){
    if(!isDesktop()) return;
    var app=document.getElementById('freshDesktopApp');
    if(!app) return;

    /* 제목은 이상한 과거 저장값만 정리하고 수정 버튼 기능은 그대로 유지 */
    var title=document.getElementById('fdMainTitle');
    var sub=document.getElementById('fdSubtitleText');
    if(title){
      var saved='';
      try{saved=cleanStoredTitle(localStorage.getItem('fdDisplayTitle')||localStorage.getItem('site_title_v1')||'');}catch(e){}
      if(!saved) saved='현장 일정표';
      title.textContent=saved;
      document.title=saved;
    }
    if(sub) sub.textContent='';

    /* 운영현황 제목도 실제 구성에 맞게 수정 */
    var ops=app.querySelector('.fd-ops-title span');
    if(ops) ops.textContent='집계 · 담당자 · 요일별 현황';

    /* 중복 날짜별 체크리스트 카드 숨김 */
    var mount=document.getElementById('fdLegacyMount');
    if(mount){
      var cards=mount.querySelectorAll('.fd-legacy-card');
      cards.forEach(function(card){
        var head=card.querySelector('.fd-legacy-card-head');
        if(head && /날짜별\s*체크리스트/.test(head.textContent||'')) card.classList.add('fd-duplicate-checklist');
      });
    }
  }
  function schedule(){fixDesktop();setTimeout(fixDesktop,120);setTimeout(fixDesktop,500);setTimeout(fixDesktop,1200);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true}); else schedule();
  window.addEventListener('load',schedule,{once:true});
})();
</script>

<script id="desktop-cleanup-v12-js">
(function(){
  function desktop(){return !!(window.matchMedia&&window.matchMedia('(min-width:761px)').matches)}
  function invalidTitle(v){
    v=String(v||'').trim();
    if(!v) return true;
    if(/(?:21차|2차).*갤러리|갤러리.*(?:21차|2차)/i.test(v)) return true;
    if(/\(현장명\)/.test(v)) return true;
    if(/통합\s*일정표.*체크리스트/.test(v)) return true;
    return false;
  }
  function fix(){
    if(!desktop()) return;
    const app=document.getElementById('freshDesktopApp'); if(!app) return;

    /* 잘못 저장된 과거 제목은 일반 제목으로 복구. '수정' 버튼은 그대로 사용 */
    const title=document.getElementById('fdMainTitle');
    if(title){
      let current=title.textContent||'';
      let saved='';
      try{saved=localStorage.getItem('fdDisplayTitle')||localStorage.getItem('site_title_v1')||'';}catch(e){}
      if(invalidTitle(saved) || invalidTitle(current)){
        title.textContent='현장 일정표';
        document.title='현장 일정표';
        try{
          localStorage.setItem('fdDisplayTitle','현장 일정표');
          localStorage.setItem('site_title_v1','현장 일정표');
        }catch(e){}
        const src=document.getElementById('siteTitle'); if(src) src.textContent='현장 일정표';
      }
    }
    const sub=document.getElementById('fdSubtitleText'); if(sub) sub.textContent='';

    /* 날짜별 체크리스트 카드는 DOM상 있어도 화면에는 절대 노출하지 않음 */
    const mount=document.getElementById('fdLegacyMount');
    if(mount){
      mount.querySelectorAll('.fd-legacy-card').forEach(card=>{
        const head=card.querySelector('.fd-legacy-card-head');
        if(head && /날짜별\s*체크리스트/.test(head.textContent||'')) card.classList.add('fd-duplicate-checklist');
      });
    }
    const ops=app.querySelector('.fd-ops-title span');
    if(ops) ops.textContent='집계 · 담당자 · 요일별 현황';
  }
  function run(){fix();setTimeout(fix,100);setTimeout(fix,450);setTimeout(fix,1000)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true}); else run();
  window.addEventListener('load',run,{once:true});
})();
</script>

<script id="desktop-cleanup-v13-js">

      fdFullDetail:'상세보기'

    compactDetailActions();
    setTimeout(compactDetailActions,80);
    setTimeout(compactDetailActions,300);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',run,{once:true});
  }else{
    run();
  }

  /* 날짜를 바꾸면 fdDetail이 다시 렌더링되므로 버튼 라벨을 다시 압축 */
  var observer=new MutationObserver(function(muts){
    if(!desktop()) return;
    for(var i=0;i<muts.length;i++){
      var t=muts[i].target;
      if(t && (t.id==='fdDetail' || (t.closest && t.closest('#fdDetail')))){
        compactDetailActions();
        break;
      }
    }
  });
  function bind(){
    var d=document.getElementById('fdDetail');
    if(d) observer.observe(d,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();
</script>
