<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>통합 일정표 &amp; 날짜별 체크리스트</title>
<style>
  :root{
    --ink:#1c2430;--sub:#5b6470;--line:#e2e6ea;--bg:#f6f7f9;
    --gallery:#2f6f6b;--gallery-bg:#eaf4f2;
    --tour:#a8562f;--tour-bg:#faece3;
    --closed:#c94f4f;--closed-bg:#fbeceb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 60px;}
  .wrap{max-width:960px;margin:0 auto;}
  header{background:var(--ink);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header h1{margin:0 0 4px;font-size:19px;}
  header h1[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed transparent;padding-bottom:2px;}
  header h1[contenteditable]:hover{border-color:rgba(255,255,255,.4);}
  header h1[contenteditable]:focus{border-color:rgba(255,255,255,.6);}
  header p{margin:0;font-size:12.5px;color:#c7cdd6;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .toolbar button{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);}
  .bottom-toolbar{
    margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .bottom-toolbar button{border:1px solid var(--line);}

  .rangebar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:16px;font-size:12.5px;
  }
  .rangebar label{color:var(--sub);font-weight:600;}
  .rangebar input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;}
  .rangebar button{border:none;background:var(--ink);color:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .rangebar .quick{background:var(--bg);color:var(--ink);border:1px solid var(--line);}

  .catbar{display:none;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px;font-size:12.5px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:20px;}
  .legend span.toggle{cursor:pointer;user-select:none;}
  .legend span.toggle:hover{border-color:var(--sub);}
  .cat-label-edit{outline:none;border-bottom:1px dashed transparent;cursor:text;}
  .cat-label-edit:hover{border-bottom-color:var(--line);}
  .cat-label-edit:focus{border-bottom-color:var(--sub);}
  #siteSubtitle[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed transparent;}
  #siteSubtitle[contenteditable]:hover{border-bottom-color:rgba(255,255,255,.4);}
  #siteSubtitle[contenteditable]:focus{border-bottom-color:rgba(255,255,255,.6);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#fff;border:1.5px solid var(--line);}
  .dot.gallery.lit{background:var(--gallery);border-color:var(--gallery);}
  .dot.tour.lit{background:var(--tour);border-color:var(--tour);}
  .dot.closed.lit{background:var(--closed);border-color:var(--closed);}

  .danjiToggleBar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-size:12.5px;}
  .danjiToggleBar span{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    padding:4px 10px;border-radius:20px;cursor:pointer;user-select:none;
  }
  .danjiToggleBar span:hover{border-color:var(--sub);}
  .danjiToggleBar .dot.danji{background:#fff;border:1.5px solid var(--line);}
  .danjiToggleBar .dot.danji.lit{background:#3b6fd6;border-color:#3b6fd6;}

  .month-label{font-size:13.5px;font-weight:700;margin:16px 0 6px 2px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:2px 0;}
  .dow.sun{color:var(--closed);}
  .cell{background:#fff;border:1px solid var(--line);border-radius:6px;height:44px;padding:3px 5px;position:relative;cursor:pointer;transition:box-shadow .15s;}
  .cell.cap-full{background:#fff7ec;border:2px solid #e08a2b;}
  .cap-ribbon{
    position:absolute;top:2px;right:2px;background:#e08a2b;color:#fff;
    font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.5px;
  }
  .cap-status{position:absolute;left:5px;bottom:3px;font-size:7.5px;font-weight:700;color:#c94f4f;}
  .cap-status.full{color:#c9821f;}
  .cell:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .cell.empty{background:transparent;border:none;cursor:default;}
  .cell.gclosed{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#fbeceb 8px,#fbeceb 16px);}
  .cell.active{outline:2px solid var(--ink);}
  .cell.today{border:2px solid #3b6fd6;background:#f3f7ff;}
  .cell.today .date{color:#3b6fd6;}
  .cell.today .date::after{content:" (오늘)";font-size:9px;font-weight:700;color:#3b6fd6;}
  .date{font-size:11px;font-weight:700;}
  .sun .date{color:var(--closed);}
  .badges{position:absolute;right:4px;bottom:3px;display:flex;gap:2px;}
  .b{width:13px;height:13px;border-radius:4px;font-size:7.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;}
  .b.gallery{background:var(--gallery);}
  .b.tour{background:var(--tour);}
  .b.closed{background:var(--closed);font-size:8px;}

  /* 체크리스트 섹션 */
  .checklist-section{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .checklist-section h2{margin:0 0 10px;font-size:16px;}
  .filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select{
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;
    background:#fff;color:var(--ink);min-width:180px;
  }
  .filterbar button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .closed-banner{background:var(--closed-bg);color:var(--closed);font-weight:700;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .empty-day{color:var(--sub);font-size:13px;padding:10px 0;}

  .sub-title{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:13.5px;font-weight:700;}
  .sub-title .tag{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:700;}
  .tag.gallery{background:var(--gallery-bg);color:var(--gallery);}
  .tag.tour{background:var(--tour-bg);color:var(--tour);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
  #checklistBody table{table-layout:fixed;}
  #checklistBody th:nth-child(1),#checklistBody td:nth-child(1){width:10%;} /* 시간 */
  #checklistBody th:nth-child(2),#checklistBody td:nth-child(2){width:13%;} /* 단지명 */
  #checklistBody th:nth-child(3),#checklistBody td:nth-child(3){width:12%;} /* 동호수 */
  #checklistBody th:nth-child(4),#checklistBody td:nth-child(4){width:20%;} /* 성함 */
  #checklistBody th:nth-child(5),#checklistBody td:nth-child(5){width:11%;} /* 동반 */
  #checklistBody th:nth-child(6),#checklistBody td:nth-child(6){width:11%;} /* 담당 */
  #checklistBody th:nth-child(7),#checklistBody td:nth-child(7){width:11%;} /* 픽업/자가 */
  #checklistBody th:nth-child(8),#checklistBody td:nth-child(8){width:5%;padding-left:2px;padding-right:2px;}  /* 확인 */
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  th{background:var(--bg);color:var(--sub);font-weight:700;font-size:11.5px;}
  td.name{font-weight:600;}
  .memo-name{cursor:pointer;border-bottom:1px dashed var(--sub);}
  .memo-name:hover{color:var(--gallery);}
  .memo-name.has-memo{border-bottom-color:var(--gallery);}
  .memo-dot{color:var(--gallery);font-size:7px;vertical-align:middle;}
  input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  tr.checked td{background:#f4fbf9;}
  tr.attended td{background:#eaf6f0;}
  tr.noshow td{background:#fdecea;}
  tr.scheduled td{background:#fff;}
  .status-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;}
  .status-pill.attended{background:#2f6f6b;color:#fff;}
  .status-pill.noshow{background:#c94f4f;color:#fff;}
  .status-pill.scheduled{background:#8a93a0;color:#fff;}

  .summary-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;max-width:360px;
  }
  .summary-card{
    flex:1;min-width:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;text-align:center;cursor:pointer;transition:box-shadow .15s;
  }
  .summary-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .summary-card .num{font-size:15px;font-weight:800;}
  .summary-card .label{font-size:10px;color:var(--sub);margin-top:1px;}
  .summary-card.attended .num{color:#2f6f6b;}
  .summary-card.noshow .num{color:#c94f4f;}
  .summary-card.scheduled .num{color:#5b6470;}

  #statusBody{max-height:60vh;overflow-y:auto;}
  #statusBody .row-line{cursor:pointer;padding:8px 2px;}
  #statusBody .row-line:hover{background:var(--bg);border-radius:6px;}

  .manager-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;table-layout:fixed;}
  .manager-table th,.manager-table td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  .manager-table th{background:var(--bg);color:var(--sub);font-weight:700;font-size:11.5px;}
  .manager-table th:nth-child(1),.manager-table td:nth-child(1){width:34px;}
  .manager-table th:nth-child(2),.manager-table td:nth-child(2),
  .manager-table th:nth-child(3),.manager-table td:nth-child(3){width:90px;}
  .manager-table td.mname{font-weight:700;text-align:center;}
  .manager-table td.mdanji{text-align:center;}
  .manager-table td.m-attended{color:#2f6f6b;font-weight:700;}
  .manager-table td.m-noshow{color:#c94f4f;font-weight:700;}
  .manager-table td.m-scheduled{color:#5b6470;font-weight:700;}
  .manager-table td.clickable-count{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
  .manager-table td.clickable-count:hover{background:var(--bg);}

  .chartWeekBar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
  .chartWeekBar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--ink);}
  .chartWeekBar span{font-size:12px;font-weight:700;color:var(--ink);min-width:44px;text-align:center;}

  .chart-bars{display:flex;align-items:flex-end;gap:6px;height:56px;padding:4px 4px 0;border-bottom:1px solid var(--line);max-width:320px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:4px;}
  .chart-col:hover{background:var(--bg);}
  .chart-bar-wrap{flex:1;display:flex;align-items:flex-end;}
  .chart-bar{width:55%;min-width:10px;background:linear-gradient(180deg,var(--gallery),#4a938e);border-radius:3px 3px 0 0;}
  .chart-label{font-size:9.5px;color:var(--sub);margin-top:2px;font-weight:700;}
  .chart-count{font-size:9px;color:var(--ink);font-weight:700;}

  .managerFilterBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .colFilter{position:relative;}
  .colFilterBtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .colFilterBtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .colFilterDropdown{
    display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:20;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    min-width:160px;max-height:220px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.1);
  }
  .colFilterDropdown.open{display:block;}
  .colFilterDropdown label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 2px;cursor:pointer;white-space:nowrap;}
  .colFilterDropdown input[type=checkbox]{width:14px;height:14px;}
  .colFilterDropdown .df-actions{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .colFilterDropdown .df-actions button{
    flex:1;border:none;background:var(--bg);border-radius:6px;padding:4px 0;font-size:11px;cursor:pointer;color:var(--ink);
  }
  .managerFilterBar .resetBtn{
    border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--sub);
  }

  @media print{
    header, .toolbar, .rangebar, .catbar, .danjiToggleBar, .legend, .month-label, .grid, .filterbar, #addStaffBtn, .modal-actions, .overlay{display:none !important;}
    body{background:#fff;padding:0;}
    .checklist-section, .car{border:none;box-shadow:none;padding:0;margin-top:10px;}
    .summary-bar{margin-bottom:10px;}
    body.printing-all #checklistBody{display:none !important;}
    body.printing-all #printAllContainer{display:block !important;}
  }
  #printAllContainer{display:none;}
  .print-date-block{margin-bottom:18px;}
  @media print{
    .print-date-block{page-break-after:always;}
    .print-date-block:last-child{page-break-after:auto;}
  }
  .print-date-title{font-size:14px;font-weight:800;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--ink);}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  @media (max-width:480px){
    body{padding:12px 8px 40px;}
    header{flex-direction:column;align-items:flex-start;padding:14px 16px;}
    header h1{font-size:16px;}
    .toolbar{width:100%;}
    .toolbar button{flex:1;font-size:11px;padding:7px 6px;}
    .rangebar{padding:8px 10px;gap:6px;}
    .rangebar input[type=date]{font-size:11.5px;padding:5px 6px;}
    .rangebar button{font-size:11.5px;padding:6px 8px;}
    .checklist-section, .car{padding:12px 10px;}
    .summary-card .num{font-size:13px;}
    .filterbar{gap:6px;}
    .filterbar select{min-width:0;flex:1;font-size:12px;}
    table{font-size:11px;}
    th,td{padding:4px 5px;}
    .colFilterDropdown{min-width:130px;}
    .grid{gap:3px;}
    .cell{height:38px;padding:3px;}
    .date{font-size:10px;}
    .b{width:11px;height:11px;font-size:7px;}
  }

  .car{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;}
  .car h3{margin:0 0 8px;font-size:13.5px;}
  .car table{width:100%;border-collapse:collapse;}
  .car th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;padding:4px 8px;border-bottom:1px solid var(--line);}
  .car td{border:none;border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:12.5px;}
  .car td[contenteditable]{outline:none;cursor:text;min-width:40px;}
  .car td[contenteditable]:focus{background:var(--bg);border-radius:4px;}
  .car td.name{color:var(--ink);font-weight:600;}
  .car td.del{text-align:center;width:28px;}
  .car td.del button{border:none;background:none;color:var(--closed);cursor:pointer;font-size:14px;}
  #addStaffBtn{
    margin-top:10px;border:1px dashed var(--line);background:var(--bg);color:var(--ink);
    border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;
  }
  .foot-note{font-size:11.5px;color:var(--sub);margin-top:8px;}
  .foot-note[contenteditable]{outline:none;cursor:text;border:1px dashed transparent;padding:4px 6px;border-radius:6px;}
  .foot-note[contenteditable]:hover{border-color:var(--line);}
  .foot-note[contenteditable]:focus{border-color:var(--line);background:var(--bg);}

  /* 미리보기 모달 */
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,24,30,.45);align-items:center;justify-content:center;z-index:10;padding:16px;}
  .overlay.on{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;padding:20px 22px;}
  .modal h2{margin:0 0 12px;font-size:16px;display:inline-block;}
  .modal .close{float:right;border:none;background:var(--line);border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;color:var(--sub);}
  .modal .block{margin-bottom:12px;font-size:12.5px;line-height:1.6;}
  .modal .block:last-child{margin-bottom:0;}
  .modal .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:5px;}
  .modal .tag.gallery{background:var(--gallery-bg);color:var(--gallery);}
  .modal .tag.tour{background:var(--tour-bg);color:var(--tour);}
  .modal .row-line{padding:2px 0;border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .modal .row-line:last-child{border-bottom:none;}
  .modal .row-line span{flex:1;}
  .modal .row-del{
    border:none;background:#fdecea;color:var(--closed);border-radius:6px;
    padding:2px 8px;font-size:10.5px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .modal .empty-msg{color:var(--sub);font-size:13px;}
  .preview-actions{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;}
  .preview-actions button{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;
    padding:7px 2px;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .preview-actions button.on{background:var(--closed);color:#fff;border-color:var(--closed);}
  .preview-actions button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

  .memo-actions-inline{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}
  .mini-action{font-size:10.5px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;}
  .cap-info-line{font-size:11px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .mini-action:hover{color:var(--ink);}
  .mini-action.danger{color:var(--closed);}
  #memoBody{font-size:15px;line-height:1.7;color:var(--ink);min-height:60px;}
  #memoBody .empty-msg{font-size:13.5px;}
  .modal-actions{margin-top:16px;}
  .modal-actions button{width:100%;border:none;border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;}

  #formFields .field-label{font-size:11.5px;font-weight:700;color:var(--sub);margin:12px 0 4px;}
  #formFields .field-label:first-child{margin-top:0;}
  #formFields input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:13px;font-family:inherit;
  }
  #formFields textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:13px;font-family:inherit;resize:vertical;line-height:1.5;
  }

  #lockScreen{
    position:fixed;inset:0;background:var(--ink);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;z-index:999;padding:20px;
  }
  #lockScreen h2{margin:0;font-size:17px;}
  #lockScreen p{margin:0;font-size:12.5px;color:#c7cdd6;}
  #lockScreen input{
    border:none;border-radius:8px;padding:10px 14px;font-size:16px;letter-spacing:4px;
    text-align:center;width:140px;
  }
  #lockScreen button{
    border:none;background:#fff;color:var(--ink);border-radius:8px;padding:9px 20px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  #lockScreen .err{color:#ff9c9c;font-size:12px;height:16px;}
  #appRoot{display:none;}
</style>



<style id="design-v2">
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{
  --ink:#182433;--sub:#667085;--muted:#98a2b3;--line:#e6eaf0;--line2:#d8dee8;
  --bg:#f3f6fa;--card:#fff;--navy:#17263b;--navy2:#223753;
  --accent:#2f6f6b;--accent2:#3f8580;--accent-bg:#edf7f5;

<script id="calendar-lock-simple-script">
(function(){
  var DEFAULT='0134';
  function expected(){
    try{return localStorage.getItem('calendar_password_v1') || DEFAULT;}catch(e){return DEFAULT;}
  }
  function openCalendar(){
    var input=document.getElementById('pwInput');
    var err=document.getElementById('pwErr');
    var value=String(input && input.value || '').trim();
    if(!value){ if(err) err.textContent='비밀번호를 입력해주세요'; if(input) input.focus(); return false; }
    if(value!==expected()){ if(err) err.textContent='비밀번호가 올바르지 않습니다'; if(input){input.focus(); try{input.select();}catch(e){}} return false; }
    document.documentElement.classList.add('calendar-unlocked');
    document.documentElement.setAttribute('data-calendar-unlocked','1');
    var lock=document.getElementById('lockScreen');
    var app=document.getElementById('appRoot');
    if(lock){lock.hidden=true;lock.setAttribute('aria-hidden','true');}
    if(app){app.hidden=false;app.style.removeProperty('display');}
    try{window.scrollTo(0,0);}catch(e){}
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
    return true;
  }
  window.unlockCalendarNow=function(){return openCalendar();};
  function bind(){
    var form=document.getElementById('lockForm');
    var btn=document.getElementById('pwOpenBtn');
    var input=document.getElementById('pwInput');
    if(form && !form.dataset.simpleBound){
      form.dataset.simpleBound='1';
      form.addEventListener('submit',function(e){e.preventDefault();openCalendar();});
    }
    if(btn && !btn.dataset.clickBound){
      btn.dataset.clickBound='1';
      btn.addEventListener('click',function(e){e.preventDefault();openCalendar();});
    }
    if(input && !input.dataset.keyBound){
      input.dataset.keyBound='1';
      input.addEventListener('keyup',function(e){if(e.key==='Enter'){e.preventDefault();openCalendar();}});
    }
  }
  bind();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind,{once:true});
})();
</script>

const SCHEDULE_DATA_KEY = "manual_schedule_data_v1";
let GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED;
function loadScheduleData(){
  try{
    const raw = localStorage.getItem(SCHEDULE_DATA_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      GALLERY_ROWS = parsed.GALLERY_ROWS || {};
      TOUR_ROWS = parsed.TOUR_ROWS || {};
      GALLERY_CLOSED = parsed.GALLERY_CLOSED || {};
      return;
    }
  }catch(e){}
  GALLERY_ROWS = JSON.parse(JSON.stringify(GALLERY_ROWS_DEFAULT));
  TOUR_ROWS = JSON.parse(JSON.stringify(TOUR_ROWS_DEFAULT));
  GALLERY_CLOSED = JSON.parse(JSON.stringify(GALLERY_CLOSED_DEFAULT));
}
function persistScheduleData(){
  localStorage.setItem(SCHEDULE_DATA_KEY, JSON.stringify({GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED}));
}
loadScheduleData();

const DATA = {}; // 캘린더 배지 표시용
function rebuildDATA(){
  Object.keys(DATA).forEach(k=>delete DATA[k]);
  ALL_DATES.forEach(([k])=>{
    const g = GALLERY_ROWS[k] || GALLERY_CLOSED[k];
    const t = TOUR_ROWS[k];
    if(g || t){
      DATA[k] = {gallery: !!g, tour: !!t, closed: !!GALLERY_CLOSED[k]};
    }
  });
  // ALL_DATES에 없는(범위 밖) 날짜도 배지 계산에 포함
  new Set([...Object.keys(GALLERY_ROWS), ...Object.keys(TOUR_ROWS), ...Object.keys(GALLERY_CLOSED)]).forEach(k=>{
    const g = GALLERY_ROWS[k] || GALLERY_CLOSED[k];
    const t = TOUR_ROWS[k];
    if(g || t){
      DATA[k] = {gallery: !!g, tour: !!t, closed: !!GALLERY_CLOSED[k]};
    }
  });
}
rebuildDATA();

function onScheduleDataChanged(){
  persistScheduleData();
  rebuildDATA();
  buildCalendarArea();
  selectDate(currentDateKey, false);
  updateSummary();
  updateManagerTable();
  updateStatsChart();
  populateManagerFilter();
  populateDanjiToggleBar();
}

function backupScheduleData(){
  const blob = new Blob([JSON.stringify({GALLERY_ROWS, TOUR_ROWS, GALLERY_CLOSED}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;

  a.click();

}
function restoreScheduleDataPrompt(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        GALLERY_ROWS = parsed.GALLERY_ROWS || {};
        TOUR_ROWS = parsed.TOUR_ROWS || {};
        GALLERY_CLOSED = parsed.GALLERY_CLOSED || {};
        onScheduleDataChanged();
      }catch(err){
        alert("파일을 읽을 수 없습니다. 올바른 백업 JSON 파일인지 확인해주세요.");
        console.error("restoreScheduleDataPrompt: invalid JSON file");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function pad(n){return n<10 ? "0"+n : ""+n;}
function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mondayIndex(jsDay){return (jsDay+6)%7;}

function buildCalendarArea(){
  const area = document.getElementById("calendarArea");
  area.innerHTML = "";
  const start = new Date(range.start+"T00:00:00");
  const end = new Date(range.end+"T00:00:00");
  if(isNaN(start) || isNaN(end) || start>end){
    area.innerHTML = "<div class='empty-day'>날짜 범위를 올바르게 지정해주세요.</div>";
    return;
  }
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const lastMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  const dowNames = ["월","화","수","목","금","토","일"];

  while(cursor <= lastMonth){
    const y = cursor.getFullYear();
    const m = cursor.getMonth()+1;
    const daysInMonth = new Date(y, m, 0).getDate();
    const monthStartD = (y===start.getFullYear() && m===(start.getMonth()+1)) ? start.getDate() : 1;
    const monthEndD = (y===end.getFullYear() && m===(end.getMonth()+1)) ? end.getDate() : daysInMonth;

    const label = document.createElement("div");
    label.className = "month-label";
    label.textContent = y+"년 "+m+"월";
    area.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "grid";
    area.appendChild(grid);

    dowNames.forEach((d,i)=>{
      const el = document.createElement("div");
      el.className = "dow" + (i===6?" sun":"");
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstJsDay = new Date(y, m-1, monthStartD).getDay();
    const leadBlanks = mondayIndex(firstJsDay);
    for(let i=0;i<leadBlanks;i++){
      const el = document.createElement("div");
      el.className = "cell empty";
      grid.appendChild(el);
    }

    const today = new Date(); today.setHours(0,0,0,0);
    for(let d=monthStartD; d<=monthEndD; d++){
      const key = m+"-"+d;
      const dowIndex = mondayIndex(new Date(y, m-1, d).getDay());
      const el = document.createElement("div");
      el.className = "cell" + (dowIndex===6?" sun":"");
      el.id = "cal-"+key;
      const info = DATA[key];
      const isClosedDay = info && info.closed;
      const hasGalleryRows = !!GALLERY_ROWS[key];
      const showClosed = isClosedDay && activeCategories.gallery && galleryMatchesDanjiFilter() && showClosedToggle;
      if(showClosed) el.className += " gclosed";
      const cellDate = new Date(y, m-1, d);
      if(cellDate.getTime()===today.getTime()) el.className += " today";
      el.innerHTML = "<div class='date'>"+d+"</div>";
      const badges = document.createElement("div");
      badges.className = "badges";
      if(info){
        if(showClosed) badges.innerHTML += "<div class='b closed'>휴</div>";
        if(hasGalleryRows && activeCategories.gallery && galleryMatchesDanjiFilter()) badges.innerHTML += "<div class='b gallery'>갤</div>";
        if(info.tour && activeCategories.tour && tourMatchesDanjiFilter(key)) badges.innerHTML += "<div class='b tour'>투</div>";
      }
      el.appendChild(badges);

      // 데스크탑: '투/갤' 배지만 보이지 않고, 현장·방문자·담당자를 바로 읽을 수 있게 표시
      const scheduleList = document.createElement("div");
      scheduleList.className = "desktop-schedule-list";

      function addScheduleItem(kind, time, site, name, manager){
        const item = document.createElement("div");
        item.className = "desktop-schedule-item " + kind;

        const timeEl = document.createElement("span");
        timeEl.className = "desktop-schedule-time";
        timeEl.textContent = (time && time !== "-") ? time : "일정";

        const copy = document.createElement("span");
        copy.className = "desktop-schedule-copy";

        const main = document.createElement("strong");
        main.textContent = [site, name].filter(Boolean).join(" · ");

        const sub = document.createElement("small");
        sub.textContent = manager && manager !== "-" ? ("담당 " + manager) : "담당 미지정";

        copy.appendChild(main);
        copy.appendChild(sub);
        item.appendChild(timeEl);
        item.appendChild(copy);
        scheduleList.appendChild(item);
      }

      if(showClosed){
        const closedItem = document.createElement("div");
        closedItem.className = "desktop-schedule-item closed";
        closedItem.innerHTML = "<span class='desktop-schedule-time'>휴관</span><span class='desktop-schedule-copy'><strong>갤러리 이용 불가</strong><small>일정 확인 필요</small></span>";
        scheduleList.appendChild(closedItem);
      }

      if(activeCategories.gallery && galleryMatchesDanjiFilter() && Array.isArray(GALLERY_ROWS[key])){
        GALLERY_ROWS[key].forEach(r=>{
          const [time, spot, name, plus, manager] = r;
          addScheduleItem("gallery", time, GALLERY_DANJI, name, manager);
        });
      }

      if(activeCategories.tour && Array.isArray(TOUR_ROWS[key])){
        TOUR_ROWS[key].forEach(r=>{
          const [time, danji, ho, name, plus, manager] = r;
          if(activeDanjiFilter.size>0 && !activeDanjiFilter.has(danji)) return;
          addScheduleItem("tour", time, danji, name, manager);
        });
      }

      if(scheduleList.children.length){
        const maxVisible = 3;
        const total = scheduleList.children.length;
        Array.from(scheduleList.children).forEach((node, idx)=>{
          if(idx >= maxVisible) node.style.display = "none";
        });
        if(total > maxVisible){
          const more = document.createElement("div");
          more.className = "desktop-schedule-more";
          more.textContent = "+ " + (total-maxVisible) + "건 더보기";
          scheduleList.appendChild(more);
        }
        el.appendChild(scheduleList);
      }

      const capacity = getCapacityForKey(key);
      if(capacity>0 && info && !showClosed){
        const headcount = computeDateHeadcount(key);
        if(headcount>0){
          const capEl = document.createElement("div");
          if(headcount>=capacity){
            capEl.className = "cap-status full";
            capEl.textContent = "마감";
            const ribbon = document.createElement("div");
            ribbon.className = "cap-ribbon";
            ribbon.textContent = "마감";
            el.appendChild(ribbon);
            el.className += " cap-full";
          } else {
            capEl.className = "cap-status";
            capEl.textContent = (capacity-headcount)+"명 남음";
          }
          el.appendChild(capEl);
        }
      }

      el.onclick = ()=>openPreview(key);
      grid.appendChild(el);
    }
    cursor = new Date(y, m, 1);
  }
}

const GALLERY_DANJI = "화랑아파트";
function reorderRow(kind, r){
  if(kind==="gallery"){
    // r = [시간, 자가/픽업, 성함, 동반, 담당]
    const [time, spot, name, plus, manager] = r;
    return [time, GALLERY_DANJI, "-", name, plus, manager, spot];
  } else {
    // r = [시간, 단지, 동호수, 성함/업체, 동반, 담당]
    const [time, danji, ho, name, plus, manager] = r;
    return [time, danji, ho, name, plus, manager, "-"];
  }
}

// 오늘 날짜 기준으로 해당 날짜가 지났는지 판단 (연도는 2026 가정)
function parseKeyDate(key){
  const [m,d] = key.split("-").map(Number);
  return new Date(2026, m-1, d);
}
function isPast(key){
  const today = new Date();
  today.setHours(0,0,0,0);
  return parseKeyDate(key) < today;
}

function rowStatus(kind, key, idx){
  const rowKey = kind+"_"+key+"_"+idx;
  if(!isPast(key)) return "scheduled";
  return checkState[rowKey] ? "attended" : "noshow";
}

// ---------- 단지별 토글 필터 (예: 화랑아파트, 14단지, 11단지) ----------
let activeDanjiFilter = new Set(); // 비어있으면 전체 표시
function galleryMatchesDanjiFilter(){
  return activeDanjiFilter.size===0 || activeDanjiFilter.has(GALLERY_DANJI);
}
function tourMatchesDanjiFilter(key){
  if(activeDanjiFilter.size===0) return true;
  const rows = TOUR_ROWS[key];
  if(!rows) return false;
  return rows.some(r=>activeDanjiFilter.has(r[1]));
}
function populateDanjiToggleBar(){
  const danjiSet = new Set([GALLERY_DANJI]);
  Object.values(TOUR_ROWS).forEach(rows=>rows.forEach(r=>danjiSet.add(r[1])));
  const names = [...danjiSet].sort();
  const bar = document.getElementById("danjiToggleBar");
  bar.innerHTML = names.map(name=>
    "<span class='toggle' id='danjiTog-"+name+"' onclick=\"toggleDanjiFilter('"+name+"')\"><i class='dot danji' id='danjiDot-"+name+"'></i>"+name+"</span>"
  ).join("");
}
function toggleDanjiFilter(name){
  if(activeDanjiFilter.has(name)) activeDanjiFilter.delete(name);
  else activeDanjiFilter.add(name);

  html += "<table><thead><tr>" + headers.map(h=>"<th>"+h+"</th>").join("") + "</tr></thead><tbody>";

const STATUS_LABELS = {attended:"참석", noshow:"불참", scheduled:"예정"};
function renderStatusTable(kind, key, status, managerFilter){

    idxList.push(idx);
  });
  if(idxList.length===0) return "";
  const tagClass = kind==="gallery" ? "gallery" : "tour";
  const tagLabel = kind==="gallery" ? CAT_LABEL.gallery : CAT_LABEL.tour;
  let html = "<div class='sub-title'><span class='tag "+tagClass+"'>"+tagLabel+"</span></div>";
  html += "<div class='table-scroll'><table><thead><tr>"+
    ["시간","단지명","동호수","성함","동반","담당","픽업<br>자가","확인"].map(h=>"<th>"+h+"</th>").join("")+
    "</tr></thead><tbody>";
  idxList.forEach(idx=>{
    const raw = rows[idx];
    const r = reorderRow(kind, raw);
    const rowKey = kind+"_"+key+"_"+idx;

    const hasMemo = !!personMemos[rowKey];
    html += "<tr class='"+status+"'>";
    r.forEach((v,ci)=>{

        html += "<td class='name'><span class='memo-name"+(hasMemo?" has-memo":"")+"' onclick=\"openMemoFormFromStatus('"+rowKey+"','"+v.replace(/'/g,"&#39;")+"','"+status+"','"+(managerFilter?managerFilter.replace(/'/g,"&#39;"):"")+"')\">"+v+(hasMemo?" <span class='memo-dot'>●</span>":"")+"</span></td>";
      } else {
        html += "<td class='name'>"+v+"</td>";
      }
    });
    html += "<td><input type='checkbox' "+(isChecked?"checked":"")+
      " onchange=\"toggleCheckFromStatus('"+kind+"','"+key+"',"+idx+",this,'"+status+"','"+(managerFilter?managerFilter.replace(/'/g,"&#39;"):"")+"')\"></td>";
    html += "</tr>";

function toggleCheckFromStatus(kind, key, idx, el, status, managerFilter){
  toggleCheck(kind, key, idx, el);

function openStatusPreview(status, managerFilter){
  managerFilter = managerFilter || null;
  const dateKeys = new Set();
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((r,idx)=>{
      if(rowStatus("gallery",key,idx)!==status) return;
      if(managerFilter && r[4]!==managerFilter) return;
      dateKeys.add(key);
    });
  });
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((r,idx)=>{
      if(rowStatus("tour",key,idx)!==status) return;
      if(managerFilter && r[5]!==managerFilter) return;
      dateKeys.add(key);
    });
  });
  const sortedKeys = [...dateKeys].sort((a,b)=>parseKeyDate(a)-parseKeyDate(b));

  let totalCount = 0;
  let html = "";
  sortedKeys.forEach(key=>{
    const gHtml = renderStatusTable("gallery", key, status, managerFilter);
    const tHtml = renderStatusTable("tour", key, status, managerFilter);
    if(!gHtml && !tHtml) return;
    const gCount = (GALLERY_ROWS[key]||[]).filter((r,idx)=>rowStatus("gallery",key,idx)===status && (!managerFilter || r[4]===managerFilter)).length;
    const tCount = (TOUR_ROWS[key]||[]).filter((r,idx)=>rowStatus("tour",key,idx)===status && (!managerFilter || r[5]===managerFilter)).length;
    totalCount += gCount + tCount;
    html += "<div class='print-date-block'><div class='print-date-title'>"+labelFor(key)+"</div>"+gHtml+tHtml+"</div>";
  });

  const titlePrefix = managerFilter ? (managerFilter+" · ") : "";
  document.getElementById("statusTitle").textContent = titlePrefix+STATUS_LABELS[status]+" 인원 ("+totalCount+"명)";
  document.getElementById("statusBody").innerHTML = html || "<div class='empty-msg'>해당 인원이 없습니다.</div>";
  document.getElementById("statusOverlay").classList.add("on");
}

}

// ---------- 담당자별 집계 ----------
let selectedDanji = new Set();   // 비어있으면 전체 표시
let selectedManagers = new Set();

function computeManagerTally(){
  const tally = {};
  function bump(manager, status, danji){
    if(!manager) return;
    if(!tally[manager]) tally[manager] = {attended:0, noshow:0, scheduled:0, danji:new Set()};
    tally[manager][status]++;
    if(danji) tally[manager].danji.add(danji);
  }
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((r, idx)=>{
      const manager = r[4];
      const status = rowStatus("gallery", key, idx);
      bump(manager, status, GALLERY_DANJI);
    });
  });
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((r, idx)=>{
      const manager = r[5];
      const danji = r[1];
      const status = rowStatus("tour", key, idx);
      bump(manager, status, danji);
    });
  });
  return tally;
}

function populateManagerColDropdowns(){
  const tally = computeManagerTally();
  const allDanji = new Set();

function danjiSortKey(danjiLabel){
  // 화랑아파트가 항상 먼저, 그 다음 단지 숫자 오름차순
  const first = (danjiLabel||"").split("/")[0];
  if(first.includes("화랑")) return -1;
  const m = first.match(/(\d+)/);
  return m ? parseInt(m[1],10) : 999;
}

// "김진숙·오지현" 같은 공동담당은 마지막 이름 기준으로 정렬 (해당 개인 담당자 바로 아래에 위치)
function managerSortName(name){
  const parts = name.split(/[·,]/).map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts[parts.length-1] : name;
}

function updateManagerTable(){
  const tally = computeManagerTally();
  const names = Object.keys(tally).sort((a,b)=>{
    const da = [...tally[a].danji].join("/");
    const db = [...tally[b].danji].join("/");
    const ka = danjiSortKey(da), kb = danjiSortKey(db);
    if(ka!==kb) return ka-kb;
    const sa = managerSortName(a), sb = managerSortName(b);
    if(sa!==sb) return sa.localeCompare(sb, "ko");
    const aCombined = a !== sa;
    const bCombined = b !== sb;
    if(aCombined !== bCombined) return aCombined ? 1 : -1; // 공동담당은 개인 담당자 다음
    return a.localeCompare(b, "ko");
  });

  let html = "<table class='manager-table'><thead><tr><th>No</th><th>단지명</th><th>담당자</th><th>참석</th><th>예정</th><th>불참</th><th>합계</th></tr></thead><tbody>";
  let rowNum = 0;
  names.forEach(name=>{
    const t = tally[name];
    const danjiLabel = [...t.danji].join("/");
    if(selectedManagers.size>0 && !selectedManagers.has(name)) return;
    if(selectedDanji.size>0 && ![...t.danji].some(d=>selectedDanji.has(d))) return;
    rowNum++;
    const total = t.attended + t.noshow + t.scheduled;
    const nameEsc = name.replace(/'/g,"&#39;");
    html += "<tr><td>"+rowNum+"</td><td class='mdanji'>"+danjiLabel+"</td><td class='mname'>"+name+"</td>"+
      "<td class='m-attended clickable-count' onclick=\"openStatusPreview('attended','"+nameEsc+"')\">"+t.attended+"</td>"+
      "<td class='m-scheduled clickable-count' onclick=\"openStatusPreview('scheduled','"+nameEsc+"')\">"+t.scheduled+"</td>"+
      "<td class='m-noshow clickable-count' onclick=\"openStatusPreview('noshow','"+nameEsc+"')\">"+t.noshow+"</td>"+
      "<td>"+total+"</td></tr>";
  });
  if(rowNum===0){
    html += "<tr><td colspan='7' style='color:var(--sub);padding:12px;'>조건에 맞는 담당자가 없습니다.</td></tr>";
  }
  html += "</tbody></table>";
  document.getElementById("managerTable").innerHTML = html;
}

// ---------- 요일별 참석 현황 차트 ----------
function updateStatsChart(){
  const week = WEEKS[currentChartWeek] || [];
  const labelEl = document.getElementById("chartWeekLabel");
  if(labelEl) labelEl.textContent = (currentChartWeek+1)+"주차";

  const counts = week.map(([key])=>computeDateHeadcount(key));
  const maxCount = Math.max(1, ...counts);
  let html = "<div class='chart-bars'>";
  week.forEach(([key,label],i)=>{
    const count = counts[i];
    const barHeight = count>0 ? Math.max(6, Math.round((count/maxCount)*40)) : 2;
    const m = label.match(/\(([^)]+)\)/);
    const dowLabel = m ? m[1] : "";
    html += "<div class='chart-col' onclick=\"openPreview('"+key+"')\" title='"+label+" · "+count+"명'>"+
      "<div class='chart-count'>"+(count>0?count:"")+"</div>"+
      "<div class='chart-bar-wrap'><div class='chart-bar' style='height:"+barHeight+"px;'></div></div>"+
      "<div class='chart-label'>"+dowLabel+"</div>"+
      "</div>";
  });
  html += "</div>";
  document.getElementById("statsChart").innerHTML = html;
}
function prevChartWeek(){
  if(currentChartWeek>0){ currentChartWeek--; updateStatsChart(); }
}
function nextChartWeek(){
  if(currentChartWeek<WEEKS.length-1){ currentChartWeek++; updateStatsChart(); }
}

function statusLabel(s){
  return s==="attended" ? "참석" : (s==="noshow" ? "불참" : "예정");
}
function exportExcel(){
  const managerIdxG = 4, managerIdxT = 5;
  const passesManagerFilter = (raw, idxKind)=>{
    if(selectedManagers.size===0) return true;
    const m = idxKind==="gallery" ? raw[managerIdxG] : raw[managerIdxT];
    return selectedManagers.has(m);
  };
  const passesDanjiFilter = (raw, idxKind)=>{
    if(selectedDanji.size===0) return true;
    const d = idxKind==="gallery" ? GALLERY_DANJI : raw[1];
    return selectedDanji.has(d);
  };

  const galleryData = [["날짜","시간","단지명","동호수","성함","동반","담당","픽업/자가","상태"]];
  Object.keys(GALLERY_ROWS).forEach(key=>{
    GALLERY_ROWS[key].forEach((raw, idx)=>{
      if(!passesManagerFilter(raw,"gallery") || !passesDanjiFilter(raw,"gallery")) return;
      const r = reorderRow("gallery", raw);
      const status = statusLabel(rowStatus("gallery", key, idx));
      galleryData.push([labelFor(key), ...r, status]);
    });
  });
  const tourData = [["날짜","시간","단지명","동호수","성함/업체","동반","담당","픽업/자가","상태"]];
  Object.keys(TOUR_ROWS).forEach(key=>{
    TOUR_ROWS[key].forEach((raw, idx)=>{
      if(!passesManagerFilter(raw,"tour") || !passesDanjiFilter(raw,"tour")) return;
      const r = reorderRow("tour", raw);
      const status = statusLabel(rowStatus("tour", key, idx));
      tourData.push([labelFor(key), ...r, status]);
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(galleryData), CAT_LABEL.gallery.slice(0,31));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tourData), "신반포21차");
  const suffix = (selectedManagers.size>0 || selectedDanji.size>0) ? "_필터적용" : "";
  XLSX.writeFile(wb, "통합일정표_체크결과"+suffix+".xlsx");
}

// 동반 표기에서 인원 수 추출: "외2명"→2, "오영순+1"→1, 그 외/-→0
function parseCompanionCount(str){
  if(!str) return 0;
  let m = str.match(/외\s*(\d+)\s*명/);
  if(m) return parseInt(m[1],10);
  m = str.match(/\+\s*(\d+)/);
  if(m) return parseInt(m[1],10);
  return 0;
}
function computeDateHeadcount(key){
  let total = 0;
  (GALLERY_ROWS[key]||[]).forEach(r=>{ total += 1 + parseCompanionCount(r[3]); }); // r=[time,spot,name,plus,manager]
  (TOUR_ROWS[key]||[]).forEach(r=>{ total += 1 + parseCompanionCount(r[4]); }); // r=[time,danji,ho,name,plus,manager]
  return total;
}

<script id="calendar-mobile-v3-function-fixes">
(function(){
  const KO_DOW = ["일","월","화","수","목","금","토"];

  function safeText(v){ return escText(String(v == null ? "" : v)); }
  function keyForDate(d){ return (d.getMonth()+1)+"-"+d.getDate(); }
  function dateForKey(key){
    const parts=String(key||"").split("-").map(Number);
    const baseYear = (range && range.start) ? Number(String(range.start).slice(0,4)) : 2026;
    return new Date(baseYear, (parts[0]||1)-1, parts[1]||1);
  }
  function entryForDate(d){
    return [keyForDate(d), (d.getMonth()+1)+"월 "+d.getDate()+"일("+KO_DOW[d.getDay()]+")"];
  }
  function getRangeDateEntries(){
    const s = new Date(range.start+"T00:00:00");
    const e = new Date(range.end+"T00:00:00");
    if(isNaN(s)||isNaN(e)||s>e) return [];
    const result=[];
    const cur=new Date(s);
    let guard=0;
    while(cur<=e && guard<400){ result.push(entryForDate(cur)); cur.setDate(cur.getDate()+1); guard++; }
    return result;
  }
  function getRangeWeeks(){
    const entries=getRangeDateEntries();
    if(!entries.length) return [];
    const s=new Date(range.start+"T00:00:00");
    const e=new Date(range.end+"T00:00:00");
    const first=new Date(s);
    const offset=(first.getDay()+6)%7;
    first.setDate(first.getDate()-offset);
    const weeks=[];
    let ws=new Date(first), guard=0;
    while(ws<=e && guard<60){
      const items=[];
      for(let i=0;i<7;i++){
        const d=new Date(ws); d.setDate(ws.getDate()+i);
        if(d>=s && d<=e) items.push(entryForDate(d)); else items.push(null);
      }
      weeks.push(items); ws.setDate(ws.getDate()+7); guard++;
    }
    return weeks;
  }
  function weekLabel(items){
    const valid=items.filter(Boolean);
    if(!valid.length) return "";
    const first=dateForKey(valid[0][0]), last=dateForKey(valid[valid.length-1][0]);
    return (first.getMonth()+1)+"."+first.getDate()+" ~ "+(last.getMonth()+1)+"."+last.getDate();
  }

  // 이전 편집 과정에서 카테고리명이 빈 값으로 저장된 경우 자동 복구
  if(!CAT_LABEL || typeof CAT_LABEL!=="object") CAT_LABEL={gallery:"갤러리",tour:"21차투어"};
  let catChanged=false;
  if(!String(CAT_LABEL.gallery||"").trim()){ CAT_LABEL.gallery="갤러리"; catChanged=true; }
  if(!String(CAT_LABEL.tour||"").trim()){ CAT_LABEL.tour="21차투어"; catChanged=true; }
  if(catChanged) persistCatLabel();
  const lg=document.getElementById("labelGallery"), lt=document.getElementById("labelTour");
  if(lg) lg.textContent=CAT_LABEL.gallery;
  if(lt) lt.textContent=CAT_LABEL.tour;

  // 날짜 제목은 ALL_DATES 고정 배열에 없어도 현재 연도 기준으로 정상 표시
  labelFor = function(key){
    const d=dateForKey(key);
    if(isNaN(d)) return key;
    return (d.getMonth()+1)+"월 "+d.getDate()+"일("+KO_DOW[d.getDay()]+")";
  };

  // 날짜 선택 목록은 현재 지정한 기간에서 동적으로 생성
  populateFilter = function(){
    const sel=document.getElementById("dateFilter");
    if(!sel) return;
    const entries=getRangeDateEntries();
    sel.innerHTML="";
    entries.forEach(([k,label])=>{
      const opt=document.createElement("option");
      opt.value=k;
      opt.textContent=label+((GALLERY_ROWS[k]||TOUR_ROWS[k]||GALLERY_CLOSED[k])?"":"  (일정없음)");
      sel.appendChild(opt);
    });
    const keys=entries.map(v=>v[0]);
    if(!keys.includes(currentDateKey)){
      const today=new Date();
      const todayKey=keyForDate(today);
      currentDateKey=keys.includes(todayKey)?todayKey:(keys[0]||currentDateKey);
    }
    if(currentDateKey) sel.value=currentDateKey;
    sel.onchange=()=>selectDate(sel.value,false);
  };

  const oldApplyRange=applyRange;
  applyRange = function(){
    const s=document.getElementById("rangeStart").value;
    const e=document.getElementById("rangeEnd").value;
    const errEl=document.getElementById("rangeErr");
    if(!s||!e){ errEl.textContent="시작일과 종료일을 모두 선택해주세요."; return; }
    if(s>e){ errEl.textContent="종료일이 시작일보다 빠릅니다."; return; }
    errEl.textContent="";
    range={start:s,end:e};
    persistRange();
    buildCalendarArea();
    currentChartWeek=0;
    populateFilter();
    if(currentDateKey) selectDate(currentDateKey,false);
    updateStatsChart();
  };

  prevDate = function(){
    const entries=getRangeDateEntries();
    const idx=entries.findIndex(v=>v[0]===currentDateKey);
    if(idx>0) selectDate(entries[idx-1][0],false);
  };
  nextDate = function(){
    const entries=getRangeDateEntries();
    const idx=entries.findIndex(v=>v[0]===currentDateKey);
    if(idx>=0 && idx<entries.length-1) selectDate(entries[idx+1][0],false);
  };

  updateStatsChart = function(){
    const weeks=getRangeWeeks();
    if(currentChartWeek>=weeks.length) currentChartWeek=Math.max(0,weeks.length-1);
    const week=weeks[currentChartWeek]||[];
    const labelEl=document.getElementById("chartWeekLabel");
    if(labelEl) labelEl.textContent=weekLabel(week)||"-";
    const valid=week.filter(Boolean);
    const counts=valid.map(v=>computeDateHeadcount(v[0]));
    const maxCount=Math.max(1,...counts);
    let html="<div class='chart-bars'>";
    week.forEach(item=>{
      if(!item){ html+="<div class='chart-col chart-empty-col'></div>"; return; }
      const key=item[0], label=item[1];
      const count=computeDateHeadcount(key);
      const barHeight=count>0?Math.max(6,Math.round((count/maxCount)*40)):2;
      const m=label.match(/\(([^)]+)\)/), dowLabel=m?m[1]:"";
      const kp=String(key).split("-");
      const dayNum=kp.length>1?parseInt(kp[1],10):"";
      const dayText=dayNum?(dayNum+"일("+dowLabel+")"):dowLabel;
      html+="<div class='chart-col' onclick=\"openPreview('"+key+"')\" title='"+label+" · "+count+"명'>"+
        "<div class='chart-count'>"+(count>0?count:"")+"</div>"+
        "<div class='chart-bar-wrap'><div class='chart-bar' style='height:"+barHeight+"px;'></div></div>"+
        "<div class='chart-label'>"+dayText+"</div></div>";
    });
    html+="</div>";
    const chart=document.getElementById("statsChart"); if(chart) chart.innerHTML=html;
  };
  prevChartWeek = function(){ if(currentChartWeek>0){ currentChartWeek--; updateStatsChart(); } };
  nextChartWeek = function(){ const weeks=getRangeWeeks(); if(currentChartWeek<weeks.length-1){ currentChartWeek++; updateStatsChart(); } };

  // 모바일/PC 공용 미리보기 마크업 정리 — 모바일에서는 카드형 바텀시트로 표시
  openPreview = function(key){
    previewKey=key;
    const title=document.getElementById("modalTitle");
    if(title) title.textContent=labelFor(key);
    const body=document.getElementById("modalBody");
    let html="";

    if(GALLERY_CLOSED[key]){
      html+="<div class='preview-closed'><span>휴관 / 이용 불가</span><strong>"+safeText(GALLERY_CLOSED[key])+"</strong></div>";
    } else if(GALLERY_ROWS[key] && GALLERY_ROWS[key].length){
      html+="<section class='preview-group'><div class='preview-group-head'><span class='preview-kind gallery'>"+safeText(CAT_LABEL.gallery)+"</span><span class='preview-group-count'>"+GALLERY_ROWS[key].length+"팀</span></div><div class='preview-list'>";
      GALLERY_ROWS[key].forEach((r,idx)=>{
        const time=r[0], spot=r[1], name=r[2], plus=r[3], manager=r[4];
        const sub=[plus&&plus!=="-"?plus:"",manager?"담당 "+manager:"",spot&&spot!=="-"?spot:""].filter(Boolean).join(" · ");
        html+="<div class='preview-item'><div class='preview-item-main'><div class='preview-item-title'><span class='preview-time'>"+safeText(time)+"</span><strong>"+safeText(name)+"</strong></div><div class='preview-item-sub'>"+safeText(sub)+"</div></div><button class='row-del' onclick=\"deleteEntry('gallery','"+key+"',"+idx+",this)\">삭제</button></div>";
      });
      html+="</div></section>";
    }

    if(TOUR_ROWS[key] && TOUR_ROWS[key].length){
      html+="<section class='preview-group'><div class='preview-group-head'><span class='preview-kind tour'>"+safeText(CAT_LABEL.tour)+"</span><span class='preview-group-count'>"+TOUR_ROWS[key].length+"팀</span></div><div class='preview-list'>";
      TOUR_ROWS[key].forEach((r,idx)=>{
        const time=r[0], danji=r[1], ho=r[2], name=r[3], plus=r[4], manager=r[5];
        const place=(ho&&ho!=="-")?(danji+" "+ho):danji;
        const titleText=[place,name].filter(Boolean).join(" · ");
        const sub=[plus&&plus!=="-"?plus:"",manager?"담당 "+manager:""].filter(Boolean).join(" · ");
        html+="<div class='preview-item'><div class='preview-item-main'><div class='preview-item-title'><span class='preview-time'>"+safeText(time)+"</span><strong>"+safeText(titleText)+"</strong></div><div class='preview-item-sub'>"+safeText(sub)+"</div></div><button class='row-del' onclick=\"deleteEntry('tour','"+key+"',"+idx+",this)\">삭제</button></div>";
      });
      html+="</div></section>";
    }

    if(!GALLERY_CLOSED[key] && !(GALLERY_ROWS[key]&&GALLERY_ROWS[key].length) && !(TOUR_ROWS[key]&&TOUR_ROWS[key].length)){
      html+="<div class='preview-empty'>등록된 일정이 없습니다.</div>";
    }

    const isClosed=!!GALLERY_CLOSED[key];
    const capForKey=getCapacityForKey(key);
    const headcountForKey=computeDateHeadcount(key);
    html+="<div class='cap-info-line'><span class='cap-summary'><span>정원</span><strong>"+(capForKey>0?capForKey+"명":"미설정")+(headcountForKey>0?" · 현재 "+headcountForKey+"명":"")+"</strong></span><span class='mini-action' onclick=\"openDateCapacitySettings()\">이 날짜만 설정</span></div>";
    html+="<div class='preview-actions'>"+
      "<button onclick=\"addEntryFlow('gallery')\">+ "+safeText(CAT_LABEL.gallery)+"</button>"+
      "<button onclick=\"addEntryFlow('tour')\">+ "+safeText(CAT_LABEL.tour)+"</button>"+
      "<button class='"+(isClosed?"on":"")+"' onclick=\"toggleClosedDay()\">"+(isClosed?"휴관 해제":"휴관 지정")+"</button>"+
      "<button class='primary' onclick=\"openInChecklist()\">체크리스트</button></div>";
    body.innerHTML=html;
    document.getElementById("overlay").classList.add("on");
  };

  // 범위가 저장돼 있어도 날짜 선택/요일차트가 과거 8월에 남아 있지 않도록 즉시 동기화
  populateFilter();
  const entries=getRangeDateEntries();
  if(entries.length){
    const keys=entries.map(v=>v[0]);
    if(!keys.includes(currentDateKey)) currentDateKey=keys[0];
    selectDate(currentDateKey,false);
  }
  updateStatsChart();
  buildCalendarArea();
})();
</script>

<script id="calendar-mobile-v4-canva-js">
(function(){
  function isMobileV4(){ return window.matchMedia && window.matchMedia('(max-width:560px)').matches; }
  function esc(v){ return escText(String(v == null ? '' : v)); }
  function statusLabelMobile(kind,key,idx){
    const s=rowStatus(kind,key,idx);
    if(s==='attended') return '참석';
    if(s==='noshow') return '불참';
    return '예정';
  }
  function visibleRows(kind,key,rows){
    if(!rows||!rows.length) return [];
    const managerIdx=kind==='gallery'?4:5;
    const danjiOf=(raw)=>kind==='gallery'?GALLERY_DANJI:raw[1];
    const out=[];
    rows.forEach((raw,idx)=>{
      const managerOk=!managerFilterValue||raw[managerIdx]===managerFilterValue;
      const danjiOk=activeDanjiFilter.size===0||activeDanjiFilter.has(danjiOf(raw));
      if(managerOk&&danjiOk) out.push([raw,idx]);
    });
    return out;
  }
  window.mobileV4ToggleCheck=function(kind,key,idx,el){
    const rowKey=kind+'_'+key+'_'+idx;
    checkState[rowKey]=!!el.checked;
    persistCheck();
    updateSummary();updateManagerTable();updateStatsChart();
    selectDate(key,false);
  };
  function cardHtml(kind,key,raw,idx){
    const rowKey=kind+'_'+key+'_'+idx;
    const checked=!!checkState[rowKey];
    const st=rowStatus(kind,key,idx);
    let time='',title='',sub='';
    if(kind==='gallery'){
      const [t,spot,name,plus,manager]=raw;time=t;
      title=[GALLERY_DANJI,name].filter(Boolean).join(' · ');
      sub=[plus&&plus!=='-'?plus:'',manager?'담당 '+manager:'',spot&&spot!=='-'?spot:''].filter(Boolean).join(' · ');
    }else{
      const [t,danji,ho,name,plus,manager]=raw;time=t;
      title=[danji,(ho&&ho!=='-'?ho:'')].filter(Boolean).join(' ');
      sub=[name,plus&&plus!=='-'?plus:'',manager?'담당 '+manager:''].filter(Boolean).join(' · ');
    }
    const hasMemo=!!personMemos[rowKey];
    const label=statusLabelMobile(kind,key,idx);
    return "<div class='mobile-entry-card "+kind+"'>"+
      "<div class='mobile-entry-time'>"+esc(time)+"</div>"+
      "<div class='mobile-entry-main'><div class='mobile-entry-title'>"+esc(title)+(hasMemo?" <span class='memo-dot'>●</span>":"")+"</div><div class='mobile-entry-sub'>"+esc(sub)+"</div></div>"+
      "<label class='mobile-status-check "+(checked?'checked':st)+"'><input type='checkbox' "+(checked?'checked':'')+" onchange=\"mobileV4ToggleCheck('"+kind+"','"+key+"',"+idx+",this)\"><span>"+label+"</span></label>"+
      "</div>";
  }
  function renderCards(kind,key,rows){
    const vr=visibleRows(kind,key,rows); if(!vr.length) return '';
    return "<div class='mobile-checklist-list'>"+vr.map(([raw,idx])=>cardHtml(kind,key,raw,idx)).join('')+"</div>";
  }

  const desktopSelectDate=selectDate;
  selectDate=function(key,scroll){
    if(!isMobileV4()) return desktopSelectDate(key,scroll);
    currentDateKey=key;
    const sel=document.getElementById('dateFilter');if(sel) sel.value=key;
    document.querySelectorAll('.cell.active').forEach(c=>c.classList.remove('active'));
    const calCell=document.getElementById('cal-'+key);if(calCell) calCell.classList.add('active');
    const body=document.getElementById('checklistBody');if(!body) return;
    let html='';
    if(GALLERY_CLOSED[key]&&activeCategories.gallery&&showClosedToggle){html+="<div class='closed-banner'>"+esc(GALLERY_CLOSED[key])+"</div>";}
    if(activeCategories.gallery) html+=renderCards('gallery',key,GALLERY_ROWS[key]);
    if(activeCategories.tour) html+=renderCards('tour',key,TOUR_ROWS[key]);
    if(!html) html="<div class='empty-day'>표시할 일정이 없습니다.</div>";
    body.innerHTML=html;
    if(scroll){document.querySelector('.checklist-section').scrollIntoView({behavior:'smooth',block:'start'});}
  };

  openPreview=function(key){
    previewKey=key;
    const title=document.getElementById('modalTitle');if(title) title.textContent=labelFor(key);
    const body=document.getElementById('modalBody');if(!body) return;
    let items=[];
    if(GALLERY_ROWS[key]) GALLERY_ROWS[key].forEach((r,idx)=>items.push({kind:'gallery',r,idx}));
    if(TOUR_ROWS[key]) TOUR_ROWS[key].forEach((r,idx)=>items.push({kind:'tour',r,idx}));
    let html='';
    if(GALLERY_CLOSED[key]) html+="<div class='preview-closed'><span>휴관 / 이용 불가</span><strong>"+esc(GALLERY_CLOSED[key])+"</strong></div>";
    if(items.length){
      html+="<div class='preview-flat-list'>";
      items.forEach(it=>{
        let time='',ttl='',sub='';
        if(it.kind==='gallery'){
          const [t,spot,name,plus,manager]=it.r; time=t; ttl=[GALLERY_DANJI,name].filter(Boolean).join(' · '); sub=[plus&&plus!=='-'?plus:'',manager?'담당 '+manager:'',spot&&spot!=='-'?spot:''].filter(Boolean).join(' · ');
        }else{
          const [t,danji,ho,name,plus,manager]=it.r; time=t; ttl=[danji,(ho&&ho!=='-'?ho:'')].filter(Boolean).join(' '); sub=[name,plus&&plus!=='-'?plus:'',manager?'담당 '+manager:''].filter(Boolean).join(' · ');
        }
        html+="<div class='preview-flat-item'><i class='preview-flat-dot "+it.kind+"'></i><div class='preview-flat-time'>"+esc(time)+"</div><div class='preview-flat-main'><div class='preview-flat-title'>"+esc(ttl)+"</div><div class='preview-flat-sub'>"+esc(sub)+"</div></div><button class='row-del' onclick=\"deleteEntry('"+it.kind+"','"+key+"',"+it.idx+",this)\">삭제</button></div>";
      });
      html+="</div>";
    }else if(!GALLERY_CLOSED[key]) html+="<div class='preview-empty'>등록된 일정이 없습니다.</div>";
    const isClosed=!!GALLERY_CLOSED[key],cap=getCapacityForKey(key),head=computeDateHeadcount(key);
    html+="<div class='cap-info-line'><span class='cap-summary'>정원 <strong>"+(cap>0?cap+'명':'미설정')+(head>0?' · 현재 '+head+'명':'')+"</strong></span><span class='mini-action' onclick=\"openDateCapacitySettings()\">이 날짜만 설정 ›</span></div>";
    html+="<div class='preview-actions'><button onclick=\"addEntryFlow('gallery')\">+ "+esc(CAT_LABEL.gallery)+"</button><button onclick=\"addEntryFlow('tour')\">+ "+esc(CAT_LABEL.tour)+"</button><button class='"+(isClosed?'on':'')+"' onclick=\"toggleClosedDay()\">"+(isClosed?'휴관 해제':'휴관 지정')+"</button><button class='primary' onclick=\"openInChecklist()\">체크리스트</button></div>";
    body.innerHTML=html;document.getElementById('overlay').classList.add('on');
  };

  // Generic subtitle for the redesigned mobile header, but preserve user-custom text.
  const sub=document.getElementById('siteSubtitle');
  if(sub && /갤러리\s*&.*21차.*투어/.test(sub.textContent||'')) sub.textContent='언제 · 어느 현장 · 누가 오는지 한눈에 확인하세요.';

  // Re-render once after overrides install.
  if(isMobileV4() && currentDateKey) selectDate(currentDateKey,false);
})();
</script>

<script id="calendar-mobile-v11-js">
(function(){
  function mobile(){return window.matchMedia&&window.matchMedia('(max-width:560px)').matches;}
  function fmtMonth(){try{var v=(document.getElementById('rangeStart')||{}).value||'';if(!v)return'';var p=v.split('-');return Number(p[0])+'년 '+Number(p[1])+'월';}catch(e){return'';}}
  function addRangeMonth(){if(!mobile())return;var r=document.querySelector('.rangebar');if(!r)return;var b=r.querySelector('.mobile-range-month');if(!b){b=document.createElement('span');b.className='mobile-range-month';r.insertBefore(b,r.firstChild);}b.textContent=fmtMonth();}
  function shiftMonth(delta){try{var s=document.getElementById('rangeStart'),e=document.getElementById('rangeEnd');var base=s&&s.value?new Date(s.value+'T00:00:00'):new Date();var first=new Date(base.getFullYear(),base.getMonth()+delta,1);var last=new Date(first.getFullYear(),first.getMonth()+1,0);var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};s.value=iso(first);e.value=iso(last);if(typeof applyRange==='function')applyRange();setTimeout(enhance,0);}catch(e){}}
  function monthActions(){if(!mobile())return;document.querySelectorAll('.month-label').forEach(function(l){if(l.querySelector('.mobile-month-actions'))return;var b=document.createElement('span');b.className='mobile-month-actions';var p=document.createElement('button');p.type='button';p.textContent='‹';p.onclick=function(ev){ev.stopPropagation();shiftMonth(-1);};var t=document.createElement('button');t.type='button';t.className='today-btn';t.textContent='오늘';t.onclick=function(ev){ev.stopPropagation();if(typeof setThisMonth==='function')setThisMonth();setTimeout(enhance,0);};var n=document.createElement('button');n.type='button';n.textContent='›';n.onclick=function(ev){ev.stopPropagation();shiftMonth(1);};b.append(p,t,n);l.appendChild(b);});}
  function bottomNav(){if(!mobile()||document.querySelector('.mobile-app-nav'))return;var nav=document.createElement('div');nav.className='mobile-app-nav';nav.innerHTML='<button class="active" data-a="top"><span class="nav-ico">▣</span><span>일정표</span></button><button data-a="gallery"><span class="nav-ico">▤</span><span>갤러리</span></button><button data-a="tour"><span class="nav-ico">◉</span><span>투어</span></button><button data-a="closed"><span class="nav-ico">⌂</span><span>휴관/불가</span></button>';document.body.appendChild(nav);nav.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;nav.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');var a=b.dataset.a;if(a==='top')window.scrollTo({top:0,behavior:'smooth'});if(a==='gallery')document.getElementById('toggleGallery')?.scrollIntoView({behavior:'smooth',block:'center'});if(a==='tour')document.getElementById('toggleTour')?.scrollIntoView({behavior:'smooth',block:'center'});if(a==='closed')document.getElementById('toggleClosed')?.scrollIntoView({behavior:'smooth',block:'center'});});}
  function enhance(){addRangeMonth();monthActions();bottomNav();}
  function init(){enhance();var a=document.getElementById('calendarArea');if(a)new MutationObserver(function(){setTimeout(monthActions,0);}).observe(a,{childList:true});['rangeStart','rangeEnd'].forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('change',function(){setTimeout(addRangeMonth,0);});});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

          <div class="m13-date-card">
            <label>종료일</label>
            <div class="m13-date-line">${svgCal}<span class="m13-date-text" id="m13EndText"></span><input type="date" id="m13End" aria-label="종료일"></div>
          </div>
          <button type="button" class="m13-apply" id="m13Apply">적용</button>
        </div>
      </section>
      <section class="m13-card m13-filters" id="m13Filters"></section>
      <section class="m13-card m13-calendar">
        <div class="m13-cal-head">
          <div class="m13-cal-title" id="m13CalTitle"></div>
          <div class="m13-cal-actions">
            <button type="button" id="m13Prev">‹</button>
            <button type="button" class="today" id="m13Today">오늘</button>
            <button type="button" id="m13Nxt">›</button>
          </div>
        </div>
        <div class="m13-site-row" id="m13SiteRow"></div>
        <div class="m13-weekdays"><div class="m13-weekday sun">일</div><div class="m13-weekday">월</div><div class="m13-weekday">화</div><div class="m13-weekday">수</div><div class="m13-weekday">목</div><div class="m13-weekday">금</div><div class="m13-weekday sat">토</div></div>
        <div class="m13-days" id="m13Days"></div>
      </section>
      <section class="m13-card m13-manager" id="m13Manager">
        <div class="m13-manager-ico">${svgPeople}</div>
        <div class="m13-manager-copy">
          <div class="m13-manager-title">담당자별 현황</div>
          <div class="m13-manager-sub" id="m13ManagerSub"></div>
        </div>
        <div class="m13-manager-arr">›</div>
      </section>`;
    bindShell();
    ensureNav();
  }

  function ensureNav(){
    let nav=document.getElementById('mobileMockNav');
    if(!nav){ nav=document.createElement('nav'); nav.id='mobileMockNav'; document.body.appendChild(nav); }
    nav.innerHTML=`
      <button class="m13-nav-btn active" data-a="top">${icons.schedule}<span>일정표</span></button>
      <button class="m13-nav-btn" data-a="gallery">${icons.gallery}<span>갤러리</span></button>
      <button class="m13-nav-btn" data-a="tour">${icons.tour}<span>투어</span></button>
      <button class="m13-nav-btn" data-a="closed">${icons.closed}<span>휴관/불가</span></button>`;
    nav.onclick=(e)=>{
      const b=e.target.closest('button'); if(!b) return;
      nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
      const a=b.dataset.a;
      if(a==='top') window.scrollTo({top:0,behavior:'smooth'});
      else if(a==='gallery'){ if(!activeCategories.gallery) toggleCategory('gallery'); document.getElementById('m13Filters')?.scrollIntoView({behavior:'smooth',block:'center'}); }
      else if(a==='tour'){ if(!activeCategories.tour) toggleCategory('tour'); document.getElementById('m13Filters')?.scrollIntoView({behavior:'smooth',block:'center'}); }
      else if(a==='closed'){ if(!showClosedToggle) toggleClosedFilter(); document.getElementById('m13Filters')?.scrollIntoView({behavior:'smooth',block:'center'}); }
      setTimeout(renderShell,0);
    };
  }

  function bindShell(){
    const rs=document.getElementById('m13Start');
    const re=document.getElementById('m13End');
    rs.onchange=()=>{document.getElementById('m13StartText').textContent=prettyDate(rs.value);};
    re.onchange=()=>{document.getElementById('m13EndText').textContent=prettyDate(re.value);};
    document.getElementById('m13Apply').onclick=()=>{
      document.getElementById('rangeStart').value=rs.value;
      document.getElementById('rangeEnd').value=re.value;
      applyRange();
      setTimeout(renderShell,0);
    };
    document.getElementById('m13This').onclick=()=>shiftMonth(-1);
    document.getElementById('m13Next').onclick=()=>{ setNextMonth(); setTimeout(renderShell,0); };
    document.getElementById('m13Prev').onclick=()=>shiftMonth(-1);
    document.getElementById('m13Nxt').onclick=()=>shiftMonth(1);
    document.getElementById('m13Today').onclick=()=>{
      const t=new Date();
      const f=new Date(t.getFullYear(),t.getMonth(),1), l=new Date(t.getFullYear(),t.getMonth()+1,0);
      document.getElementById('rangeStart').value=iso(f);
      document.getElementById('rangeEnd').value=iso(l);
      applyRange();
      selectedKey=key(t);
      setTimeout(renderShell,0);
    };
    document.getElementById('m13MonthChip').onclick=()=>{
      const card=document.getElementById('m13RangeCard');
      if(card) card.classList.toggle('range-open');
    };
    const rangeToggle=document.getElementById('m13RangeToggle');
    if(rangeToggle) rangeToggle.onclick=()=>{
      const card=document.getElementById('m13RangeCard');
      if(!card) return;
      const open=card.classList.toggle('range-open');
      rangeToggle.textContent=open?'기간 닫기':'기간 설정';
    };
    document.getElementById('m13Manager').onclick=()=>{
      document.body.classList.toggle('m13-show-details');
      const target=document.querySelector('.checklist-section');
      if(document.body.classList.contains('m13-show-details') && target) setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),30);
    };
  }

  function shiftMonth(delta){
    const b=currentMonthDate();
    const f=new Date(b.getFullYear(), b.getMonth()+delta, 1);
    const l=new Date(f.getFullYear(), f.getMonth()+1, 0);
    document.getElementById('rangeStart').value=iso(f);
    document.getElementById('rangeEnd').value=iso(l);
    applyRange();
    if(selectedKey){ const dt=new Date(f.getFullYear(),f.getMonth(),1); selectedKey=key(dt); }
    setTimeout(renderShell,0);
  }

  function renderFilters(){
    const box=q('#fdFilters');if(!box)return;
    const sites=allSites();
    const rank=n=>{const x=String(n||'');if(x.includes('11'))return 1;if(x.includes('14'))return 2;if(x.includes('화랑'))return 3;return 9};
    const short=n=>{const x=String(n||'');if(x.includes('11'))return '11단지';if(x.includes('14'))return '14단지';if(x.includes('화랑'))return '화랑아파트';return x};
    sites.sort((a,b)=>rank(a)-rank(b)||String(a).localeCompare(String(b),'ko',{numeric:true}));
    const allOn=!siteFilter&&showGallery&&showTour;
    let html=`<div class="fd-filter-group"><span class="fd-filter-group-title">단지</span><div class="fd-filter-items"><button class="fd-chip ${!siteFilter?'on':''}" data-site-all="1">전체</button>`;
    sites.forEach(s=>html+=`<button class="fd-chip ${siteFilter===s?'on':''}" data-site="${esc(s)}">${esc(short(s))}</button>`);
    html+=`</div></div><div class="fd-filter-group"><span class="fd-filter-group-title">일정 종류</span><div class="fd-filter-items"><button class="fd-chip ${showGallery?'on':''}" data-kind="gallery">갤러리</button><button class="fd-chip ${showTour?'on':''}" data-kind="tour">투어</button><button class="fd-chip ${allOn?'on':''}" data-reset="1">전체 초기화</button></div></div>`;
    box.innerHTML=html;
    q('#fdFilterBtn')?.classList.toggle('active',!allOn);
    qa('[data-site-all]',box).forEach(b=>b.onclick=()=>{siteFilter='';render()});
    qa('[data-site]',box).forEach(b=>b.onclick=()=>{siteFilter=(siteFilter===b.dataset.site?'':(b.dataset.site||''));render()});
    qa('[data-kind]',box).forEach(b=>b.onclick=()=>{if(b.dataset.kind==='gallery')showGallery=!showGallery;else showTour=!showTour;render()});
    qa('[data-reset]',box).forEach(b=>b.onclick=()=>{siteFilter='';showGallery=true;showTour=true;render()});
  }
  function renderCalendar(){
    const base=currentMonthDate(), y=base.getFullYear(), m=base.getMonth();
    document.getElementById('m13CalTitle').textContent = y+'년 '+(m+1)+'월';
    const days=document.getElementById('m13Days'); if(!days) return; days.innerHTML='';
    const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay()), today=new Date();
    if(!selectedKey){ selectedKey = (today.getFullYear()===y && today.getMonth()===m) ? key(today) : key(first); }

    const desktop=isDesktop();

    for(let i=0;i<35;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=key(d), other=d.getMonth()!==m, ev=eventFor(k);
      const b=document.createElement('button');
      b.type='button';
      b.className='m13-day '+(other?'other ':'')+(d.getDay()===0?'sun ':'')+(d.getDay()===6?'sat ':'')+((selectedKey===k && !other)?'selected':'');

      let inner=`<span class="m13-daynum">${d.getDate()}</span>`;

      if(!other && desktop){
        const detail=detailedEventsFor(k);
        if(detail.length){
          const show=detail.slice(0,3);
          inner += `<div class="m13-desk-events">`;
          show.forEach(x=>{
            inner += `
              <div class="m13-desk-event ${x.kind}">
                <div class="m13-desk-time">${escapeHtml(x.time)}</div>
                <div class="m13-desk-copy">
                  <strong>${escapeHtml(x.site)}</strong>
                  <span>${escapeHtml(x.name)}</span>
                  <small>${x.manager?('담당 '+escapeHtml(x.manager)):'담당 미지정'}</small>
                </div>
              </div>`;
          });
          if(detail.length>3) inner += `<div class="m13-desk-more">+ ${detail.length-3}건 더보기</div>`;
          inner += `</div>`;
        }
      } else if(!other && ev.length){
        const e0=ev[0];
        inner += `<span class="m13-event ${e0[0]}">${escapeHtml(e0[1])}</span>`;
        if(ev.length>1) inner += `<span class="m13-more">+${ev.length-1}</span>`;
      }

      b.innerHTML=inner;
      b.onclick=()=>{
        if(other){
          const f=new Date(d.getFullYear(), d.getMonth(), 1), l=new Date(d.getFullYear(), d.getMonth()+1, 0);
          document.getElementById('rangeStart').value=iso(f);
          document.getElementById('rangeEnd').value=iso(l);
          applyRange();
        }
        selectedKey=k;
        currentDateKey=k;
        renderShell();
        openPreview(k);
      };
      days.appendChild(b);
    }
  }

  function renderShell(){
    if(!mq()) return;
    ensureShell();
    document.getElementById('m13Title').textContent=(document.getElementById('siteTitle')?.textContent||'(현장명)일정표').trim();
    document.getElementById('m13MonthChip').querySelector('span').textContent=monthText();
    const rs=document.getElementById('rangeStart'), re=document.getElementById('rangeEnd');
    document.getElementById('m13Start').value=rs?.value||'';
    document.getElementById('m13End').value=re?.value||'';
    document.getElementById('m13StartText').textContent=prettyDate(rs?.value||'');
    document.getElementById('m13EndText').textContent=prettyDate(re?.value||'');
    document.getElementById('m13ManagerSub').textContent='총 '+uniqueManagers()+'명의 담당자가 있습니다.';

    // 상단 이번 달 요약
    const base=currentMonthDate(), yy=base.getFullYear(), mm=base.getMonth();
    let gc=0, tc=0;
    const lastDay=new Date(yy,mm+1,0).getDate();
    for(let dd=1; dd<=lastDay; dd++){
      const kk=key(new Date(yy,mm,dd));
      gc += Array.isArray(GALLERY_ROWS[kk]) ? GALLERY_ROWS[kk].length : 0;
      tc += Array.isArray(TOUR_ROWS[kk]) ? TOUR_ROWS[kk].length : 0;
    }
    const hm=document.getElementById('m13HeroMonth');
    if(hm) hm.textContent=(mm+1)+'월 일정';
    const ht=document.getElementById('m13HeroTotal'); if(ht) ht.textContent=gc+tc;
    const hg=document.getElementById('m13HeroGallery'); if(hg) hg.textContent=gc;
    const hto=document.getElementById('m13HeroTour'); if(hto) hto.textContent=tc;

    renderFilters();
    renderSiteFilters();
    renderCalendar();
  }

  const wrapFn=(name)=>{const old=window[name]; if(typeof old!=='function'||old.__m13) return; const f=function(){const r=old.apply(this,arguments); setTimeout(renderShell,0); return r;}; f.__m13=true; window[name]=f;};
  ['applyRange','setThisMonth','setNextMonth','toggleCategory','toggleClosedFilter','toggleDanjiFilter','onScheduleDataChanged'].forEach(wrapFn);

  function init(){ if(mq()) renderShell(); window.addEventListener('resize',()=>{ if(mq()) renderShell(); }); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>




<style id="calendar-desktop-v13-like-mobile">

  }

    height:42px;padding:0 14px;border:1px solid #dce8e6;border-radius:13px;background:#fbfdfd;
    display:inline-flex;align-items:center;gap:8px;color:#35545b;font-size:12px;font-weight:700;white-space:nowrap;
  }
  #mobileMockApp .m13-month-chip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
  #mobileMockApp .m13-range-grid{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 116px;gap:12px;align-items:end}

  }

  #mobileMockApp .m13-filter.gallery i{background:#2dc8b8;border-color:#2dc8b8}
  #mobileMockApp .m13-filter.tour i{background:#ffab4f;border-color:#ffab4f}
  #mobileMockApp .m13-filter.closed i{background:#f57395;border-color:#f57395}
  #mobileMockApp .m13-filter.danji i{background:#cfd6df;border-color:#cfd6df}
  #mobileMockApp .m13-filter.gallery{box-shadow:inset 0 0 0 1px #81d6cc;color:#177f74;background:#f8fffd}
  #mobileMockApp .m13-filter.tour{box-shadow:inset 0 0 0 1px #f4c68d;color:#a9652d;background:#fffaf4}
  #mobileMockApp .m13-filter.closed{box-shadow:inset 0 0 0 1px #f2b4c4;color:#bf5673;background:#fff7fa}
  #mobileMockApp .m13-filter.on.danji{box-shadow:inset 0 0 0 1px #b8d8d3;background:#f9fcfb;color:#416168}

  /* 달력 */
  #mobileMockApp .m13-calendar{grid-column:1/-1;padding:22px 20px 20px}
  #mobileMockApp .m13-cal-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}
  #mobileMockApp .m13-cal-title{font-size:28px;line-height:1;font-weight:800;letter-spacing:-.05em;color:#123946}
  #mobileMockApp .m13-cal-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
  #mobileMockApp .m13-cal-actions button{
    height:42px;min-width:42px;border:1px solid #dde8e6;border-radius:12px;background:#fff;color:#284750;
    font-size:15px;font-weight:800;box-shadow:0 2px 8px rgba(27,76,80,.04);

  #mobileMockApp .m13-weekday.sat{color:#3487f1}
  #mobileMockApp .m13-day{
    position:relative;min-width:0;height:178px;padding:12px;
    border:1px solid #e0e9e7;border-radius:15px;background:#fff;text-align:left;overflow:hidden;
    transition:.15s ease;
  }
  #mobileMockApp .m13-day:hover{transform:translateY(-2px);border-color:#bfd9d4;box-shadow:0 10px 20px rgba(27,76,80,.07)}
  #mobileMockApp .m13-day.other{background:#fbfcfc;border-color:#eef3f2}
  #mobileMockApp .m13-day.other .m13-daynum{color:#c5cdd1}
  #mobileMockApp .m13-day.selected{border:2px solid #16a091;background:linear-gradient(180deg,#f4fffd,#fff 44%);box-shadow:0 0 0 3px rgba(22,160,145,.06)}

  .m13-desk-events{display:flex;flex-direction:column;gap:5px}
